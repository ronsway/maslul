<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

<title>מסלול — מתכנן אימונים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Rubik:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --ink:#0E1116; --panel:#171B22; --panel2:#1E242E; --line:#2A313D;
    --txt:#E8EBF0; --muted:#8A94A6; --muted2:#5D6675;
    --warm:#F5B845;   /* warmup / cooldown */
    --work:#FF5A3C;   /* hard effort */
    --rec:#35C6B4;    /* recovery / easy */
    --easy:#5FB0FF;   /* steady volume */
    --shadow:0 8px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--ink); color:var(--txt);
    font-family:'Assistant',system-ui,sans-serif; overscroll-behavior-y:none;}
  body{max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:96px;}
  .mono{font-family:'JetBrains Mono',monospace; direction:ltr; unicode-bidi:isolate;}
  .disp{font-family:'Rubik',sans-serif;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}

  /* ---- header ---- */
  header{padding:18px 18px 10px; display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:baseline; gap:9px;}
  .brand h1{font-family:'Rubik'; font-weight:800; font-size:26px; margin:0; letter-spacing:-.5px;}
  .brand .tick{width:11px; height:11px; border-radius:3px;
    background:linear-gradient(135deg,var(--work),var(--warm)); transform:translateY(-2px);}
  .profbtn{width:40px; height:40px; border-radius:50%; background:var(--panel2);
    border:1px solid var(--line); display:grid; place-items:center; font-weight:700; font-size:15px;}
  .hdrbtns{display:flex; align-items:center; gap:8px;}
  .langbtn{height:40px; padding:0 13px; border-radius:20px; background:var(--panel2);
    border:1px solid var(--line); font-weight:700; font-size:13px;}

  /* ---- week nav ---- */
  .weeknav{display:flex; align-items:center; justify-content:space-between; padding:6px 18px 4px;}
  .weeknav .rng{font-family:'Rubik'; font-weight:700; font-size:15px;}
  .weeknav .sub{color:var(--muted); font-size:12px; margin-top:1px;}
  .navbtn{width:34px; height:34px; border-radius:10px; background:var(--panel);
    border:1px solid var(--line); display:grid; place-items:center; color:var(--muted); font-size:18px;
    direction:ltr; unicode-bidi:isolate;}
  .navbtn:active{background:var(--panel2);}

  .strip{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; padding:8px 14px 4px;
    touch-action:pan-y;}
  .day{position:relative; border:1px solid var(--line); background:var(--panel);
    border-radius:13px; padding:9px 0 8px; text-align:center; transition:transform .08s, border-color .15s;}
  .day:active{transform:scale(.96);}
  .day .dn{font-size:12px; color:var(--muted); font-weight:600;}
  .day .dd{font-family:'JetBrains Mono'; font-weight:700; font-size:17px; margin-top:2px;}
  .day.sel{border-color:var(--work); background:linear-gradient(180deg,#241a19,var(--panel));}
  .day.today .dd{color:var(--warm);}
  .day .dots{display:flex; gap:3px; justify-content:center; margin-top:6px; height:6px;}
  .day .dot{width:6px; height:6px; border-radius:50%;}

  /* ---- day detail ---- */
  .detail{padding:14px 18px 4px;}
  .dhead{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
  .dhead .t{font-family:'Rubik'; font-weight:700; font-size:19px;}
  .dhead .n{color:var(--muted); font-size:13px;}

  .empty{border:1.5px dashed var(--line); border-radius:16px; padding:26px 18px;
    text-align:center; color:var(--muted);}
  .empty .big{font-family:'Rubik'; font-weight:700; color:var(--txt); font-size:16px; margin-bottom:4px;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:15px 15px 13px; margin-bottom:12px; box-shadow:var(--shadow);}
  .card .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;}
  .badge{font-family:'Rubik'; font-weight:700; font-size:13px; padding:5px 11px; border-radius:9px;}
  .card .dur{font-family:'JetBrains Mono'; font-weight:700; font-size:14px; color:var(--muted);}

  /* effort profile bar */
  .profile{display:flex; height:34px; border-radius:9px; overflow:hidden; gap:2px; margin-bottom:11px;}
  .seg{min-width:3px;}
  .steps{display:flex; flex-direction:column; gap:7px;}
  .step{display:flex; align-items:center; gap:10px; font-size:14px;}
  .step .pip{width:9px; height:9px; border-radius:3px; flex:none;}
  .step .lbl{flex:1; color:var(--txt);}
  .step .val{font-family:'JetBrains Mono'; font-weight:700; color:var(--muted); font-size:13px;}
  .rep{background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:8px 10px;}
  .rep .rh{display:flex; align-items:center; gap:8px; margin-bottom:6px;
    font-family:'Rubik'; font-weight:700; font-size:13px;}
  .rep .rh .x{font-family:'JetBrains Mono'; color:var(--work);}
  .cardacts{display:flex; gap:8px; margin-top:13px;}
  .cardacts button{flex:1; padding:9px; border-radius:11px; font-weight:700; font-size:14px;
    border:1px solid var(--line); background:var(--panel2);}
  .cardacts .del{color:#ff7a68; border-color:#3a2422;}

  .addbtn{width:100%; padding:14px; border-radius:15px; background:var(--panel);
    border:1px solid var(--line); font-family:'Rubik'; font-weight:700; font-size:15px;
    color:var(--txt); display:flex; align-items:center; justify-content:center; gap:8px;}
  .addbtn .p{color:var(--work); font-size:20px; line-height:0;}
  .addbtn:active{background:var(--panel2);}

  /* ---- send bar ---- */
  .sendbar{position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto;
    padding:12px 18px calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(180deg,rgba(14,17,22,0),var(--ink) 34%);}
  .send{width:100%; padding:15px; border-radius:15px; font-family:'Rubik'; font-weight:800; font-size:16px;
    background:linear-gradient(135deg,var(--work),#ff7b45); color:#1a0d09;
    display:flex; align-items:center; justify-content:center; gap:9px; box-shadow:0 6px 22px rgba(255,90,60,.32);}
  .send:disabled{background:var(--panel); color:var(--muted2); box-shadow:none;}
  .send:active{transform:translateY(1px);}

  /* ---- sheet / modal ---- */
  .scrim{position:fixed; inset:0; background:rgba(6,8,11,.66); backdrop-filter:blur(2px);
    display:none; align-items:flex-end; justify-content:center; z-index:40;}
  .scrim.on{display:flex;}
  .sheet{width:100%; max-width:520px; min-height:82vh; max-height:92vh; overflow-y:auto; background:var(--ink);
    border-radius:22px 22px 0 0; border-top:1px solid var(--line); padding:8px 18px calc(24px + env(safe-area-inset-bottom));
    animation:up .22s ease; box-sizing:border-box;}
  @keyframes up{from{transform:translateY(30px); opacity:.4;} to{transform:none; opacity:1;}}
  .grab{width:40px; height:4px; background:var(--line); border-radius:3px; margin:8px auto 12px;}
  .sheet h2{font-family:'Rubik'; font-weight:800; font-size:20px; margin:2px 0 16px;}

  .types{display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-bottom:18px;}
  .type{border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:13px 12px; text-align:start;}
  .type.on{border-color:var(--work); background:linear-gradient(180deg,#241a19,var(--panel));}
  .type .tn{font-family:'Rubik'; font-weight:700; font-size:15px;}
  .type .td{color:var(--muted); font-size:12px; margin-top:2px;}

  .field{margin-bottom:15px;}
  .field label{display:block; font-size:13px; color:var(--muted); font-weight:600; margin-bottom:7px;}
  .field input{width:100%; background:var(--panel); border:1px solid var(--line); color:var(--txt);
    border-radius:12px; padding:12px; font-family:'Assistant'; font-size:15px;}
  .field input.mono{font-family:'JetBrains Mono';}
  .field input:focus{outline:none; border-color:var(--work);}

  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{width:40px; height:40px; border-radius:11px; background:var(--panel);
    border:1px solid var(--line); font-size:22px; font-weight:700; color:var(--txt);}
  .stepper .v{flex:1; text-align:center; font-family:'JetBrains Mono'; font-weight:700; font-size:17px;}
  .stepper button:active{background:var(--panel2);}

  .blk{background:var(--panel); border:1px solid var(--line); border-radius:15px; padding:13px; margin-bottom:11px;}
  .blk .bh{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;}
  .blk .bt{font-family:'Rubik'; font-weight:700; font-size:14px;}
  .blk .rm{color:#ff7a68; font-size:13px; font-weight:700;}
  .seg2{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:9px;}
  .toggle{display:flex; background:var(--panel2); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .toggle button{flex:1; padding:8px 0; font-size:12px; font-weight:700; color:var(--muted);}
  .toggle button.on{background:var(--work); color:#1a0d09;}
  .minilbl{font-size:11px; color:var(--muted2); margin-bottom:5px; font-weight:600;}

  .addblk{width:100%; padding:11px; border-radius:12px; border:1px dashed var(--line);
    color:var(--muted); font-weight:700; font-size:13px; margin-bottom:16px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .gendays{display:flex; gap:6px; margin-bottom:18px;}
  .gendays button{flex:1; padding:10px 0; border-radius:10px; background:var(--panel);
    border:1px solid var(--line); font-weight:700; font-size:12px; color:var(--muted);}
  .gendays button.on{border-color:var(--work); background:linear-gradient(180deg,#241a19,var(--panel)); color:var(--txt);}
  .primary{width:100%; padding:15px; border-radius:14px; font-family:'Rubik'; font-weight:800; font-size:16px;
    background:linear-gradient(135deg,var(--work),#ff7b45); color:#1a0d09; margin-top:6px;}
  .ghost{width:100%; padding:14px; border-radius:14px; font-weight:700; font-size:15px;
    background:var(--panel); border:1px solid var(--line); color:var(--muted); margin-top:9px;}

  .note{font-size:12.5px; color:var(--muted); line-height:1.55; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin-top:4px;}
  .payload{font-family:'JetBrains Mono'; font-size:11px; direction:ltr; text-align:left; white-space:pre-wrap;
    background:#0a0c10; border:1px solid var(--line); border-radius:12px; padding:12px; max-height:240px; overflow:auto; color:#9fb0c4;}
  .res{border-radius:12px; padding:11px 12px; margin-bottom:8px; font-size:14px; display:flex; justify-content:space-between; gap:10px;}
  .res.ok{background:#12251f; border:1px solid #1e3a30; color:#8fe6cf;}
  .res.err{background:#2a1512; border:1px solid #3a201c; color:#ff9d8c;}

  /* ---- auth gate ---- */
  .gate{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center; gap:22px;}
  .gate .brand h1{font-family:'Rubik'; font-weight:800; font-size:34px; margin:0;}
  .gate .sub{color:var(--muted); font-size:14px; max-width:280px; line-height:1.6;}
  .googlebtn{display:flex; align-items:center; justify-content:center; gap:10px;
    background:#fff; color:#1f1f1f; border-radius:14px; padding:14px 22px;
    font-family:'Rubik'; font-weight:700; font-size:15px; box-shadow:var(--shadow);}
  .googlebtn:active{transform:translateY(1px);}
  .googlebtn svg{width:19px; height:19px;}
  .signout{color:var(--muted); font-size:13px; font-weight:600; margin-top:4px;}
</style>
</head>

<script>
/* ============ storage (localStorage when deployed, memory in preview) ============ */
const store = (()=>{ let mem={}; let ok=true;
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ ok=false; }
  return {
    get(k,d){ try{ const v=ok?localStorage.getItem(k):mem[k]; return v?JSON.parse(v):d; }catch(e){ return d; } },
    set(k,v){ const s=JSON.stringify(v); if(ok){try{localStorage.setItem(k,s);}catch(e){mem[k]=s;}} else mem[k]=s; }
  };
})();

/* ============ config ============ */
const BACKEND_URL='https://maslul-backend.vercel.app/schedule-week';
const SUPABASE_URL='https://qvbdnaeewytfoolmubch.supabase.co';

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

/* ============ auth ============ */
let AUTH={ready:false, session:null};
async function loadCloudData(userId){
  const {data}=await sb.from('user_data').select('plan, profile').eq('user_id',userId).maybeSingle();
  if(data){
    S.plan=data.plan||{};
    S.profile=Object.assign({name:'',maxHR:'',restHR:'',thrPace:'',races:[]}, data.profile||{});
    store.set('plan',S.plan); store.set('profile',S.profile);
  } else {
    await sb.from('user_data').upsert({user_id:userId, plan:S.plan, profile:S.profile});
  }
}
async function signInGoogle(){
  await sb.auth.signInWithOAuth({provider:'google', options:{redirectTo:window.location.origin+window.location.pathname}});
}
async function signOut(){ await sb.auth.signOut(); }
sb.auth.onAuthStateChange(async (event,session)=>{
  AUTH.session=session; AUTH.ready=true;
  if(session && (event==='SIGNED_IN' || event==='INITIAL_SESSION')) await loadCloudData(session.user.id);
  render();
});

function t(k){ return T[k][S.lang]; }

/* ============ helpers ============ */
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9);
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function mmss(sec){ const m=Math.floor(sec/60), s=sec%60; return m+':'+pad(s); }
function startOfWeek(offset){ // Sunday-start week
  const t=new Date(); t.setHours(0,0,0,0);
  t.setDate(t.getDate()-t.getDay()+offset*7); return t;
}
function weekDates(offset){ const s=startOfWeek(offset); return [...Array(7)].map((_,i)=>{const d=new Date(s); d.setDate(s.getDate()+i); return d;}); }

const TYPES={
  intervals:{name:'אינטרוולים', en:'Intervals', desc:'מקטעי מאמץ מהיר עם התאוששות', descEn:'Fast effort segments with recovery', color:'--work'},
  hills:{name:'עליות', en:'Hills', desc:'ריצת עליות עם ג׳וגינג ירידה', descEn:'Hill repeats with jog-down recovery', color:'--work'},
  fartlek:{name:'פארטלק', en:'Fartlek', desc:'משחקי קצב, האצות משתנות', descEn:'Speed play, varying surges', color:'--work'},
  volume:{name:'נפח', en:'Volume', desc:'ריצה רציפה בקצב קל', descEn:'Continuous run at an easy pace', color:'--easy'},
};
function typeLabel(k){ return S.lang==='he'? TYPES[k].name : TYPES[k].en; }
function typeDesc(k){ return S.lang==='he'? TYPES[k].desc : TYPES[k].descEn; }
/* seconds-per-meter estimates, for the visual profile bar only */
const PACE={work:0.27, recovery:0.39, easy:0.36};

const WEEKDAY_EN=['SUN','MON','TUE','WED','THU','FRI','SAT'];
function autoName(type,date){ return pad(date.getDate())+'_'+pad(date.getMonth()+1)+'_'+WEEKDAY_EN[date.getDay()]+'_'+TYPES[type].en; }

function defaultWorkout(type,date){
  const base={id:uid(), type, name:autoName(type,date), warmupSec:600, cooldownSec:600, blocks:[]};
  if(type==='intervals') base.blocks=[{kind:'repeat', reps:6,
    work:{mode:'time', value:180}, recovery:{mode:'time', value:120}}];
  if(type==='hills') base.blocks=[{kind:'repeat', reps:8,
    work:{mode:'time', value:45}, recovery:{mode:'time', value:90}}];
  if(type==='fartlek') base.blocks=[{kind:'repeat', reps:6,
    work:{mode:'time', value:60}, recovery:{mode:'time', value:60}}];
  if(type==='volume'){ base.warmupSec=300; base.cooldownSec=300;
    base.blocks=[{kind:'steady', mode:'time', value:2700}]; }
  return base;
}
/* estimate seconds for any step (for bar widths + total duration) */
function stepSecs(mode,value,kind){ return mode==='time'? value : Math.round(value*PACE[kind]); }
function flattenSteps(w){
  const out=[]; if(w.warmupSec) out.push({intensity:'warm', secs:w.warmupSec});
  w.blocks.forEach(b=>{
    if(b.kind==='repeat'){ for(let i=0;i<b.reps;i++){
      out.push({intensity:'work', secs:stepSecs(b.work.mode,b.work.value,'work')});
      out.push({intensity:'recovery', secs:stepSecs(b.recovery.mode,b.recovery.value,'recovery')});
    }} else out.push({intensity:'easy', secs:stepSecs(b.mode,b.value,'easy')});
  });
  if(w.cooldownSec) out.push({intensity:'warm', secs:w.cooldownSec});
  return out;
}
const COLOR={warm:'--warm', work:'--work', recovery:'--rec', easy:'--easy'};
function totalSecs(w){ return flattenSteps(w).reduce((a,s)=>a+s.secs,0); }
function fmtStep(s){ // for display: "3:00" for time, "400m" for dist
  return s.mode==='time'? mmss(s.value) : s.value+' '+t('meterShort');
}
/* editor input parsing: accepts "3:00" or "180" for time; "400" or "5"/"5km" for distance */
function parseTimeInput(v){
  v=(v||'').trim();
  if(v.includes(':')){ const [m,s]=v.split(':'); return Math.max(0,(parseInt(m)||0)*60+(parseInt(s)||0)); }
  return Math.max(0, parseInt(v)||0);
}
function fmtTimeInput(sec){ return mmss(sec); }
function parseDistInput(v){
  v=(v||'').trim().toLowerCase().replace(',','.');
  if(v.endsWith('km')||v.endsWith('k')||v.includes('.')) return Math.max(0, Math.round((parseFloat(v)||0)*1000));
  return Math.max(0, parseInt(v)||0);
}
function fmtDistInput(m){
  if(m>=1000) return (Math.round(m/100)/10)+'km';
  return String(m);
}

}
function dayWorkouts(date){ return S.plan[ymd(date)]||[]; }

/* ============ auto-generate weekly plan ============ */
/* trainingWeekNumber: how many consecutive populated weeks precede this one (resets after a gap) */
function trainingWeekNumber(offset){
  let n=1, k=offset-1, guard=0;
  while(weekDates(k).some(d=>dayWorkouts(d).length) && guard<52){ n++; k--; guard++; }
  return n;
}
function nextRace(offset){
  const races=(S.profile.races||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const monday=ymd(weekDates(offset)[0]);
  return races.find(r=>r.date>=monday) || null;
}
function weeksToRaceFor(offset){
  const race=nextRace(offset); if(!race) return null;
  const monday=weekDates(offset)[0].getTime();
  const raceD=new Date(race.date+'T00:00:00').getTime();
  return Math.max(0, Math.round((raceD-monday)/(7*86400000)));
}
function phaseFor(w){
  if(w==null) return 'base';
  if(w<=0) return 'race';
  if(w<=3) return 'peak';
  if(w<=8) return 'build';
  return 'base';
}
/* multiplier on the workout-type defaults: progressive growth in base/build,
   every 4th training week is a lighter cutback week, peak/race taper down regardless of week count */
function planFactor(phase, weekNum){
  if(phase==='race') return 0.3;
  if(phase==='peak') return 0.6;
  const deload = weekNum%4===0;
  const growth = Math.min(0.05*(weekNum-1), 0.4);
  let f = deload? 0.7 : (1+growth);
  if(phase==='build') f += 0.1;
  return f;
}
const QUALITY_TYPES=['intervals','hills','fartlek'];
function dayTypesFor(n, phase){
  const q1=QUALITY_TYPES[Math.floor(Math.random()*QUALITY_TYPES.length)];
  let q2=QUALITY_TYPES[Math.floor(Math.random()*QUALITY_TYPES.length)];
  if(q2===q1) q2=QUALITY_TYPES[(QUALITY_TYPES.indexOf(q1)+1)%QUALITY_TYPES.length];
  const templates={
    1:[q1], 2:[q1,'volume'], 3:[q1,'volume','volume'],
    4:[q1,'volume',q2,'volume'], 5:[q1,'volume',q2,'volume','volume'],
    6:[q1,'volume',q2,'volume','volume','volume'], 7:[q1,'volume',q2,'volume','volume','volume','volume'],
  };
  let arr=templates[Math.min(Math.max(n,1),7)] || templates[7];
  if(phase==='peak' || phase==='race') arr=arr.map((tp,i)=>(tp!=='volume' && i>0)?'volume':tp);
  return arr.slice(0,n);
}
function scaleWorkout(w, factor){
  const jitter=0.9+Math.random()*0.2; // slight variety between regenerations
  const f=factor*jitter;
  w=JSON.parse(JSON.stringify(w));
  w.blocks=w.blocks.map(b=>{
    if(b.kind==='steady') b.value=Math.max(600, Math.round(b.value*f/60)*60);
    else if(b.kind==='repeat') b.reps=Math.max(3, Math.min(12, Math.round(b.reps*f)));
    return b;
  });
  return w;
}
function generateWeekPlan(offset, dayIdx){
  const dates=weekDates(offset);
  const weekNum=trainingWeekNumber(offset);
  const wToRace=weeksToRaceFor(offset);
  const phase=phaseFor(wToRace);
  const factor=planFactor(phase, weekNum);
  const sortedDays=dayIdx.slice().sort((a,b)=>a-b);
  const types=dayTypesFor(sortedDays.length, phase);
  const plan={};
  sortedDays.forEach((di,idx)=>{
    const date=dates[di]; const type=types[idx]||'volume';
    plan[ymd(date)]=[scaleWorkout(defaultWorkout(type,date), factor)];
  });
  return {plan, phase, factor, weekNum, weeksToRace:wToRace, race:nextRace(offset)};
}
function genContextNote(offset){
  const race=nextRace(offset), w=weeksToRaceFor(offset), phase=phaseFor(w);
  let s=t('phaseLabel')+PHASE_NAME[phase][S.lang];
  s += race? (t('weeksToRaceNote')+w+t('weeksToRaceSuffix')+race.name) : t('noRaceSet');
  return s;
}

    ${res? `<div style="margin-bottom:10px">${res.map(r=>`<div class="res ${r.ok?'ok':'err'}">
        <span>${r.name} · ${r.date.slice(5)}</span><span class="mono">${r.ok?t('scheduled'):t('errorWord')}</span></div>`).join('')}</div>`:''}

    <button class="primary disp" onclick="sendWeek()">${res?t('sendAgain'):t('sendToGarmin')}</button>
    <button class="ghost" onclick="showPayload()">${t('showPayload')}</button>
    ${S.sheet.payload? `<div class="payload" style="margin-top:12px">${S.sheet.payload}</div>`:''}
    <button class="ghost" onclick="closeSheet()">${t('close')}</button>
  </div></div>`;
}

/* profile sheet */
function profileSheet(){
  const p=S.profile; const rd=S.sheet.raceDraft;
  const races=(p.races||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  return `<div class="scrim on" onclick="if(event.target===this)closeSheet()"><div class="sheet">
    <div class="grab"></div>
    <h2 class="disp">${t('profileTitle')}</h2>
    <div class="field"><label>${t('name')}</label><input value="${p.name||''}" oninput="S.profile.name=this.value"></div>
    <div class="row2">
      <div class="field"><label>${t('maxHR')}</label><input class="mono" inputmode="numeric" value="${p.maxHR||''}" oninput="S.profile.maxHR=this.value"></div>
      <div class="field"><label>${t('restHR')}</label><input class="mono" inputmode="numeric" value="${p.restHR||''}" oninput="S.profile.restHR=this.value"></div>
    </div>
    <div class="field"><label>${t('thrPace')}</label><input class="mono" dir="ltr" value="${p.thrPace||''}" placeholder="4:30" oninput="S.profile.thrPace=this.value"></div>

    <div class="minilbl" style="margin:16px 0 8px">${t('racesTitle')}</div>
    ${races.length? races.map(r=>`<div class="step" style="padding:6px 0">
        <span class="lbl">${r.name} · ${r.date}${r.km?' · '+r.km+'km':''}</span>
        <button class="rm" onclick="delRace('${r.id}')">${t('remove')}</button></div>`).join('')
      : `<div class="note" style="margin-bottom:10px">${t('noRaces')}</div>`}
    <div class="field"><label>${t('raceName')}</label><input value="${rd.name}" oninput="raceDraftField('name',this.value)"></div>
    <div class="row2">
      <div class="field"><label>${t('raceDate')}</label><input class="mono" dir="ltr" type="date" value="${rd.date}" oninput="raceDraftField('date',this.value)"></div>
      <div class="field"><label>${t('raceDist')}</label><input class="mono" inputmode="decimal" value="${rd.km}" oninput="raceDraftField('km',this.value)"></div>
    </div>
    <button class="addblk" onclick="addRace()">${t('addRace')}</button>

    <div class="note">${t('connectedAs')}${AUTH.session?.user?.email||''}${t('syncNote')}</div>
    <button class="primary disp" onclick="saveProfile()" style="margin-top:14px">${t('save')}</button>
    <button class="ghost signout" onclick="signOut()">${t('signOut')}</button>
    <button class="ghost" onclick="closeSheet()">${t('close')}</button>
  </div></div>`;
}

/* ============ actions ============ */
function nav(dir){ S.offset+=dir; render(); }
function pick(i){ S.sel=i; render(); }
function openProfile(){ S.sheet={mode:'profile', raceDraft:{date:'',name:'',km:''}}; render(); }
function saveProfile(){ save(); closeSheet(); }
function closeSheet(){ S.sheet=null; render(); }

function raceDraftField(k,v){ S.sheet.raceDraft[k]=v; }
function addRace(){
  const d=S.sheet.raceDraft;
  if(!d.date || !d.name){ alert(t('raceNeedsFields')); return; }
  S.profile.races=(S.profile.races||[]);
  S.profile.races.push({id:uid(), date:d.date, name:d.name, km:parseFloat(d.km)||0});
  S.sheet.raceDraft={date:'',name:'',km:''};
  save(); render();
}
function delRace(id){
  S.profile.races=(S.profile.races||[]).filter(r=>r.id!==id);
  save(); render();
}

function openGenerate(){
  const prevWk=weekDates(S.offset-1);
  let days=prevWk.map((d,i)=>dayWorkouts(d).length?i:null).filter(i=>i!=null);
  if(!days.length) days=[1,3,5];
  S.sheet={mode:'generate', step:'config', days};
  render();
}
function toggleGenDay(i){
  const days=S.sheet.days; const idx=days.indexOf(i);
  if(idx>=0) days.splice(idx,1); else days.push(i);
  render();
}
function proposeWeek(){
  if(!S.sheet.days.length){ alert(t('pickAtLeastOneDay')); return; }
  S.sheet.proposal=generateWeekPlan(S.offset, S.sheet.days);
  S.sheet.step='preview'; render();
}
function regenerateWeek(){ proposeWeek(); }
function backToGenConfig(){ S.sheet.step='config'; render(); }
function applyGeneratedWeek(){
  Object.assign(S.plan, S.sheet.proposal.plan);
  save(); closeSheet();
}

function openEditor(idx){
  const date=weekDates(S.offset)[S.sel];
  if(idx==null) S.sheet={mode:'edit', editIndex:null, draft:defaultWorkout('intervals',date)};
  else S.sheet={mode:'edit', editIndex:idx, draft:JSON.parse(JSON.stringify(dayWorkouts(date)[idx]))};
  render();
}
function setType(k){ const cur=S.sheet.draft; const date=weekDates(S.offset)[S.sel];
  const nw=defaultWorkout(k,date); nw.id=cur.id; S.sheet.draft=nw; render(); }
function d_name(v){ S.sheet.draft.name=v; }
function bump(key,dir){ const d=S.sheet.draft;
  if(key==='warm') d.warmupSec=Math.max(0,d.warmupSec+dir*60);
  else if(key==='cool') d.cooldownSec=Math.max(0,d.cooldownSec+dir*60);
  else if(key.startsWith('reps')){ const i=+key.slice(4); d.blocks[i].reps=Math.max(1,d.blocks[i].reps+dir); }
  render(); }
function addBlock(){ S.sheet.draft.blocks.push({kind:'repeat', reps:4,
  work:{mode:'time',value:120}, recovery:{mode:'time',value:90}}); render(); }
function rmBlock(i){ S.sheet.draft.blocks.splice(i,1); render(); }
function segMode(i,which,mode){ const b=S.sheet.draft.blocks[i];
  const seg = which==='steady'? b : b[which]; seg.mode=mode;
  if(mode==='dist' && seg.value<50) seg.value=400; render(); }
function segVal(i,which,v){ const b=S.sheet.draft.blocks[i];
  const seg = which==='steady'? b : b[which];
  seg.value = seg.mode==='time'? parseTimeInput(v) : parseDistInput(v); }
function saveWorkout(){
  const date=ymd(weekDates(S.offset)[S.sel]);
  if(!S.plan[date]) S.plan[date]=[];
  if(S.sheet.editIndex==null) S.plan[date].push(S.sheet.draft);
  else S.plan[date][S.sheet.editIndex]=S.sheet.draft;
  save(); closeSheet();
}
function delWorkout(idx){
  const date=ymd(weekDates(S.offset)[S.sel]);
  S.plan[date].splice(idx,1); if(!S.plan[date].length) delete S.plan[date];
  save(); render();
}

/* ---- Garmin payload + send ---- */
function buildPayload(){
  const wk=weekDates(S.offset); const workouts=[];
  wk.forEach(d=>dayWorkouts(d).forEach(w=>{
    workouts.push({ date:ymd(d), name:w.name, type:w.type, sport:'running',
      warmupSec:w.warmupSec, cooldownSec:w.cooldownSec,
      blocks:w.blocks.map(b=> b.kind==='steady'
        ? {kind:'steady', mode:b.mode, value:b.value}
        : {kind:'repeat', reps:b.reps,
           work:{mode:b.work.mode, value:b.work.value},
           recovery:{mode:b.recovery.mode, value:b.recovery.value}} ) });
  }));
  return { athlete:{ name:S.profile.name, maxHR:S.profile.maxHR, restHR:S.profile.restHR }, workouts };
}
function openSend(){ S.sheet={mode:'send', payload:null, result:null}; render(); }
function showPayload(){ S.sheet.payload=JSON.stringify(buildPayload(),null,2); render(); }
async function sendWeek(){
  const url=BACKEND_URL;
  save();
  const headers={'Content-Type':'application/json'};
  try{
    const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(buildPayload())});
    const data=await r.json();
    if(data.error){ alert(t('serverErrorAlert')+data.error); return; }
    S.sheet.result=data.results||[]; render();
  }catch(e){
    alert(t('sendFailedAlert')+e.message+t('sendFailedHint'));
  }
}

/* ---- swipe between weeks ---- */
function attachSwipe(){
  const el=document.getElementById('strip'); if(!el) return;
  let x0=null,y0=null;
  el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX; y0=e.touches[0].clientY;},{passive:true});
  el.addEventListener('touchend',e=>{
    if(x0==null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){ nav(dx<0?1:-1); } // RTL: swipe left -> next week
    x0=y0=null;
  },{passive:true});
}

render();
</script>
</body>
