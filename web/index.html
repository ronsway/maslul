<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Maslul — מתכנן אימונים</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Maslul" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Rubik:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="version.js"></script>
<style>
  :root{
    --ink:#0E1116; --panel:#171B22; --panel2:#1E242E; --line:#2A313D;
    --txt:#E8EBF0; --muted:#8A94A6; --muted2:#5D6675;
    --warm:#F5B845;   /* warmup / cooldown */
    --work:#FF5A3C;   /* hard effort */
    --rec:#35C6B4;    /* recovery / easy */
    --easy:#5FB0FF;   /* steady volume */
    --strength:#A78BFA; /* strength training */
    --yoga:#E893BE;   /* yoga / mobility */
    --crossfit:#C4D600; /* crossfit */
    --shadow:0 8px 30px rgba(0,0,0,.45);
    --del-border:#3a2422;
    --res-ok-bg:#12251f; --res-ok-border:#1e3a30; --res-ok-text:#8fe6cf;
    --res-err-bg:#2a1512; --res-err-border:#3a201c; --res-err-text:#ff9d8c;
    --type-on-bg:linear-gradient(180deg,#241a19,var(--panel));
  }
  :root[data-theme="light"]{
    --ink:#F6F7F9; --panel:#FFFFFF; --panel2:#EEF1F5; --line:#DEE3EA;
    --txt:#1A1F27; --muted:#6B7684; --muted2:#8D96A3;
    --shadow:0 8px 24px rgba(20,25,35,.12);
    --del-border:#ffd3c8;
    --res-ok-bg:#e3f8f1; --res-ok-border:#bdeee0; --res-ok-text:#1a8f6f;
    --res-err-bg:#fdeceb; --res-err-border:#f8cec8; --res-err-text:#c23d2b;
    --type-on-bg:linear-gradient(180deg,#fff1e8,var(--panel));
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--ink); color:var(--txt);
    font-family:'Assistant',system-ui,sans-serif; overscroll-behavior-y:none;}
  body{max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:96px;}
  .mono{font-family:'JetBrains Mono',monospace; direction:ltr; unicode-bidi:isolate;}
  .disp{font-family:'Rubik',sans-serif;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}

  /* ---- header ---- */
  header{padding:18px 18px 10px; display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:baseline; gap:9px;}
  .brand h1{font-family:'Rubik'; font-weight:800; font-size:26px; margin:0; letter-spacing:-.5px;}
  .brand .tick{width:11px; height:11px; border-radius:3px;
    background:linear-gradient(135deg,var(--work),var(--warm)); transform:translateY(-2px);}
  .profbtn{position:relative; width:40px; height:40px; border-radius:50%; background:var(--panel2);
    border:1px solid var(--line); display:grid; place-items:center; font-weight:700; font-size:15px; overflow:hidden; flex:none;}
  .profbtn img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .avatarbig{position:relative; width:64px; height:64px; border-radius:50%; overflow:visible; background:var(--panel2);
    border:1px solid var(--line); display:grid; place-items:center; font-weight:700; font-size:22px; flex:none; padding:0;}
  .avatarbig img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:50%;}
  .avatarbadge{position:absolute; bottom:-2px; inset-inline-end:-2px; width:22px; height:22px; border-radius:50%;
    background:var(--work); color:#1a0d09; display:grid; place-items:center; font-size:11px;
    border:2px solid var(--ink); z-index:1;}
  .hdrbtns{display:flex; align-items:center; gap:8px; flex:none;}
  .langbtn{height:40px; padding:0 13px; border-radius:20px; background:var(--panel2);
    border:1px solid var(--line); font-weight:700; font-size:13px; flex:none;
    display:inline-flex; align-items:center; justify-content:center;}

  /* ---- week nav ---- */
  .weeknav{display:flex; align-items:center; justify-content:space-between; padding:6px 18px 4px;}
  .weeknav .rng{font-family:'Rubik'; font-weight:700; font-size:15px;}
  .rngbtn{background:none; border:none; padding:2px 4px; margin:0; color:inherit;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; cursor:pointer;}
  .navbtn{width:34px; height:34px; border-radius:10px; background:var(--panel);
    border:1px solid var(--line); display:grid; place-items:center; color:var(--muted); font-size:18px;
    direction:ltr; unicode-bidi:isolate;}
  .navbtn:active{background:var(--panel2);}

  .strip{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; padding:8px 14px 4px;
    touch-action:pan-y;}
  .day{position:relative; border:1px solid var(--line); background:var(--panel);
    border-radius:13px; padding:9px 0 8px; text-align:center; transition:transform .08s, border-color .15s;}
  .day:active{transform:scale(.96);}
  .day .dn{font-size:12px; color:var(--muted); font-weight:600;}
  .day .dd{font-family:'JetBrains Mono'; font-weight:700; font-size:17px; margin-top:2px;}
  .day.sel{border-color:var(--work); background:var(--type-on-bg);}
  .day.today .dd{color:var(--warm);}
  .day .dots{display:flex; gap:3px; justify-content:center; margin-top:6px; height:6px;}
  .day .dot{width:6px; height:6px; border-radius:50%;}

  /* ---- day detail ---- */
  .detail{padding:14px 18px 4px;}

  .empty{border:1.5px dashed var(--line); border-radius:16px; padding:26px 18px;
    text-align:center; color:var(--muted);}
  .empty .emoji{font-size:44px; line-height:1; margin-bottom:10px;}
  .empty .big{font-family:'Rubik'; font-weight:700; color:var(--txt); font-size:16px; margin-bottom:4px;}

  .card{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:15px 15px 13px; margin-bottom:12px; box-shadow:var(--shadow);}
  .card.done{border-color:var(--rec);}
  .card.done::after{content:'✓'; position:absolute; top:-8px; inset-inline-end:14px; width:22px; height:22px;
    border-radius:50%; background:var(--rec); color:#062019; font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.35);}
  .card .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;}
  .badge{font-family:'Rubik'; font-weight:700; font-size:13px; padding:5px 11px; border-radius:9px;}
  .card .dur{font-family:'JetBrains Mono'; font-weight:700; font-size:14px; color:var(--muted);}

  /* effort profile bar */
  .profile{display:flex; height:34px; border-radius:9px; overflow:hidden; gap:2px; margin-bottom:11px;}
  .seg{min-width:3px;}
  .steps{display:flex; flex-direction:column; gap:7px;}
  .step{display:flex; align-items:center; gap:10px; font-size:14px;}
  .step .pip{width:9px; height:9px; border-radius:3px; flex:none;}
  .step .lbl{flex:1; color:var(--txt);}
  .step .val{font-family:'JetBrains Mono'; font-weight:700; color:var(--muted); font-size:13px;}
  .rep{background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:8px 10px;}
  .rep .rh{display:flex; align-items:center; gap:8px; margin-bottom:6px;
    font-family:'Rubik'; font-weight:700; font-size:13px;}
  .rep .rh .x{font-family:'JetBrains Mono'; color:var(--work);}
  .cardacts{display:flex; gap:8px; margin-top:13px;}
  .cardacts button{flex:1; padding:9px; border-radius:11px; font-weight:700; font-size:14px;
    border:1px solid var(--line); background:var(--panel2);}
  .cardacts .del{color:#ff7a68; border-color:var(--del-border);}
  .cardacts .donebtn.on{background:var(--rec); color:#062019; border-color:var(--rec);}

  /* ---- weekly km bar ---- */
  .kmbar{padding:2px 18px 10px;}
  .kmbar .track{height:10px; border-radius:6px; background:var(--panel); border:1px solid var(--line); overflow:hidden;}
  .kmbar .fill{height:100%; background:linear-gradient(90deg,var(--work),var(--warm)); border-radius:6px; transition:width .3s ease;}
  .kmbar .lbl{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:6px;}
  .syncicon{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
    border-radius:50%; background:var(--panel2); border:1px solid var(--line); font-size:11px; flex:none;}
  .syncicon:active{background:var(--panel);}

  /* ---- stats sheet ---- */
  .statrow{display:flex; gap:8px;}
  .statbox{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 8px; text-align:center;}
  .statval{font-weight:700; font-size:17px;}
  .statunit{font-size:12px; color:var(--muted); font-weight:600;}
  .statlbl{font-size:11px; color:var(--muted); margin-top:4px;}
  .statsbars{display:flex; align-items:flex-end; gap:5px; height:120px;}
  .statsbars .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end;
    align-items:center; height:100%;}
  .statsbars .track{width:100%; height:100%; display:flex; align-items:flex-end;
    background:var(--panel); border-radius:4px; overflow:hidden; align-self:flex-end;}
  .statsbars .fill{width:100%; background:linear-gradient(180deg,var(--warm),var(--work));}
  .statsbars .wk{font-size:8px; color:var(--muted2); margin-top:5px; writing-mode:horizontal-tb;}

  /* ---- jump-to-date calendar ---- */
  .calnav{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .caltitle{font-weight:700; font-size:16px; padding:6px 12px; border-radius:10px;}
  .caltitle:active{background:var(--panel2);}
  .monthgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .monthcell{padding:16px 4px; border-radius:12px; background:var(--panel); border:1px solid var(--line);
    font-family:'Rubik'; font-weight:700; font-size:14px; color:var(--txt); text-align:center;}
  .monthcell:active{background:var(--panel2);}
  .monthcell.today{border-color:var(--warm); color:var(--warm);}
  .monthcell.sel{border-color:var(--work); background:var(--type-on-bg); color:var(--work);}
  .calgrid{display:grid; grid-template-columns:repeat(7,1fr); row-gap:2px;}
  .calcell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; position:relative;}
  .calcell.dow{font-family:'Assistant'; font-weight:700; font-size:10.5px; letter-spacing:.03em; text-transform:uppercase;
    color:var(--muted); aspect-ratio:auto; padding-bottom:10px;}
  .calcell.day{background:none; border:none; padding:0; margin:0;}
  .calcell.day .num{width:36px; height:36px; max-width:82%; max-height:82%; display:flex; align-items:center; justify-content:center;
    border-radius:50%; font-family:'JetBrains Mono'; font-weight:600; font-size:13.5px; color:var(--txt); transition:background .1s;}
  .calcell.day:active .num{background:var(--panel2);}
  .calcell.day.muted .num{color:var(--muted2);}
  .calcell.day.today .num{border:1.5px solid var(--warm); color:var(--warm); font-weight:800;}
  .calcell.day.sel .num{background:var(--work); color:#1a0d09; font-weight:800;}
  .calcell.day.today.sel .num{box-shadow:0 0 0 2px var(--warm);}
  .calcell.day .dot{position:absolute; bottom:2px; width:4px; height:4px; border-radius:50%; background:var(--easy);}
  .calcell.day.sel .dot{background:#1a0d09;}

  /* ---- race split plan: half-split summary + per-km elapsed/zone rows ---- */
  .racesummary{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:11px;}
  .racesumrow{display:flex; justify-content:space-around; text-align:center;}
  .racesumval{font-family:'JetBrains Mono'; font-weight:700; font-size:15px;}
  .racesumval.faster{color:var(--rec);}
  .racesumval.slower{color:var(--work);}
  .racesumlbl{font-size:10px; color:var(--muted); margin-top:3px; text-transform:uppercase; letter-spacing:.03em;}
  .racesplits{display:flex; flex-direction:column;}
  .racesplitrow{display:grid; grid-template-columns:26px 1fr 1fr 1fr 1fr auto; gap:5px; align-items:center;
    font-size:11.5px; padding:6px 2px; border-bottom:1px solid var(--line);}
  .racesplitrow:last-child{border-bottom:none;}
  .racesplitrow .i{color:var(--muted); font-size:11px; white-space:nowrap;}
  .racesplitrow .v{font-family:'JetBrains Mono'; font-weight:600; color:var(--txt); font-size:11.5px;}
  .racesplitrow.head{padding-bottom:8px; border-bottom:1px solid var(--line);}
  .racesplitrow.head .i, .racesplitrow.head .v{font-family:'Assistant'; font-weight:700; font-size:9.5px;
    color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
  .racesplitrow.finish{background:var(--type-on-bg); border-radius:8px; margin-top:2px; border-bottom:none;}
  .racesplitrow.finish .i{color:var(--txt); font-weight:700;}
  .zonepill{font-size:9px; font-weight:800; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em; flex:none;}
  .zonepill.easy{background:rgba(95,176,255,.15); color:var(--easy);}
  .zonepill.target{background:rgba(245,184,69,.15); color:var(--warm);}
  .zonepill.push{background:rgba(53,198,180,.15); color:var(--rec);}

  .addbtn{width:100%; padding:14px; border-radius:15px; background:var(--panel);
    border:1px solid var(--line); font-family:'Rubik'; font-weight:700; font-size:15px;
    color:var(--txt); display:flex; align-items:center; justify-content:center; gap:8px;}
  .addbtn .p{color:var(--work); font-size:20px; line-height:0;}
  .addbtn:active{background:var(--panel2);}

  /* ---- send bar ---- */
  .sendbar{position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto;
    padding:12px 18px calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(180deg,rgba(14,17,22,0),var(--ink) 34%);}
  .send{width:100%; padding:15px; border-radius:15px; font-family:'Rubik'; font-weight:800; font-size:16px;
    background:linear-gradient(135deg,var(--work),#ff7b45); color:#1a0d09;
    display:flex; align-items:center; justify-content:center; gap:9px; box-shadow:0 6px 22px rgba(255,90,60,.32);}
  .send:disabled{background:var(--panel); color:var(--muted2); box-shadow:none;}
  .send:active{transform:translateY(1px);}

  /* ---- sheet / modal ---- */
  .scrim{position:fixed; inset:0; background:rgba(6,8,11,.66); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
    display:none; align-items:flex-end; justify-content:center; z-index:40;}
  .scrim.on{display:flex;}
  .sheet{width:100%; max-width:520px; min-height:82vh; max-height:92vh; overflow-y:auto; background:var(--ink);
    border-radius:22px 22px 0 0; border-top:1px solid var(--line); padding:8px 18px calc(24px + env(safe-area-inset-bottom));
    animation:up .22s ease; box-sizing:border-box;}
  @supports (height: 100dvh){
    .sheet{min-height:82dvh; max-height:92dvh;}
  }
  .sheet.compact{min-height:0;}
  @supports (height: 100dvh){
    .sheet.compact{min-height:0;}
  }
  .scrim.center{align-items:center;}
  .sheet.dialog{width:calc(100% - 32px); max-width:380px; border-radius:22px;
    border:1px solid var(--line); border-top:1px solid var(--line);
    animation:dialogIn .18s ease;}
  @keyframes dialogIn{from{transform:scale(.96); opacity:0;} to{transform:scale(1); opacity:1;}}
  @keyframes up{from{transform:translateY(30px); opacity:.4;} to{transform:none; opacity:1;}}
  .grab{width:40px; height:4px; background:var(--line); border-radius:3px; margin:8px auto 12px;}
  .sheet h2{font-family:'Rubik'; font-weight:800; font-size:20px; margin:2px 0 16px;}

  /* ---- settings drawer (side panel, direction-aware) ---- */
  .hdrstart{display:flex; align-items:center; gap:10px;}
  .hamburger{width:40px; height:40px; border-radius:12px; background:var(--panel2);
    border:1px solid var(--line); font-size:18px; color:var(--txt); display:grid; place-items:center; flex:none;}
  .drawerscrim{position:fixed; inset:0; background:rgba(6,8,11,.66); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
    z-index:41; animation:scrimIn .22s ease;}
  .drawerscrim.closing{animation:scrimOut .22s ease forwards;}
  @keyframes scrimIn{from{opacity:0;} to{opacity:1;}}
  @keyframes scrimOut{from{opacity:1;} to{opacity:0;}}
  .drawer{position:fixed; top:0; bottom:0; width:min(86vw,380px); background:var(--ink);
    padding:18px 18px calc(20px + env(safe-area-inset-bottom)); overflow-y:auto; box-sizing:border-box;
    box-shadow:0 0 40px rgba(0,0,0,.45);}
  .drawer h2{font-weight:800; font-size:20px; margin:2px 0 16px;}
  .drawer.side-right{right:0; border-left:1px solid var(--line);}
  .drawer.side-right.entering{animation:drawerInR .26s cubic-bezier(.2,.8,.2,1);}
  .drawer.side-right.closing{animation:drawerOutR .22s ease forwards;}
  .drawer.side-left{left:0; border-right:1px solid var(--line);}
  .drawer.side-left.entering{animation:drawerInL .26s cubic-bezier(.2,.8,.2,1);}
  .drawer.side-left.closing{animation:drawerOutL .22s ease forwards;}
  @keyframes drawerInR{from{transform:translateX(100%);} to{transform:translateX(0);}}
  @keyframes drawerOutR{from{transform:translateX(0);} to{transform:translateX(100%);}}
  @keyframes drawerInL{from{transform:translateX(-100%);} to{transform:translateX(0);}}
  @keyframes drawerOutL{from{transform:translateX(0);} to{transform:translateX(-100%);}}

  .types{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px;}
  .type{position:relative; border:1px solid var(--line); background:var(--panel); border-radius:12px;
    padding:13px 6px 10px; text-align:center; overflow:hidden;}
  .type::before{content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--c);}
  .type.on{border-color:var(--work); background:var(--type-on-bg);}
  .type .tn{font-family:'Rubik'; font-weight:700; font-size:12.5px;}
  .type.race{grid-column:1 / -1;}
  /* sport row: icon-only buttons, all 6 sports fit on one line */
  .types.sportrow{grid-template-columns:repeat(6,1fr); gap:5px;}
  .types.sportrow .type{padding:10px 2px 8px;}
  .type .icon{font-size:19px; line-height:1;}

  .field{margin-bottom:15px;}
  .field label{display:block; font-size:13px; color:var(--muted); font-weight:600; margin-bottom:7px;}
  .field input{width:100%; background:var(--panel); border:1px solid var(--line); color:var(--txt);
    border-radius:12px; padding:12px; font-family:'Assistant'; font-size:15px;}
  .field input.mono{font-family:'JetBrains Mono';}
  .field input:focus{outline:none; border-color:var(--work);}
  .field input[type=date]{color-scheme:dark;}
  .field input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer; opacity:.75;}
  :root[data-theme="light"] .field input[type=date]{color-scheme:light;}

  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{width:40px; height:40px; border-radius:11px; background:var(--panel);
    border:1px solid var(--line); font-size:22px; font-weight:700; color:var(--txt);}
  .stepper .v{flex:1; text-align:center; font-family:'JetBrains Mono'; font-weight:700; font-size:17px;}
  .stepper button:active{background:var(--panel2);}

  .fieldhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:7px;}
  .fieldhead label{margin:0;}
  .swtch{position:relative; width:42px; height:25px; border-radius:14px; background:var(--panel2);
    border:1px solid var(--line); flex:none;}
  .swtch .knob{position:absolute; top:2px; inset-inline-start:2px; width:19px; height:19px; border-radius:50%;
    background:var(--muted); transition:inset-inline-start .15s ease, background .15s ease;}
  .swtch.on{background:var(--work); border-color:var(--work);}
  .swtch.on .knob{inset-inline-start:19px; background:#1a0d09;}

  .distchips{display:flex; gap:6px; margin-bottom:8px;}
  .distchips button{flex:1; padding:9px 0; border-radius:9px; background:var(--panel); border:1px solid var(--line);
    font-family:'JetBrains Mono'; font-weight:700; font-size:13px; color:var(--txt);}
  .distchips button.on{border-color:var(--work); background:var(--type-on-bg);}
  .exchips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .exchips button{padding:8px 11px; border-radius:9px; background:var(--panel); border:1px solid var(--line);
    font-family:'Assistant'; font-weight:600; font-size:12.5px; color:var(--txt);}
  .exchips button.on{border-color:var(--strength); background:var(--type-on-bg);}
  .unittoggle{max-width:130px; margin-bottom:8px;}
  .exactinput{margin-top:6px;}
  .exactinput input{width:100%; background:none; border:none; color:var(--muted); font-size:12px;
    text-align:center; padding:2px;}
  .exactinput input:focus{outline:none; color:var(--txt);}

  return {
    get(k,d){ try{ const v=ok?localStorage.getItem(k):mem[k]; return v?JSON.parse(v):d; }catch(e){ return d; } },
    set(k,v){ const s=JSON.stringify(v); if(ok){try{localStorage.setItem(k,s);}catch(e){mem[k]=s;}} else mem[k]=s; }

async function loadCloudData(userId){
  if(pendingSave) await pendingSave; // flush any in-flight write first, or we'd read stale data and clobber it
  const {data}=await sb.from('user_data').select('plan, profile').eq('user_id',userId).maybeSingle();

    const meta=AUTH.session?.user?.user_metadata||{};

    await sb.from('user_data').upsert({user_id:userId, plan:S.plan, profile:S.profile});
  }
}

/* ============ helpers ============ */
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9);
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function daysUntil(dateStr){
  const now=new Date(); now.setHours(0,0,0,0);
  return Math.round((new Date(dateStr+'T00:00:00')-now)/86400000);
}
function fmtRaceDate(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
}

/* rest-day flavor: a different fun emoji+caption per day, picked deterministically
   from the date so it doesn't change on every re-render but still varies day to day */
const REST_DAYS=[
  {emoji:'🧖', he:'יום ספא', en:'Spa day'},
  {emoji:'🛋️', he:'יום ספה', en:'Couch potato day'},
  {emoji:'😴', he:'יום שינה', en:'Nap day'},
  {emoji:'🍩', he:'יום דונאט', en:'Donut day'},
  {emoji:'🎮', he:'יום גיימינג', en:'Gaming day'},
  {emoji:'🍿', he:'יום נטפליקס', en:'Netflix day'},
  {emoji:'🧘', he:'יום זן', en:'Zen day'},
  {emoji:'🦥', he:'יום עצלנות', en:'Sloth day'},
  {emoji:'☕', he:'יום קפה', en:'Coffee day'},
  {emoji:'🏖️', he:'יום חוף', en:'Beach day'},
];
function restDayFlavor(dateStr){
  let h=0; for(let i=0;i<dateStr.length;i++) h=(h*31+dateStr.charCodeAt(i))>>>0;
  return REST_DAYS[h%REST_DAYS.length];
}
function mmss(sec){ const m=Math.floor(sec/60), s=sec%60; return m+':'+pad(s); }
function startOfWeek(offset){ // Sunday-start week
  const t=new Date(); t.setHours(0,0,0,0);
  t.setDate(t.getDate()-t.getDay()+offset*7); return t;
}
function weekDates(offset){ const s=startOfWeek(offset); return [...Array(7)].map((_,i)=>{const d=new Date(s); d.setDate(s.getDate()+i); return d;}); }

function exerciseCategoryLabel(key){
  const c=STRENGTH_CATEGORIES.find(c=>c.key===key) || CROSSFIT_CATEGORIES.find(c=>c.key===key);
  if(!c) return key;
  return S.lang==='he'? c.he : c.en; }
function randInt(min,max){ return min+Math.floor(Math.random()*(max-min+1)); }
function pickRandom(arr,n){ const pool=arr.slice(); const out=[];
  while(out.length<n && pool.length) out.push(pool.splice(randInt(0,pool.length-1),1)[0]);
  return out; }
/* a random WOD: a handful of different movements (never the same set twice in a
   row, since pickRandom doesn't repeat) with varied sets/reps/rest each time -
   "generate" in the editor calls this again for a fresh mix. */
function generateCrossfitExercises(){
  const picks=pickRandom(CROSSFIT_CATEGORIES.map(c=>c.key), randInt(5,6));
  const rests=[30,45,60,90];
  return picks.map(key=>({category:key, sets:randInt(3,5), reps:randInt(8,15), weightKg:null, restSec:rests[randInt(0,rests.length-1)]}));
}
function typeLabel(k){ return S.lang==='he'? TYPES[k].name : TYPES[k].en; }
function typeDesc(k){ return S.lang==='he'? TYPES[k].desc : TYPES[k].descEn; }
function sportLabel(k){ return S.lang==='he'? SPORTS[k].name : SPORTS[k].en; }
/* label for a single continuous (non-repeat) steady block - phrased per sport
   so rowing/elliptical workouts don't say "continuous run" */
function steadyLabel(sport){
  if(sport==='rowing') return t('steadyRow');
  if(sport==='elliptical') return t('steadyElliptical');
  if(sport==='yoga') return t('steadyDuration');
  return t('steadyRun');
}
/* seconds-per-meter estimates, for the visual profile bar only */
const PACE={work:0.27, recovery:0.39, easy:0.36};

const WEEKDAY_EN=['SUN','MON','TUE','WED','THU','FRI','SAT'];
/* running has no sport prefix (it's the implicit default, matches pre-multi-sport
   naming); strength/yoga have no separate kind (type IS the sport), so the sport
   name alone is enough. Only rowing/elliptical + a kind need both parts. */
function autoName(sport,type,date){
  const base=WEEKDAY_EN[date.getDay()]+'_'+pad(date.getDate())+'_'+pad(date.getMonth()+1);
  if(sport==='running' || !CARDIO_SPORTS.includes(sport)) return base+'_'+TYPES[type].en;
  return base+'_'+SPORTS[sport].en+'_'+TYPES[type].en;
}

function defaultWorkout(sport,type,date){
  const base={id:uid(), sport, type, name:autoName(sport,type,date), warmupSec:600, cooldownSec:600, blocks:[], done:false};
  if(type==='intervals') base.blocks=[{kind:'repeat', reps:6,
    work:{mode:'time', value:180}, recovery:{mode:'time', value:120}}];
  if(type==='hills') base.blocks=[{kind:'repeat', reps:8,
    work:{mode:'time', value:45}, recovery:{mode:'time', value:90}}];
  if(type==='fartlek') base.blocks=[{kind:'repeat', reps:6,
    work:{mode:'time', value:60}, recovery:{mode:'time', value:60}}];
  if(type==='tempo'){ // continuous effort at threshold pace - only running has a profile pace to target
    const goalPaceSec=(sport==='running' && S.profile.thrPace)? parseTimeInput(S.profile.thrPace) : null;
    base.blocks=[{kind:'steady', mode:'time', value:1200, pace:goalPaceSec}];
  }
  if(type==='volume'){ base.warmupSec=0; base.cooldownSec=0;
    // distance is only meaningful for running - other cardio sports stay time-based
    base.blocks = sport==='running'? [{kind:'steady', mode:'dist', value:8000}]
                                    : [{kind:'steady', mode:'time', value:1200}]; }
  if(type==='recovery'){ base.warmupSec=sport==='running'?300:0; base.cooldownSec=sport==='running'?300:0;
    base.blocks=[{kind:'steady', mode:'time', value:1200}]; }
  if(type==='race'){ base.warmupSec=0; base.cooldownSec=0; // a race is always its own independent workout -
    base.raceDistM=5000; base.raceTargetSec=null; base.raceSplit='negative'; // warmup/cooldown are separate entries, see raceDistSection()
    base.blocks=[{kind:'steady', mode:'dist', value:5000}]; }
  if(sport==='yoga'){ base.warmupSec=0; base.cooldownSec=0;
    base.blocks=[{kind:'steady', mode:'time', value:1800}]; }
  if(sport==='strength'){ base.warmupSec=300; base.cooldownSec=0; base.blocks=[];
    base.exercises=[{category:'SQUAT', sets:3, reps:10, weightKg:null, restSec:90}]; }
  if(sport==='crossfit'){ // always warms up and cools down - not optional like strength's toggle
    base.warmupSec=600; base.cooldownSec=300; base.blocks=[];
    base.exercises=generateCrossfitExercises(); }
  return base;
}
/* per-km distance blocks for the race itself, with a mild negative-split pace target
   built from the athlete's threshold pace (profile.thrPace): starts slightly slower
   than goal pace, finishes slightly faster. No thrPace set -> plain unpaced km splits. */
function buildRaceSplits(km){
  const full=Math.floor(km);
  const rem=Math.round((km-full)*1000);
  const segs=[]; for(let i=0;i<full;i++) segs.push(1000);

function raceWorkouts(race){

/* rough seconds per rep, used only to estimate a strength workout's total

const ASSUMED_SEC_PER_REP=3.5;

/* rough total km for a workout, using the same PACE constants as the visual profile bar */
function workoutKm(w){

/* ============ stats ============ */

}
function monthStats(){
  const now=new Date(); const y=now.getFullYear(), m=now.getMonth();
  let planned=0, done=0, doneCount=0;
  Object.keys(S.plan).forEach(ds=>{
    const d=new Date(ds+'T00:00:00');

function avgPaceThisMonth(){
  const now=new Date(); const y=now.getFullYear(), m=now.getMonth();
  let totalSec=0, totalKm=0;
  Object.keys(S.plan).forEach(ds=>{
    const d=new Date(ds+'T00:00:00');
    if(d.getFullYear()!==y || d.getMonth()!==m) return;

  if(w.exercises && w.exercises.length){ // sets-of-reps (strength, crossfit) - no blocks
    w.exercises.forEach(ex=>{ for(let i=0;i<ex.sets;i++){
      out.push({intensity:'work', secs:Math.round(ex.reps*ASSUMED_SEC_PER_REP)});

    w.blocks.forEach(b=>{

const COLOR={warm:'--warm', work:'--work', recovery:'--rec', easy:'--easy'};

function fmtKm(m){ return (m%1000===0?(m/1000):(Math.round(m/10)/100))+' '+t('kmShort'); }
/* editor input parsing: accepts "3:00" or "180" for time; "400" or "5"/"5km" for distance */
function parseTimeInput(v){
  v=(v||'').trim();

}
function fmtTimeInput(sec){ return mmss(sec); }
function parseDistInput(v){
  v=(v||'').trim().toLowerCase().replace(',','.');

  return Math.max(0, parseInt(v)||0);
}

}

function parseTargetTime(v){

/* +-4% pace swing tip-to-tip across the race, spread evenly by km */
function splitFactor(strategy, t){

  const grad=0.04;
  return strategy==='negative'? grad*(1-2*t) : -grad*(1-2*t);
}
function buildTargetSplits(km, targetSec, strategy){
  const full=Math.floor(km);

  const segs=[]; for(let i=0;i<full;i++) segs.push(1000);
  if(rem>10) segs.push(rem);
  const n=segs.length;
  const avgPaceSecPerKm=targetSec/km;
  return segs.map((meters,i)=>{
    const t=n>1? i/(n-1) : 0.5;

function raceSplitSummary(w){

  const secondHalfSec=cum-(firstHalfSec||0);

  return `<div class="racesummary">

      <div><div class="racesumval">${mmss(firstHalfSec||0)}</div><div class="racesumlbl">${t('firstHalfWord')}</div></div>

/* ============ auto-generate weekly plan ============ */
/* trainingWeekNumber: how many consecutive populated weeks precede this one (resets after a gap) */
/* how many consecutive weeks of REAL training precede this one - not just planned,
   a week only counts if at least 70% of its planned km actually got done (via the
   Garmin sync). An empty week or a mostly-skipped week breaks the streak, so the
   next proposal doesn't keep escalating load on top of training that didn't happen. */
const PROGRESSION_COMPLETION_THRESHOLD=0.7;
function trainingWeekNumber(offset){
  let n=1, k=offset-1, guard=0;
  while(guard<52){
    const stats=weekStats(k);
    if(stats.planned<=0) break;
    if(stats.done/stats.planned < PROGRESSION_COMPLETION_THRESHOLD) break;
    n++; k--; guard++;
  }
  return n;
}
function nextRace(offset){
  const races=(S.profile.races||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const monday=ymd(weekDates(offset)[0]);
  return races.find(r=>r.date>=monday) || null;
}
function weeksToRaceFor(offset){
  const race=nextRace(offset); if(!race) return null;
  const monday=weekDates(offset)[0].getTime();
  const raceD=new Date(race.date+'T00:00:00').getTime();
  return Math.max(0, Math.round((raceD-monday)/(7*86400000)));

function phaseFor(w){

  if(w<=8) return 'build';
  return 'base';
}
/* multiplier on the workout-type defaults: progressive growth in base/build,
   every 4th training week is a lighter cutback week, peak/race taper down regardless of week count */
function planFactor(phase, weekNum){
  if(phase==='race') return 0.3;
  if(phase==='peak') return 0.6;
  const deload = weekNum%4===0;
  const growth = Math.min(0.05*(weekNum-1), 0.4);
  let f = deload? 0.7 : (1+growth);

const QUALITY_TYPES=['intervals','tempo','hills','fartlek'];
const EASY_TYPES=['volume','volume','recovery']; // weighted toward volume, recovery for variety
function qualityCount(n, phase){
  if(n<=0) return 0;
  if(phase==='race') return 0; // no hard efforts the week you're racing
  if(phase==='peak') return 1;

/* choose which day-positions get a quality session, spread apart where possible,
   randomized so regenerating doesn't always land on the same days */
function pickQualityPositions(n, count){
  const positions=[...Array(n).keys()];
  const shuffled=positions.slice().sort(()=>Math.random()-0.5);
  const chosen=[];
  for(const p of shuffled){
    if(chosen.length>=count) break;
    if(n<=2 || chosen.every(c=>Math.abs(c-p)>=2)) chosen.push(p);
  }
  for(const p of shuffled){ if(chosen.length>=count) break; if(!chosen.includes(p)) chosen.push(p); }

  const count=qualityCount(n, phase);
  const qPositions=pickQualityPositions(n, count);
  const qualityChoices=[]; let lastQ=null;
  for(let i=0;i<count;i++){
    let q=QUALITY_TYPES[Math.floor(Math.random()*QUALITY_TYPES.length)];
    if(q===lastQ) q=QUALITY_TYPES[(QUALITY_TYPES.indexOf(q)+1)%QUALITY_TYPES.length];
    qualityChoices.push(q); lastQ=q;
  }
  const arr=[]; let qi=0;
  for(let i=0;i<n;i++){
    if(qPositions.includes(i)){ arr.push(qualityChoices[qi]); qi++; }
    else arr.push(EASY_TYPES[Math.floor(Math.random()*EASY_TYPES.length)]);
  }

    if(b.kind==='steady') b.value=Math.max(600, Math.round(b.value*f/60)*60);

  const el=document.createElement('div');

function renderDay(date){
  const ws=dayWorkouts(date);

function renderCard(w,idx){
  const steps=flattenSteps(w); const total=steps.reduce((a,s)=>a+s.secs,0);
  const bar=steps.map(s=>`<div class="seg" style="flex:${s.secs}; background:var(${COLOR[s.intensity]})"></div>`).join('');
  const col=TYPES[w.type].color;
  return `<div class="card ${w.done?'done':''}">
    <div class="top">
      <span class="badge" style="background:var(${col}); color:#160b08">${w.name}</span>
      <span class="dur">${mmss(total)} · ~${Math.round(total/60)} ${t('min')}</span>
    </div>
    <div class="profile">${bar}</div>
    ${w.actual? `<button class="actualnote" onclick="openRunDetail(${idx})">
      <span>${w.actual.matchedByDate?'~ ':''}${t('actualLabel')}: ${w.actual.distanceKm} ${t('kmShort')} · ${mmss(w.actual.paceSecPerKm||0)}/${t('kmShort')}${w.actual.avgHR?' · '+Math.round(w.actual.avgHR)+' HR':''}${scoreWorkout(w)!=null?' · '+t('scoreLabel')+' '+scoreWorkout(w)+'%':''}</span>
      <span class="nrarrow">${drillArrow()}</span>
    </button>` : ''}
    ${w.type==='race' && w.raceTargetSec && w.blocks.length>1? raceSplitSummary(w) : ''}
    <div class="steps">
      ${w.raceAux? `<div class="step"><span class="pip" style="background:var(--warm)"></span>
        <span class="lbl">${w.raceAux==='warm'?t('warmup'):t('cooldown')}</span><span class="val">${mmss(w.blocks[0].value)}</span></div>`
      : (w.exercises && w.exercises.length)? renderExerciseSteps(w)
      : (w.type==='race' && w.blocks.length>1 && w.blocks[0].pace? renderRaceSplits(w) : `
      ${w.warmupSec>0? `<div class="step"><span class="pip" style="background:var(--warm)"></span>
        <span class="lbl">${t('warmup')}</span><span class="val">${mmss(w.warmupSec)}</span></div>` : ''}
      ${w.blocks.map((b,i)=>renderBlockView(b,i,w.blocks.length,w.sport)).join('')}
      ${w.cooldownSec>0? `<div class="step"><span class="pip" style="background:var(--warm)"></span>
        <span class="lbl">${t('cooldown')}</span><span class="val">${mmss(w.cooldownSec)}</span></div>` : ''}`)}

      <button class="donebtn ${w.done?'on':''}" onclick="toggleDone(${idx})">${w.done?'✓ '+t('doneWord'):t('markDone')}</button>

}
function renderBlockView(b, idx, total, sport){
  if(b.kind==='steady'){
    const isSplit=total>1;
    const label=isSplit? (t('kmShort')+' '+(idx+1)) : steadyLabel(sport);
    const val=isSplit? fmtKm(b.value) : fmtStep(b);
    const paceStr=b.pace? ' · '+mmss(b.pace)+'/'+t('kmShort') : '';
    return `<div class="step"><span class="pip" style="background:var(--easy)"></span>
      <span class="lbl">${label}</span><span class="val">${val}${paceStr}</span></div>`;
  }
  return `<div class="rep">
    <div class="rh"><span class="x mono">${b.reps}×</span> ${t('reps')}</div>
    <div class="step"><span class="pip" style="background:var(--work)"></span>
      <span class="lbl">${t('effort')}</span><span class="val">${fmtStep(b.work)}</span></div>
    <div class="step"><span class="pip" style="background:var(--rec)"></span>
      <span class="lbl">${t('recovery')}</span><span class="val">${fmtStep(b.recovery)}</span></div>
  </div>`;
}
function renderExerciseSteps(w){
  const col=w.sport==='crossfit'? '--crossfit' : '--strength';
  return (w.exercises||[]).map(ex=>{
    const weightStr=ex.weightKg? ' · '+ex.weightKg+' '+t('kgShort') : '';
    return `<div class="step"><span class="pip" style="background:var(${col})"></span>
      <span class="lbl">${exerciseCategoryLabel(ex.category)}</span>
      <span class="val">${ex.sets}×${ex.reps}${weightStr}</span></div>`;

}

function renderSheet(){
  if(!S.sheet) return `<div class="scrim"></div>`;
  if(S.sheet.mode==='edit') return editorSheet();
  if(S.sheet.mode==='send') return sendSheet();
  if(S.sheet.mode==='profile') return profileSheet();
  if(S.sheet.mode==='zones') return zonesSheet();
  if(S.sheet.mode==='races') return racesSheet();
  if(S.sheet.mode==='generate') return S.sheet.step==='preview'? generatePreviewSheet() : generateConfigSheet();
  if(S.sheet.mode==='stats') return statsSheet();
  if(S.sheet.mode==='datejump') return dateJumpSheet();
  if(S.sheet.mode==='run') return runSheet();
  return `<div class="scrim"></div>`;
}
function openStats(){ if(S.sheet && S.sheet.mode==='stats') return; S.sheet={mode:'stats'}; render(); }
function openRunDetail(idx){
  S.sheet={mode:'run', idx, splits:null, splitsLoading:false, splitsError:null};
  render();
  loadRunSplits();
}
async function loadRunSplits(){
  const date=ymd(weekDates(S.offset)[S.sel]);
  const w=(S.plan[date]||[])[S.sheet.idx];
  if(!w || !w.actual || !w.actual.activityId) return;
  S.sheet.splitsLoading=true; render();
  try{
    const r=await fetch(`${BACKEND_BASE}/activity-splits?activityId=${w.actual.activityId}`);
    const data=await r.json();
    if(!S.sheet || S.sheet.mode!=='run') return; // sheet closed while the request was in flight
    S.sheet.splits=data.splits||[];
    S.sheet.splitsError=data.error||null;
  }catch(e){
    if(S.sheet && S.sheet.mode==='run') S.sheet.splitsError=e.message;
  }finally{
    if(S.sheet && S.sheet.mode==='run') S.sheet.splitsLoading=false;
    render();
  }
}

/* custom calendar for "jump to date" - a native <input type=date> picker can't

/* tapping the month/year title drops into this year-at-a-time month grid -
   reaching a distant date by only clicking the day-view's month arrows would
   take dozens of taps, this gets there in two: pick the year, pick the month */
function monthPickSheet(){
  const {viewYear}=S.sheet;
  const M=MONTHS_I18N[S.lang];
  const todayY=new Date().getFullYear(), todayM=new Date().getMonth();
  const selDate=weekDates(S.offset)[S.sel];
  const prevArrow=S.lang==='he'?'›':'‹', nextArrow=S.lang==='he'?'‹':'›';
  return `<div class="scrim on center" onclick="if(event.target===this)closeSheet()"><div class="sheet compact dialog">
    <h2 class="disp">${t('jumpToDate')}</h2>
    <div class="calnav">
      <button class="navbtn" onclick="dateJumpYearNav(-1)">${prevArrow}</button>
      <div class="caltitle disp">${viewYear}</div>
      <button class="navbtn" onclick="dateJumpYearNav(1)">${nextArrow}</button>
    </div>
    <div class="monthgrid">
      ${M.map((mn,i)=>{
        const cls=['monthcell'];
        if(viewYear===todayY && i===todayM) cls.push('today');
        if(viewYear===selDate.getFullYear() && i===selDate.getMonth()) cls.push('sel');
        return `<button class="${cls.join(' ')}" onclick="dateJumpPickMonth(${i})">${mn}</button>`;
      }).join('')}
    </div>
    <div style="display:flex; gap:8px; margin-top:16px">
      <button class="ghost" style="margin:0; flex:1" onclick="dateJumpPick('${ymd(new Date())}')">${t('todayWord')}</button>
      <button class="ghost" style="margin:0; flex:1" onclick="closeSheet()">${t('close')}</button>
    </div>
  </div></div>`;
}
function dayPickSheet(){
  const {viewYear, viewMonth}=S.sheet;
  const startDow=new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth=new Date(viewYear, viewMonth+1, 0).getDate();
  const prevMonthDays=new Date(viewYear, viewMonth, 0).getDate();
  const todayStr=ymd(new Date());
  const selDateStr=ymd(weekDates(S.offset)[S.sel]);
  const M=MONTHS_I18N[S.lang];
  const prevArrow=S.lang==='he'?'›':'‹', nextArrow=S.lang==='he'?'‹':'›';

  // build a full 7-wide grid including muted lead-in/trail-off days from the
  // adjacent months, so the grid always looks balanced instead of leaving
  // blank gaps before the 1st or a ragged last row
  const cells=[];
  for(let i=startDow-1;i>=0;i--){
    let y=viewYear, m=viewMonth-1; if(m<0){ m=11; y--; }
    cells.push({d:prevMonthDays-i, y, m, muted:true});
  }
  for(let d=1; d<=daysInMonth; d++) cells.push({d, y:viewYear, m:viewMonth, muted:false});
  let nextDay=1;
  while(cells.length%7!==0){
    let y=viewYear, m=viewMonth+1; if(m>11){ m=0; y++; }
    cells.push({d:nextDay++, y, m, muted:true});
  }

  return `<div class="scrim on center" onclick="if(event.target===this)closeSheet()"><div class="sheet compact dialog">
    <h2 class="disp">${t('jumpToDate')}</h2>
    <div class="calnav">
      <button class="navbtn" onclick="dateJumpNav(-1)">${prevArrow}</button>
      <button class="caltitle disp" onclick="dateJumpToggleView()">${M[viewMonth]} ${viewYear}</button>
      <button class="navbtn" onclick="dateJumpNav(1)">${nextArrow}</button>
    </div>
    <div class="calgrid">
      ${DAYS[S.lang].map(dn=>`<div class="calcell dow">${dn}</div>`).join('')}
      ${cells.map(c=>{
        const dateStr=c.y+'-'+pad(c.m+1)+'-'+pad(c.d);
        const hasWorkout=(S.plan[dateStr]||[]).length>0;
        const cls=['calcell','day'];
        if(c.muted) cls.push('muted');
        if(dateStr===todayStr) cls.push('today');
        if(dateStr===selDateStr) cls.push('sel');
        return `<button class="${cls.join(' ')}" onclick="dateJumpPick('${dateStr}')">
          <span class="num">${c.d}</span>${hasWorkout?'<span class="dot"></span>':''}
        </button>`;
      }).join('')}
    </div>
    <div style="display:flex; gap:8px; margin-top:16px">
      <button class="ghost" style="margin:0; flex:1" onclick="dateJumpPick('${todayStr}')">${t('todayWord')}</button>
      <button class="ghost" style="margin:0; flex:1" onclick="closeSheet()">${t('close')}</button>
    </div>
  </div></div>`;
}

/* run detail sheet: everything Garmin gave us for one completed run, plus
   lazily-fetched km splits (kept out of /activities since that's one extra
   Garmin request per run - only worth it once the user actually opens this) */
function runSheet(){
  const date=ymd(weekDates(S.offset)[S.sel]);
  const w=(S.plan[date]||[])[S.sheet.idx];
  if(!w || !w.actual){
    return `<div class="scrim on" onclick="if(event.target===this)closeSheet()"><div class="sheet">
      <div class="grab"></div>
      <button class="ghost" onclick="closeSheet()">${t('close')}</button>
    </div></div>`;
  }
  const a=w.actual;
  const stats=[
    [a.distanceKm!=null? a.distanceKm+' '+t('kmShort') : '—', t('distanceLabel')],
    [a.durationSec!=null? mmss(a.durationSec) : '—', t('durationLabel')],
    [a.paceSecPerKm? mmss(a.paceSecPerKm)+'/'+t('kmShort') : '—', t('paceLabel')],
    [a.avgHR!=null? Math.round(a.avgHR) : '—', t('avgHRLabel')],
    [a.maxHR!=null? Math.round(a.maxHR) : '—', t('maxHR')],
    [a.calories!=null? Math.round(a.calories) : '—', t('caloriesLabel')],
    [a.elevationGainM!=null? Math.round(a.elevationGainM)+t('meterShort') : '—', t('elevGainLabel')],
    [a.elevationLossM!=null? Math.round(a.elevationLossM)+t('meterShort') : '—', t('elevLossLabel')],
    [a.avgCadence!=null? Math.round(a.avgCadence) : '—', t('cadenceLabel')],
    [a.aerobicTrainingEffect!=null? a.aerobicTrainingEffect.toFixed(1) : '—', t('aerobicLabel')],
    [a.anaerobicTrainingEffect!=null? a.anaerobicTrainingEffect.toFixed(1) : '—', t('anaerobicLabel')],
  ];
  const sc=scoreWorkout(w);
  if(sc!=null) stats.push([sc+'%', t('scoreLabel')]);

  const splits=S.sheet.splits;
  const splitsBody = S.sheet.splitsLoading
    ? `<div class="note">${t('loadingWord')}</div>`
    : (splits && splits.length
        ? `<div class="splits">
            <div class="splitrow head"><span>#</span><span>${t('kmShort')}</span><span>${t('paceLabel')}</span><span>HR</span><span>⛰</span></div>
            ${splits.map(s=>`<div class="splitrow">
              <span class="i">${s.index}</span>
              <span class="v">${s.distanceKm!=null? s.distanceKm.toFixed(2) : '—'}</span>
              <span class="v">${s.paceSecPerKm? mmss(s.paceSecPerKm) : '—'}</span>
              <span class="v">${s.avgHR!=null? Math.round(s.avgHR) : '—'}</span>
              <span class="v">${s.elevationGainM!=null? Math.round(s.elevationGainM) : '—'}</span>
            </div>`).join('')}
          </div>`
        : `<div class="note">${S.sheet.splitsError || t('splitsEmpty')}</div>`);

  return `<div class="scrim on" onclick="if(event.target===this)closeSheet()"><div class="sheet">
    <div class="grab"></div>
    <h2 class="disp">${w.name}</h2>
    ${a.matchedByDate? `<div class="note" style="margin-bottom:12px">${t('matchedByDateNote')}</div>` : ''}
    <div class="statrow" style="flex-wrap:wrap; gap:8px">
      ${stats.map(([v,l])=>`<div class="statbox" style="flex:1 1 28%; min-width:88px">
        <div class="statval mono">${v}</div><div class="statlbl">${l}</div>
      </div>`).join('')}
    </div>
    <div class="minilbl" style="margin:18px 0 8px">${t('splitsTitle')}</div>
    ${splitsBody}
    <button class="ghost" onclick="closeSheet()" style="margin-top:16px">${t('close')}</button>
  </div></div>`;
}

const RUN_DIST_CHIPS_KM=[5,10,21.1,42.2];
const CARDIO_DIST_CHIPS_KM=[1,3,5,8,10]; // typical erg/elliptical session distances - not running race distances
/* races are always run for a distance, never a duration, so the race editor
   skips the normal time/distance toggle entirely and offers standard race
   distances instead of the generic training-run chip set. */
const RACE_DIST_CHIPS_KM=[5,10,15,21.1,42.2];
function raceChipLabel(km){
  if(km===21.1) return 'HM';
  if(km===42.2) return 'M';
  return km+' '+t('kmShort');
}
function raceDistSection(d){
  // race workouts auto-generated via Settings > Races (raceWorkouts()) don't carry
  // raceDistM - back-fill it from the existing blocks so editing one here doesn't break
  if(d.raceDistM==null) d.raceDistM=Math.round(d.blocks.reduce((a,b)=>a+(b.mode==='dist'?b.value:0),0))||5000;
  const dispVal=Math.round(d.raceDistM/100)/10;
  const isNew=S.sheet.editIndex==null;
  const rw=S.sheet.raceWarmup||{on:false,min:15}, rc=S.sheet.raceCooldown||{on:false,min:15};
  const strat=d.raceSplit||'negative';
  return `<div class="minilbl" style="margin:4px 0 8px">${t('raceDistanceLabel')}</div>
    <div class="distchips">
      ${RACE_DIST_CHIPS_KM.map(km=>`<button class="${d.raceDistM===Math.round(km*1000)?'on':''}" onclick="raceDistPick(${km})">${raceChipLabel(km)}</button>`).join('')}
    </div>
    <div class="stepper">
      <button onclick="raceDistStep(-1)">−</button>
      <div class="v mono">${dispVal} ${t('kmShort')}</div>
      <button onclick="raceDistStep(1)">+</button>
    </div>
    <div class="exactinput"><input class="mono" dir="ltr" value="${fmtDistInput(d.raceDistM)}" placeholder="${t('distHint')}"
      oninput="raceDistInput(this.value)"></div>

    <div class="field" style="margin-top:15px">
      <label>${t('raceTargetLabel')}</label>
      <input class="mono" dir="ltr" value="${d.raceTargetSec?mmss(d.raceTargetSec):''}" placeholder="50:00"
        oninput="raceTargetInput(this.value)">
    </div>
    <div class="minilbl" style="margin-bottom:8px">${t('splitStrategyLabel')}</div>
    <div class="toggle" style="margin-bottom:${d.raceTargetSec?'15px':'6px'}">
      <button class="${strat==='negative'?'on':''}" onclick="setRaceSplit('negative')">${t('negativeSplit')}</button>
      <button class="${strat==='even'?'on':''}" onclick="setRaceSplit('even')">${t('evenSplit')}</button>
      <button class="${strat==='positive'?'on':''}" onclick="setRaceSplit('positive')">${t('positiveSplit')}</button>
    </div>
    ${!d.raceTargetSec? `<div class="minilbl" style="text-transform:none; letter-spacing:normal; margin-bottom:15px">${t('splitNeedsTargetHint')}</div>` : ''}
    ${isNew? `
    <div class="field" style="margin-bottom:11px">
      <div class="fieldhead"><label>${t('raceIncludeWarmup')}</label>
        <div class="swtch ${rw.on?'on':''}" onclick="toggleRaceWarmup()"><span class="knob"></span></div></div>
      ${rw.on? stepperHTML('raceWarm', rw.min) : ''}
    </div>
    <div class="field">
      <div class="fieldhead"><label>${t('raceIncludeCooldown')}</label>
        <div class="swtch ${rc.on?'on':''}" onclick="toggleRaceCooldown()"><span class="knob"></span></div></div>
      ${rc.on? stepperHTML('raceCool', rc.min) : ''}
    </div>` : ''}`;
}
function regenRaceBlocks(d){
  const km=d.raceDistM/1000;
  d.blocks = d.raceTargetSec? buildTargetSplits(km, d.raceTargetSec, d.raceSplit||'negative')
    : [{kind:'steady', mode:'dist', value:d.raceDistM}];
}
/* strength workouts are sets-of-reps, not time/distance - kept in d.exercises
   instead of d.blocks (which stays [] for this type) so every other function
   that walks blocks (workoutKm, flattenSteps, the backend Block model) keeps
   its existing time/dist contract instead of growing a third shape. */
function strengthSection(d){
  if(!d.exercises || !d.exercises.length) d.exercises=[{category:'SQUAT', sets:3, reps:10, weightKg:null, restSec:90}];
  const rows=d.exercises.map((ex,i)=>`
    <div class="blk">
      <div class="bh"><span class="bt">${exerciseCategoryLabel(ex.category)}</span>
        <button class="rm" onclick="rmExercise(${i})">${t('remove')}</button></div>
      <div class="exchips">
        ${STRENGTH_CATEGORIES.map(c=>`<button class="${ex.category===c.key?'on':''}" onclick="exerciseCategory(${i},'${c.key}')">${exerciseCategoryLabel(c.key)}</button>`).join('')}
      </div>
      <div class="seg2" style="margin-top:11px">
        <div><div class="minilbl">${t('setsLabel')}</div>${stepperHTML('exSets'+i, ex.sets)}</div>
        <div><div class="minilbl">${t('repsLabel')}</div>${stepperHTML('exReps'+i, ex.reps)}</div>
      </div>
      <div class="field" style="margin-top:11px; margin-bottom:0">

      <div class="field" style="margin-top:11px; margin-bottom:0">
        <label>${t('weightLabel')}</label>

      </div>
    </div>`).join('');
  return `<div class="minilbl" style="margin:4px 0 8px">${t('exercisesLabel')}</div>
    ${rows}
    <button class="addblk" onclick="addExercise()">${t('addExercise')}</button>
    <div class="field" style="margin-top:15px">
      <div class="fieldhead"><label>${t('warmupMin')}</label>
        <div class="swtch ${d.warmupSec>0?'on':''}" onclick="toggleWarmCool('warm')"><span class="knob"></span></div></div>
      ${d.warmupSec>0? stepperHTML('warm', Math.round(d.warmupSec/60)) : ''}
    </div>`;
}
/* crossfit reuses strength's exercises shape (sets/reps/weight/rest) but from a
   broader, conditioning-flavored category pool, always keeps warmup+cooldown
   (no on/off toggle - unlike strength's optional warmup), and is meant to be
   used via "generate" (generateCrossfitExercises()), not built by hand - so it
   defaults to a read-only summary of the generated WOD rather than the same
   exposed chips/steppers editor strength uses. The full editor is still one
   tap away (crossfitEditMode) for anyone who does want to tweak a movement. */
function crossfitSection(d){
  if(!d.exercises || !d.exercises.length) d.exercises=generateCrossfitExercises();
  const editing=!!S.sheet.crossfitEditMode;
  const summary=`<div class="steps">${d.exercises.map(ex=>`
    <div class="step"><span class="pip" style="background:var(--crossfit)"></span>
      <span class="lbl">${exerciseCategoryLabel(ex.category)}</span>
      <span class="val">${ex.sets}×${ex.reps}${ex.weightKg? ' · '+ex.weightKg+' '+t('kgShort') : ''}</span></div>`).join('')}</div>`;
  const rows=d.exercises.map((ex,i)=>`
    <div class="blk">
      <div class="bh"><span class="bt">${exerciseCategoryLabel(ex.category)}</span>
        <button class="rm" onclick="rmExercise(${i})">${t('remove')}</button></div>
      <div class="exchips">
        ${CROSSFIT_CATEGORIES.map(c=>`<button class="${ex.category===c.key?'on':''}" onclick="exerciseCategory(${i},'${c.key}')">${exerciseCategoryLabel(c.key)}</button>`).join('')}
      </div>
      <div class="seg2" style="margin-top:11px">
        <div><div class="minilbl">${t('setsLabel')}</div>${stepperHTML('exSets'+i, ex.sets)}</div>
        <div><div class="minilbl">${t('repsLabel')}</div>${stepperHTML('exReps'+i, ex.reps)}</div>
      </div>
      <div class="field" style="margin-top:11px; margin-bottom:0">
        <label>${t('restLabel')}</label>
        ${stepperHTML('exRest'+i, ex.restSec)}
      </div>
      <div class="field" style="margin-top:11px; margin-bottom:0">
        <label>${t('weightLabel')}</label>
        <input class="mono" dir="ltr" inputmode="decimal" value="${ex.weightKg??''}" placeholder="${t('weightHint')}" oninput="exerciseWeight(${i},this.value)">
      </div>
    </div>`).join('');
  return `<button class="addblk" onclick="regenerateCrossfit()">${t('generateWorkout')}</button>
    <div class="minilbl" style="margin:14px 0 8px">${t('exercisesLabel')}</div>
    ${editing? rows : summary}
    ${editing? `<button class="addblk" onclick="addExercise()">${t('addExercise')}</button>` : ''}
    <button class="ghost" style="margin-top:11px" onclick="toggleCrossfitEdit()">${editing? t('doneEditing') : t('editManually')}</button>
    <div class="minilbl" style="margin-top:15px">${t('warmupMin')}</div>
    ${stepperHTML('warm', Math.round(d.warmupSec/60))}
    <div class="minilbl" style="margin-top:11px">${t('cooldownMin')}</div>
    ${stepperHTML('cool', Math.round(d.cooldownSec/60))}`;
}
function regenerateCrossfit(){ S.sheet.draft.exercises=generateCrossfitExercises(); render(); }
function toggleCrossfitEdit(){ S.sheet.crossfitEditMode=!S.sheet.crossfitEditMode; render(); }
function addExercise(){ S.sheet.draft.exercises.push({category:'SQUAT', sets:3, reps:10, weightKg:null, restSec:90}); render(); }
function rmExercise(i){ S.sheet.draft.exercises.splice(i,1); render(); }
function exerciseCategory(i,key){ S.sheet.draft.exercises[i].category=key; render(); }
// weight typed as free text - no render() here, matches the fixed focus-loss
// pattern: fields that need a live re-render on every keystroke lose focus
// after the first character (see render()'s focus-restore comment above).
function exerciseWeight(i,v){ const n=parseFloat(v); S.sheet.draft.exercises[i].weightKg=isNaN(n)?null:n; }
function raceDistPick(km){ const d=S.sheet.draft; d.raceDistM=Math.round(km*1000); regenRaceBlocks(d); render(); }
function raceDistStep(dir){ const d=S.sheet.draft; const step=d.raceDistM>=1000?500:50;
  d.raceDistM=Math.max(step, d.raceDistM+dir*step); regenRaceBlocks(d); render(); }
function raceDistInput(v){ const d=S.sheet.draft; d.raceDistM=parseDistInput(v); regenRaceBlocks(d); render(); }
function raceTargetInput(v){ const d=S.sheet.draft; d.raceTargetSec=parseTargetTime(v)||null; regenRaceBlocks(d); render(); }
function setRaceSplit(k){ const d=S.sheet.draft; d.raceSplit=k; regenRaceBlocks(d); render(); }
function segEditor(seg,i,which,sport){
  // yoga has no meaningful distance - skip the toggle entirely instead of just
  // defaulting to time, so there's nothing suggesting otherwise
  const allowDist=sport!=='yoga';
  const isTime=seg.mode==='time' || !allowDist;
  const modeToggle=allowDist? `<div class="toggle" style="margin-bottom:7px">
      <button class="${isTime?'on':''}" onclick="segMode(${i},'${which}','time')">${t('timeMode')}</button>
      <button class="${!isTime?'on':''}" onclick="segMode(${i},'${which}','dist')">${t('distMode')}</button>
    </div>` : '';
  if(isTime){
    return modeToggle+`
      <div class="stepper">
        <button onclick="segTimeStep(${i},'${which}',-1)">−</button>
        <div class="v mono">${fmtTimeInput(seg.value)}</div>
        <button onclick="segTimeStep(${i},'${which}',1)">+</button>
      </div>
      <div class="exactinput"><input class="mono" dir="ltr" value="${fmtTimeInput(seg.value)}" placeholder="${t('timeHint')}"
        oninput="segVal(${i},'${which}',this.value)"></div>`;
  }
  const unit=seg.unit||(seg.value>=1000?'km':'m');
  const dispVal=unit==='km'? Math.round(seg.value/100)/10 : seg.value;
  const distChipsKm=sport==='running'? RUN_DIST_CHIPS_KM : CARDIO_DIST_CHIPS_KM;
  const chips=which==='steady'? `<div class="distchips">
      ${distChipsKm.map(km=>`<button class="${unit==='km'&&seg.value===Math.round(km*1000)?'on':''}" onclick="segDistPick(${i},'${which}',${km})">${raceChipLabel(km)}</button>`).join('')}
    </div>` : '';
  return modeToggle+`
    <div class="toggle unittoggle">
      <button class="${unit==='km'?'on':''}" onclick="segUnit(${i},'${which}','km')">${t('kmShort')}</button>
      <button class="${unit==='m'?'on':''}" onclick="segUnit(${i},'${which}','m')">${t('meterShort')}</button>
    </div>
    ${chips}
    <div class="stepper">
      <button onclick="segDistStep(${i},'${which}',-1)">−</button>
      <div class="v mono">${dispVal} ${unit==='km'?t('kmShort'):t('meterShort')}</div>
      <button onclick="segDistStep(${i},'${which}',1)">+</button>
    </div>
    <div class="exactinput"><input class="mono" dir="ltr" value="${fmtDistInput(seg.value)}" placeholder="${t('distHint')}"
      oninput="segVal(${i},'${which}',this.value)"></div>`;
}

/* the drawer's slide-in animation is baked into .drawer.side-*'s CSS via an

   on every call, including from unrelated background renders (auth events,

   replay the slide-in animation each time and look like a double-open blink.

function nav(dir){ S.offset+=dir; render(); }
function pick(i){ S.sel=i; render(); }

function openDateJump(){
  if(S.sheet && S.sheet.mode==='datejump') return;
  const d=weekDates(S.offset)[S.sel];
  S.sheet={mode:'datejump', viewYear:d.getFullYear(), viewMonth:d.getMonth()};

}
function dateJumpNav(dir){
  let {viewYear, viewMonth}=S.sheet;
  viewMonth+=dir;
  if(viewMonth<0){ viewMonth=11; viewYear--; }
  else if(viewMonth>11){ viewMonth=0; viewYear++; }
  S.sheet.viewYear=viewYear; S.sheet.viewMonth=viewMonth;
  render();
}
function dateJumpToggleView(){ S.sheet.calView = S.sheet.calView==='months'? 'days' : 'months'; render(); }
function dateJumpYearNav(dir){ S.sheet.viewYear+=dir; render(); }
function dateJumpPickMonth(m){ S.sheet.viewMonth=m; S.sheet.calView='days'; render(); }
function dateJumpPick(dateStr){
  const target=new Date(dateStr+'T00:00:00');
  const targetSunday=new Date(target); targetSunday.setDate(target.getDate()-target.getDay());
  S.offset=Math.round((targetSunday-startOfWeek(0))/(7*86400000));
  S.sel=target.getDay();
  closeSheet();
}
// guarded so a second rapid trigger of the same open-action (e.g. a duplicate
// touch/click pair firing close together on some devices) reuses the sheet
// already being opened instead of replacing it with a fresh instance - which
// would restart its entrance animation and look like the sheet opened twice.
function openProfile(){ if(S.sheet && S.sheet.mode==='profile') return; S.sheet={mode:'profile', photoMenuOpen:false}; render(); }
function togglePhotoMenu(){ S.sheet.photoMenuOpen=!S.sheet.photoMenuOpen; render(); }
function openZones(){ if(S.sheet && S.sheet.mode==='zones') return; S.sheet={mode:'zones'}; render(); }
function openRaces(){ if(S.sheet && S.sheet.mode==='races') return; S.sheet={mode:'races', raceDraft:{date:'',name:'',km:'',target:'',split:'negative'}}; render(); }
function backToProfile(){ save(); S.sheet={mode:'profile'}; render(); }
function backFromRaces(){
  // "+ Add race" is a separate action from the main add button - if the user
  // filled in a race but never tapped it, closing used to silently discard that
  // draft (it only ever lived in S.sheet, which gets thrown away on close).
  const d=S.sheet && S.sheet.raceDraft;
  if(d && d.date && d.name) addRace();
  closeSheet();
}
function saveProfile(){
  save(); closeSheet();
}
function closeSheet(){
  if(S.sheet && ['profile','zones','races'].includes(S.sheet.mode)){
    if(S.sheet.closing) return;
    S.sheet.closing=true; render();
    setTimeout(()=>{ S.sheet=null; render(); }, 220);
    return;
  }
  S.sheet=null; render();
}

function onPhotoFile(input){
  const file=input.files && input.files[0]; input.value='';
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>openPhotoCropper(img);
    img.onerror=()=>toast(t('photoFailedAlert'),'err');

  };
  reader.onerror=()=>toast(t('photoFailedAlert'),'err');
  reader.readAsDataURL(file);
}
