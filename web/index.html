/* ---- photo crop editor: drag to pan, slider to zoom, over a circular preview
   matching the final avatar shape, so the user picks the framing themselves
   instead of the app blindly center-cropping (which was cutting faces off) ---- */
function openPhotoCropper(img){
  const VIEW=240, OUT=480;
  const overlay=document.createElement('div');
  overlay.className='cropoverlay';
  overlay.innerHTML=`<div class="cropbox">
    <h2 class="disp">${t('cropTitle')}</h2>
    <div class="crophint">${t('cropHint')}</div>
    <div class="cropview" style="width:${VIEW}px; height:${VIEW}px"><img id="cropimg" draggable="false" alt=""></div>
    <input type="range" class="cropzoom" id="cropzoom" min="0" max="1" step="0.001" value="0">
    <div class="croprow">
      <button class="ghost" id="cropcancel">${t('cancel')}</button>
      <button class="primary disp" id="cropsave">${t('save')}</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  const imgEl=overlay.querySelector('#cropimg');
  const zoomEl=overlay.querySelector('#cropzoom');
  const viewEl=overlay.querySelector('.cropview');
  imgEl.src=img.src;

  const minScale=VIEW/Math.min(img.width,img.height);
  const maxScale=minScale*3;
  let scale=minScale, x=0, y=0;

  function apply(){
    imgEl.style.width=(img.width*scale)+'px';
    imgEl.style.height=(img.height*scale)+'px';
    imgEl.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px)`;
  }
  function clamp(){
    const w=img.width*scale, h=img.height*scale;
    const maxX=Math.max(0,(w-VIEW)/2), maxY=Math.max(0,(h-VIEW)/2);
    x=Math.min(maxX,Math.max(-maxX,x));
    y=Math.min(maxY,Math.max(-maxY,y));
  }
  clamp(); apply();

  let dragging=false, sx=0, sy=0, ox=0, oy=0;
  function ptPos(e){ const p=e.touches?e.touches[0]:e; return {cx:p.clientX, cy:p.clientY}; }
  function ptDown(e){ dragging=true; const p=ptPos(e); sx=p.cx; sy=p.cy; ox=x; oy=y; viewEl.style.cursor='grabbing'; }
  function ptMove(e){
    if(!dragging) return;
    const p=ptPos(e);
    x=ox+(p.cx-sx); y=oy+(p.cy-sy);
    clamp(); apply();
    e.preventDefault();
  }
  function ptUp(){ dragging=false; viewEl.style.cursor='grab'; }
  viewEl.addEventListener('mousedown', ptDown);
  window.addEventListener('mousemove', ptMove);
  window.addEventListener('mouseup', ptUp);
  viewEl.addEventListener('touchstart', ptDown, {passive:true});
  viewEl.addEventListener('touchmove', ptMove, {passive:false});
  viewEl.addEventListener('touchend', ptUp);

  zoomEl.addEventListener('input', ()=>{
    scale=minScale+(maxScale-minScale)*parseFloat(zoomEl.value);
    clamp(); apply();
  });

  function cleanup(){
    window.removeEventListener('mousemove', ptMove);
    window.removeEventListener('mouseup', ptUp);
    overlay.remove();
  }
  overlay.querySelector('#cropcancel').onclick=cleanup;
  overlay.querySelector('#cropsave').onclick=()=>{
    const canvas=document.createElement('canvas');
    canvas.width=OUT; canvas.height=OUT;
    const ctx=canvas.getContext('2d');
    const srcSize=VIEW/scale;
    const srcX0=img.width/2 - x/scale - srcSize/2;
    const srcY0=img.height/2 - y/scale - srcSize/2;
    try{
      ctx.drawImage(img, srcX0, srcY0, srcSize, srcSize, 0, 0, OUT, OUT);
      S.profile.photo=canvas.toDataURL('image/jpeg', 0.88);
      save(); render();
    }catch(e){
      // canvas taints on cross-origin images without proper CORS headers (can happen
      // for the Google avatar path) - fall back to using the source image untouched
      S.profile.photo=img.src; save(); render();
    }
    cleanup();
  };
}

function raceDraftField(k,v){ S.sheet.raceDraft[k]=v; }
function raceDraftSplit(k){ S.sheet.raceDraft.split=k; render(); }
function raceDraftDistPick(km){ S.sheet.raceDraft.km=String(km); render(); }
function raceDraftDistStep(dir){
  const rd=S.sheet.raceDraft; let km=parseFloat(rd.km)||0;
  const step=km>=1? 0.5 : 0.05;
  km=Math.max(0.05, Math.round((km+dir*step)*1000)/1000);
  rd.km=String(Math.round(km*1000)/1000); render();
}
function raceDraftDistInput(v){ S.sheet.raceDraft.km=v; render(); }
function syncRaceWorkout(race){
  if(!S.plan[race.date]) S.plan[race.date]=[];
  S.plan[race.date]=S.plan[race.date].filter(w=>w.raceId!==race.id);
  S.plan[race.date].push(...raceWorkouts(race));
}
function addRace(){
  const d=S.sheet.raceDraft;
  if(!d.date || !d.name){ toast(t('raceNeedsFields')); return; }
  S.profile.races=(S.profile.races||[]);
  const editingId=S.sheet.editingRaceId;
  // falls back to a fresh add if editingId doesn't match anything (e.g. the race
  // was deleted from another device before this edit was saved) instead of
  // silently no-op'ing the update
  const old=editingId? S.profile.races.find(r=>r.id===editingId) : null;
  if(old){
    // date changed - the old date's auto-generated warm/main/cool entries would
    // otherwise be orphaned there forever since syncRaceWorkout only touches
    // the (new) race.date below
    if(old.date!==d.date && S.plan[old.date]){
      S.plan[old.date]=S.plan[old.date].filter(w=>w.raceId!==editingId);
      if(!S.plan[old.date].length) delete S.plan[old.date];
    }
    const race={id:editingId, date:d.date, name:d.name, km:parseFloat(d.km)||0, targetSec:parseTargetTime(d.target)||null, split:d.split||'negative'};
    S.profile.races=S.profile.races.map(r=>r.id===editingId? race : r);
    try{ syncRaceWorkout(race); }
    catch(e){ console.error('syncRaceWorkout failed', e); }
  } else {
    const race={id:uid(), date:d.date, name:d.name, km:parseFloat(d.km)||0, targetSec:parseTargetTime(d.target)||null, split:d.split||'negative'};
    S.profile.races.push(race);
    try{ syncRaceWorkout(race); }
    catch(e){ console.error('syncRaceWorkout failed', e); } // race itself is already pushed - still save it below
  }
  S.sheet.editingRaceId=null;
  S.sheet.raceDraft={date:'',name:'',km:'',target:'',split:'negative'};
  save(); render();
}
function editRace(id){
  const race=(S.profile.races||[]).find(r=>r.id===id);
  if(!race) return;
  S.sheet.raceDraft={date:race.date, name:race.name, km:race.km?String(race.km):'',
    target:race.targetSec?mmss(race.targetSec):'', split:race.split||'negative'};
  S.sheet.editingRaceId=id;
  render();
}
function cancelEditRace(){
  S.sheet.raceDraft={date:'',name:'',km:'',target:'',split:'negative'};
  S.sheet.editingRaceId=null;
  render();
}
function delRace(id){
  const race=(S.profile.races||[]).find(r=>r.id===id);
  S.profile.races=(S.profile.races||[]).filter(r=>r.id!==id);
  if(race && S.plan[race.date]){
    S.plan[race.date]=S.plan[race.date].filter(w=>w.raceId!==id);
    if(!S.plan[race.date].length) delete S.plan[race.date];
  }
  if(S.sheet.editingRaceId===id) cancelEditRace();
  save(); render();
}

function openGenerate(){
  const prevWk=weekDates(S.offset-1);
  let days=prevWk.map((d,i)=>dayWorkouts(d).length?i:null).filter(i=>i!=null);
  if(!days.length) days=[1,3,5];
  S.sheet={mode:'generate', step:'config', days};
  render();
}
function toggleGenDay(i){
  const days=S.sheet.days; const idx=days.indexOf(i);
  if(idx>=0) days.splice(idx,1); else days.push(i);
  render();
}
function proposeWeek(){
  if(!S.sheet.days.length){ toast(t('pickAtLeastOneDay')); return; }
  S.sheet.proposal=generateWeekPlan(S.offset, S.sheet.days);
  S.sheet.step='preview'; render();
}
function regenerateWeek(){ proposeWeek(); }
function backToGenConfig(){ S.sheet.step='config'; render(); }
function applyGeneratedWeek(){
  Object.assign(S.plan, S.sheet.proposal.plan);
  save(); closeSheet();
}

function openEditor(idx){
  const date=weekDates(S.offset)[S.sel];
  // raceWarmup/raceCooldown are transient editor-only toggle state, not part of
  // the saved workout - a race is always its own independent workout, so these
  // just control whether saveWorkout() also creates separate warmup/cooldown
  // entries alongside it (only offered when creating, not when editing one).
  if(idx==null) S.sheet={mode:'edit', editIndex:null, draft:defaultWorkout('running','intervals',date),
    raceWarmup:{on:true,min:15}, raceCooldown:{on:false,min:15}};
  else S.sheet={mode:'edit', editIndex:idx, draft:JSON.parse(JSON.stringify(dayWorkouts(date)[idx]))};
  render();
}
/* switching sport keeps the current kind when it still makes sense (e.g. running
   intervals -> rowing intervals); otherwise falls back to a sensible default
   (volume for cardio sports, or the sport itself for strength/yoga, which have
   no separate kind). Switching kind keeps the current sport. */
function setSport(s){ const cur=S.sheet.draft; const date=weekDates(S.offset)[S.sel];
  const cardio=CARDIO_SPORTS.includes(s);
  const kind=cardio? (CARDIO_KINDS.includes(cur.type)? cur.type : 'volume') : s;
  const nw=defaultWorkout(s, kind, date); nw.id=cur.id; S.sheet.draft=nw; render(); }
function setKind(k){ const cur=S.sheet.draft; const date=weekDates(S.offset)[S.sel];
  const nw=defaultWorkout(cur.sport, k, date); nw.id=cur.id; S.sheet.draft=nw; render(); }
function d_name(v){ S.sheet.draft.name=v; }
function bump(key,dir){ const d=S.sheet.draft;
  if(key==='warm') d.warmupSec=Math.max(0,d.warmupSec+dir*60);
  else if(key==='cool') d.cooldownSec=Math.max(0,d.cooldownSec+dir*60);
  else if(key==='raceWarm') S.sheet.raceWarmup.min=Math.max(5,S.sheet.raceWarmup.min+dir);
  else if(key==='raceCool') S.sheet.raceCooldown.min=Math.max(5,S.sheet.raceCooldown.min+dir);
  else if(key.startsWith('reps')){ const i=+key.slice(4); d.blocks[i].reps=Math.max(1,d.blocks[i].reps+dir); }
  else if(key.startsWith('exSets')){ const i=+key.slice(6); d.exercises[i].sets=Math.max(1,d.exercises[i].sets+dir); }
  else if(key.startsWith('exReps')){ const i=+key.slice(6); d.exercises[i].reps=Math.max(1,d.exercises[i].reps+dir); }
  else if(key.startsWith('exRest')){ const i=+key.slice(6); d.exercises[i].restSec=Math.max(0,d.exercises[i].restSec+dir*15); }
  render(); }
function toggleRaceWarmup(){ S.sheet.raceWarmup.on=!S.sheet.raceWarmup.on; render(); }
function toggleRaceCooldown(){ S.sheet.raceCooldown.on=!S.sheet.raceCooldown.on; render(); }
function toggleWarmCool(key){
  const d=S.sheet.draft; const field=key==='warm'?'warmupSec':'cooldownSec';
  if(d[field]>0){ d['_last_'+field]=d[field]; d[field]=0; }
  else d[field]=d['_last_'+field]||300;
  render();
}
function addBlock(){ S.sheet.draft.blocks.push({kind:'repeat', reps:4,
  work:{mode:'time',value:120}, recovery:{mode:'time',value:90}}); render(); }
function rmBlock(i){ S.sheet.draft.blocks.splice(i,1); render(); }
function segMode(i,which,mode){ const b=S.sheet.draft.blocks[i];
  const seg = which==='steady'? b : b[which]; seg.mode=mode;
  if(mode==='dist' && seg.value<50) seg.value=which==='steady'?5000:400; render(); }
function segVal(i,which,v){ const b=S.sheet.draft.blocks[i];
  const seg = which==='steady'? b : b[which];
  seg.value = seg.mode==='time'? parseTimeInput(v) : parseDistInput(v); }
function segUnit(i,which,unit){ const b=S.sheet.draft.blocks[i];
  const seg = which==='steady'? b : b[which]; seg.unit=unit; render(); }
function segDistPick(i,which,km){ const b=S.sheet.draft.blocks[i];
  const seg = which==='steady'? b : b[which]; seg.value=Math.round(km*1000); seg.unit='km'; render(); }
function segDistStep(i,which,dir){ const b=S.sheet.draft.blocks[i];
  const seg = which==='steady'? b : b[which];
  const unit=seg.unit||(seg.value>=1000?'km':'m'); const step=unit==='km'?500:50;
  seg.value=Math.max(step, seg.value+dir*step); render(); }
function segTimeStep(i,which,dir){ const b=S.sheet.draft.blocks[i];
  const seg = which==='steady'? b : b[which];
  const step=which==='steady'?60:15;
  seg.value=Math.max(step, seg.value+dir*step); render(); }
function raceAuxWorkout(kind, minutes){ // kind: 'warm' or 'cool' - a plain independent easy-effort entry
  // raceAux marks it for a simplified one-line card (see renderCard) instead of
  // the generic "Continuous run" block label, which would be a confusing way to
  // describe what is itself the warmup or cooldown
  return {id:uid(), type:'volume', name:kind==='warm'?t('warmup'):t('cooldown'), raceAux:kind,
    warmupSec:0, cooldownSec:0, done:false, blocks:[{kind:'steady', mode:'time', value:minutes*60}]};
}
function saveWorkout(){
  const date=ymd(weekDates(S.offset)[S.sel]);
  if(!S.plan[date]) S.plan[date]=[];
  const isNewRace=S.sheet.editIndex==null && S.sheet.draft.type==='race';
  if(isNewRace && S.sheet.raceWarmup.on) S.plan[date].push(raceAuxWorkout('warm', S.sheet.raceWarmup.min));
  if(S.sheet.editIndex==null) S.plan[date].push(S.sheet.draft);
  else S.plan[date][S.sheet.editIndex]=S.sheet.draft;
  if(isNewRace && S.sheet.raceCooldown.on) S.plan[date].push(raceAuxWorkout('cool', S.sheet.raceCooldown.min));
  save(); closeSheet();
}
function delWorkout(idx){
  const date=ymd(weekDates(S.offset)[S.sel]);
  const w=S.plan[date][idx];
  if(w && w.raceId) S.profile.races=(S.profile.races||[]).filter(r=>r.id!==w.raceId);
  S.plan[date].splice(idx,1); if(!S.plan[date].length) delete S.plan[date];
  save(); render();
}
function toggleDone(idx){
  const date=ymd(weekDates(S.offset)[S.sel]);
  const w=S.plan[date][idx]; w.done=!w.done;
  save(); render();
}

/* ---- Garmin payload + send ---- */
/* S.sheet.dates drives scope for the whole send flow - a week's worth of dates
   or just the one day selected via openSendDay() - buildPayload/sendWeek/sendSheet
   all read from it instead of assuming "the whole visible week". */
function buildPayload(){
  const dates=S.sheet.dates||weekDates(S.offset); const workouts=[];
  dates.forEach(d=>dayWorkouts(d).forEach(w=>{
    workouts.push({ date:ymd(d), name:w.name, type:w.type, sport:w.sport||'running',
      warmupSec:w.warmupSec, cooldownSec:w.cooldownSec, garminWorkoutId:w.garminWorkoutId||null,
      blocks:w.blocks.map(b=> b.kind==='steady'
        ? {kind:'steady', mode:b.mode, value:b.value, pace:b.pace||null}
        : {kind:'repeat', reps:b.reps,
           work:{mode:b.work.mode, value:b.work.value},
           recovery:{mode:b.recovery.mode, value:b.recovery.value}} ),
      exercises:(w.exercises||[]).map(ex=>({category:ex.category, sets:ex.sets, reps:ex.reps,
        weightKg:ex.weightKg, restSec:ex.restSec})) });
  }));
  return { athlete:{ name:profileName(S.profile), maxHR:S.profile.maxHR, restHR:S.profile.restHR }, workouts };
}
function openSendWeek(){ S.sheet={mode:'send', payload:null, result:null, dates:weekDates(S.offset)}; render(); }
function openSendDay(){ S.sheet={mode:'send', payload:null, result:null, dates:[weekDates(S.offset)[S.sel]]}; render(); }
function showPayload(){ S.sheet.payload=JSON.stringify(buildPayload(),null,2); render(); }
async function sendWeek(){
  const url=BACKEND_URL;
  save();
  S.sheet.sending=true; render();
  const headers={'Content-Type':'application/json'};
  try{
    const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(buildPayload())});
    const data=await r.json();
    if(data.error){ toast(t('serverErrorAlert')+data.error,'err'); return; }
    const results=data.results||[];
    // buildPayload() and the backend both iterate in this same day/workout order,
    // so results[i] is the outcome for the i-th workout - use that to link the
    // real Garmin workoutId back onto the plan entry for later activity matching,
    // and so the *next* send replaces this workout on Garmin instead of duplicating it.
    const dates=S.sheet.dates||weekDates(S.offset); let i=0;
    dates.forEach(d=>dayWorkouts(d).forEach(w=>{
      const res=results[i++];
      if(res && res.ok && res.workoutId) w.garminWorkoutId=res.workoutId;
    }));
    S.sheet.result=results; save();
  }catch(e){
    toast(t('sendFailedAlert')+e.message+t('sendFailedHint'),'err');
  }finally{
    S.sheet.sending=false; render();
  }
}
/* distance match (60%) + pace match vs the workout's own implied pace (40%);
   falls back to distance-only if there's no actual pace to compare (rare) */
function scoreWorkout(w){
  if(!w.actual) return null;
  const planned=workoutKm(w);
  if(!planned) return null;
  const distScore=Math.max(0, 100-Math.abs(w.actual.distanceKm-planned)/planned*100);
  const plannedSecs=totalSecs(w);
  const plannedPace=plannedSecs && planned? plannedSecs/planned : null;
  let paceScore=null;
  if(plannedPace && w.actual.paceSecPerKm){
    paceScore=Math.max(0, 100-Math.abs(w.actual.paceSecPerKm-plannedPace)/plannedPace*100);
  }
  return Math.round(paceScore!=null? distScore*0.6+paceScore*0.4 : distScore);
}
/* matches completed Garmin activities to plan entries (by garminWorkoutId) for any
   date in [since,until] present in S.plan - not tied to the currently viewed week,
   so it can run both for the manual "check" button and a silent background sync. */
async function fetchAndApplyActivities(since,until){
  const r=await fetch(`${BACKEND_BASE}/activities?since=${since}&until=${until}`);
  const data=await r.json();
  if(data.error) return {matched:0, error:data.error};
  const acts=data.activities||[];
  const claimed=new Set();
  let matched=0;
  function applyActual(w,act,matchedByDate){
    w.done=true;
    w.actual={
      activityId:act.activityId, distanceKm:act.distanceKm, durationSec:act.durationSec,
      paceSecPerKm:act.paceSecPerKm, avgHR:act.avgHR, maxHR:act.maxHR, calories:act.calories,
      elevationGainM:act.elevationGainM, elevationLossM:act.elevationLossM,
      avgCadence:act.avgCadence, maxCadence:act.maxCadence,
      aerobicTrainingEffect:act.aerobicTrainingEffect, anaerobicTrainingEffect:act.anaerobicTrainingEffect,
      matchedByDate: !!matchedByDate,
    };
    claimed.add(act.activityId);
    matched++;
  }
  // pass 1: exact match - the watch was actually following the pushed structured
  // workout, so Garmin tagged the activity with its workoutId.
  Object.keys(S.plan).forEach(dateStr=>{
    if(dateStr<since || dateStr>until) return;
    S.plan[dateStr].forEach(w=>{
      if(!w.garminWorkoutId) return;
      const act=acts.find(a=>a.workoutId===w.garminWorkoutId && !claimed.has(a.activityId));
      if(act) applyActual(w,act,false);
    });
  });
  // pass 2: same-day fallback for a run that was actually done but not "started"
  // from the watch workout (e.g. a gym treadmill session, or a free run) - only
  // auto-link when a date has exactly one still-unmatched planned workout and
  // exactly one still-unclaimed Garmin activity, so there's no ambiguity about
  // which run belongs to which plan entry.
  Object.keys(S.plan).forEach(dateStr=>{
    if(dateStr<since || dateStr>until) return;
    const dayActs=acts.filter(a=>a.date===dateStr && !claimed.has(a.activityId));
    const unmatchedWorkouts=S.plan[dateStr].filter(w=>!w.actual);
    if(dayActs.length===1 && unmatchedWorkouts.length===1) applyActual(unmatchedWorkouts[0], dayActs[0], true);
  });
  return {matched};
}
async function checkCompleted(){
  const wk=weekDates(S.offset);
  try{
    const {matched,error}=await fetchAndApplyActivities(ymd(wk[0]), ymd(wk[6]));
    if(error){ toast(t('serverErrorAlert')+error,'err'); return; }
    save(); render();
    toast(matched+' '+t('syncedSuffix'), matched>0?'ok':undefined);
  }catch(e){
    toast(t('sendFailedAlert')+e.message,'err');
  }
}
/* silent background sync on load - covers this week + last week so anything
   completed near a week boundary still gets picked up without user action */
async function autoCheckCompleted(){
  try{
    const until=ymd(new Date());
    const sinceD=new Date(); sinceD.setDate(sinceD.getDate()-13);
    const {matched}=await fetchAndApplyActivities(ymd(sinceD), until);
    if(matched){ save(); render(); }
  }catch(e){ /* best-effort - the manual button still works if this fails */ }
}

/* ---- swipe through days anywhere on screen (rolls into the next/previous week at the
   edges) - attached once to document (not re-bound per render like the old #strip-only
   version), so it must skip while a sheet/drawer/crop-editor is covering the screen,
   the same way initPullToRefresh() already does. */
function attachSwipe(){
  let x0=null,y0=null;
  document.addEventListener('touchstart',e=>{
    if(document.querySelector('.drawerscrim, .scrim.on, .cropoverlay')){ x0=null; return; }
    x0=e.touches[0].clientX; y0=e.touches[0].clientY;
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(x0==null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){
      const dir=dx<0?1:-1; // RTL: swipe left -> forward in time
      let sel=S.sel+dir;
      if(sel>6){ S.offset++; sel=0; }
      else if(sel<0){ S.offset--; sel=6; }
      S.sel=sel; render();
    }
    x0=y0=null;
  },{passive:true});
}

/* ---- pull to refresh (re-syncs plan/profile from the cloud) ---- */
async function pullRefreshAction(){
  if(!AUTH.session) return;
  try{
    await loadCloudData(AUTH.session.user.id);
    await autoCheckCompleted();
  }catch(e){ /* best-effort */ }
  render();
}
function initPullToRefresh(){
  const THRESH=64, MAX=100;
  const el=document.createElement('div'); el.id='pullwrap'; el.className='pullwrap';
  el.innerHTML='<div class="pullball" id="pullball"><span id="pullicon">⟳</span></div>';
  document.body.appendChild(el);
  const ball=document.getElementById('pullball');
  const icon=document.getElementById('pullicon');

  let y0=null, ready=false, active=false;

  document.addEventListener('touchstart', e=>{
    if(active) return;
    if((document.scrollingElement.scrollTop||0)>0) return;
    if(document.querySelector('.drawerscrim, .scrim.on')) return;
    y0=e.touches[0].clientY;
  }, {passive:true});

  document.addEventListener('touchmove', e=>{
    if(y0==null || active) return;
    const dy=e.touches[0].clientY-y0;
    if(dy<=0 || (document.scrollingElement.scrollTop||0)>0){ y0=null; return; }
    e.preventDefault();
    const dist=Math.min(MAX, dy*0.5);
    el.style.transition='none'; ball.style.transition='none';
    el.style.transform=`translateY(${dist-60}px)`;
    ball.style.opacity=String(Math.min(1, dist/THRESH));
    icon.style.transform=`rotate(${dy*1.2}deg)`;
    ready=dist>=THRESH*0.85;
  }, {passive:false});

  document.addEventListener('touchend', async ()=>{
    if(y0==null) return;
    y0=null;
    el.style.transition=''; ball.style.transition='';
    if(ready){
      active=true;
      el.style.transform='translateY(4px)';
      ball.style.opacity='1';
      ball.classList.add('spin');
      try{ await pullRefreshAction(); }
      finally{
        ball.classList.remove('spin');
        el.style.transform='translateY(-60px)';
        ball.style.opacity='0';
        active=false;
      }
    } else {
      el.style.transform='translateY(-60px)';
      ball.style.opacity='0';
    }
  }, {passive:true});
}
initPullToRefresh();
attachSwipe();

render();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
