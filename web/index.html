<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0E1116" />
<title>Maslul — מתכנן אימונים</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Maslul" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Rubik:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --ink:#0E1116; --panel:#171B22; --panel2:#1E242E; --line:#2A313D;
    --txt:#E8EBF0; --muted:#8A94A6; --muted2:#5D6675;
    --warm:#F5B845;   /* warmup / cooldown */
    --work:#FF5A3C;   /* hard effort */
    --rec:#35C6B4;    /* recovery / easy */
    --easy:#5FB0FF;   /* steady volume */
    --shadow:0 8px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--ink); color:var(--txt);
    font-family:'Assistant',system-ui,sans-serif; overscroll-behavior-y:none;}
  body{max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:96px;}
  .mono{font-family:'JetBrains Mono',monospace; direction:ltr; unicode-bidi:isolate;}
  .disp{font-family:'Rubik',sans-serif;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}

  /* ---- header ---- */
  header{padding:18px 18px 10px; display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:baseline; gap:9px;}
  .brand h1{font-family:'Rubik'; font-weight:800; font-size:26px; margin:0; letter-spacing:-.5px;}
  .brand .tick{width:11px; height:11px; border-radius:3px;
    background:linear-gradient(135deg,var(--work),var(--warm)); transform:translateY(-2px);}
  .profbtn{width:40px; height:40px; border-radius:50%; background:var(--panel2);
    border:1px solid var(--line); display:grid; place-items:center; font-weight:700; font-size:15px; overflow:hidden;}
  .profbtn img{width:100%; height:100%; object-fit:cover;}
  .avatarbig{width:64px; height:64px; border-radius:50%; overflow:hidden; background:var(--panel2);
    border:1px solid var(--line); display:grid; place-items:center; font-weight:700; font-size:22px; flex:none;}
  .avatarbig img{width:100%; height:100%; object-fit:cover;}
  .hdrbtns{display:flex; align-items:center; gap:8px;}
  .langbtn{height:40px; padding:0 13px; border-radius:20px; background:var(--panel2);
    border:1px solid var(--line); font-weight:700; font-size:13px;}

  /* ---- week nav ---- */
  .weeknav{display:flex; align-items:center; justify-content:space-between; padding:6px 18px 4px;}
  .weeknav .rng{font-family:'Rubik'; font-weight:700; font-size:15px;}
  .weeknav .sub{color:var(--muted); font-size:12px; margin-top:1px;}
  .navbtn{width:34px; height:34px; border-radius:10px; background:var(--panel);
    border:1px solid var(--line); display:grid; place-items:center; color:var(--muted); font-size:18px;
    direction:ltr; unicode-bidi:isolate;}
  .navbtn:active{background:var(--panel2);}

  .strip{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; padding:8px 14px 4px;
    touch-action:pan-y;}
  .day{position:relative; border:1px solid var(--line); background:var(--panel);
    border-radius:13px; padding:9px 0 8px; text-align:center; transition:transform .08s, border-color .15s;}
  .day:active{transform:scale(.96);}
  .day .dn{font-size:12px; color:var(--muted); font-weight:600;}
  .day .dd{font-family:'JetBrains Mono'; font-weight:700; font-size:17px; margin-top:2px;}
  .day.sel{border-color:var(--work); background:linear-gradient(180deg,#241a19,var(--panel));}
  .day.today .dd{color:var(--warm);}
  .day .dots{display:flex; gap:3px; justify-content:center; margin-top:6px; height:6px;}
  .day .dot{width:6px; height:6px; border-radius:50%;}

  /* ---- day detail ---- */
  .detail{padding:14px 18px 4px;}
  .dhead{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
  .dhead .t{font-family:'Rubik'; font-weight:700; font-size:19px;}
  .dhead .n{color:var(--muted); font-size:13px;}

  .empty{border:1.5px dashed var(--line); border-radius:16px; padding:26px 18px;
    text-align:center; color:var(--muted);}
  .empty .big{font-family:'Rubik'; font-weight:700; color:var(--txt); font-size:16px; margin-bottom:4px;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:15px 15px 13px; margin-bottom:12px; box-shadow:var(--shadow);}
  .card.done{opacity:.55;}
  .card .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;}
  .badge{font-family:'Rubik'; font-weight:700; font-size:13px; padding:5px 11px; border-radius:9px;}
  .card .dur{font-family:'JetBrains Mono'; font-weight:700; font-size:14px; color:var(--muted);}

  /* effort profile bar */
  .profile{display:flex; height:34px; border-radius:9px; overflow:hidden; gap:2px; margin-bottom:11px;}
  .seg{min-width:3px;}
  .steps{display:flex; flex-direction:column; gap:7px;}
  .step{display:flex; align-items:center; gap:10px; font-size:14px;}
  .step .pip{width:9px; height:9px; border-radius:3px; flex:none;}
  .step .lbl{flex:1; color:var(--txt);}
  .step .val{font-family:'JetBrains Mono'; font-weight:700; color:var(--muted); font-size:13px;}
  .rep{background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:8px 10px;}
  .rep .rh{display:flex; align-items:center; gap:8px; margin-bottom:6px;
    font-family:'Rubik'; font-weight:700; font-size:13px;}
  .rep .rh .x{font-family:'JetBrains Mono'; color:var(--work);}
  .cardacts{display:flex; gap:8px; margin-top:13px;}
  .cardacts button{flex:1; padding:9px; border-radius:11px; font-weight:700; font-size:14px;
    border:1px solid var(--line); background:var(--panel2);}
  .cardacts .del{color:#ff7a68; border-color:#3a2422;}
  .cardacts .donebtn.on{background:var(--rec); color:#062019; border-color:var(--rec);}

  /* ---- weekly km bar ---- */
  .kmbar{padding:2px 18px 10px;}
  .kmbar .track{height:10px; border-radius:6px; background:var(--panel); border:1px solid var(--line); overflow:hidden;}
  .kmbar .fill{height:100%; background:linear-gradient(90deg,var(--work),var(--warm)); border-radius:6px; transition:width .3s ease;}
  .kmbar .lbl{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:6px;}
  .synclink{display:block; margin-top:8px; font-size:12px; color:var(--easy); font-weight:700; text-decoration:underline;}

  /* ---- stats sheet ---- */
  .statrow{display:flex; gap:8px;}
  .statbox{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 8px; text-align:center;}
  .statval{font-weight:700; font-size:17px;}
  .statunit{font-size:12px; color:var(--muted); font-weight:600;}
  .statlbl{font-size:11px; color:var(--muted); margin-top:4px;}
  .statsbars{display:flex; align-items:flex-end; gap:5px; height:120px;}
  .statsbars .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end;
    align-items:center; height:100%;}
  .statsbars .track{width:100%; height:100%; display:flex; align-items:flex-end;
    background:var(--panel); border-radius:4px; overflow:hidden; align-self:flex-end;}
  .statsbars .fill{width:100%; background:linear-gradient(180deg,var(--warm),var(--work));}
  .statsbars .wk{font-size:8px; color:var(--muted2); margin-top:5px; writing-mode:horizontal-tb;}

  .addbtn{width:100%; padding:14px; border-radius:15px; background:var(--panel);
    border:1px solid var(--line); font-family:'Rubik'; font-weight:700; font-size:15px;
    color:var(--txt); display:flex; align-items:center; justify-content:center; gap:8px;}
  .addbtn .p{color:var(--work); font-size:20px; line-height:0;}
  .addbtn:active{background:var(--panel2);}

  /* ---- send bar ---- */
  .sendbar{position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto;
    padding:12px 18px calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(180deg,rgba(14,17,22,0),var(--ink) 34%);}
  .send{width:100%; padding:15px; border-radius:15px; font-family:'Rubik'; font-weight:800; font-size:16px;
    background:linear-gradient(135deg,var(--work),#ff7b45); color:#1a0d09;
    display:flex; align-items:center; justify-content:center; gap:9px; box-shadow:0 6px 22px rgba(255,90,60,.32);}
  .send:disabled{background:var(--panel); color:var(--muted2); box-shadow:none;}
  .send:active{transform:translateY(1px);}

  /* ---- sheet / modal ---- */
  .scrim{position:fixed; inset:0; background:rgba(6,8,11,.66); backdrop-filter:blur(2px);
    display:none; align-items:flex-end; justify-content:center; z-index:40;}
  .scrim.on{display:flex;}
  .sheet{width:100%; max-width:520px; min-height:82vh; max-height:92vh; overflow-y:auto; background:var(--ink);
    border-radius:22px 22px 0 0; border-top:1px solid var(--line); padding:8px 18px calc(24px + env(safe-area-inset-bottom));
    animation:up .22s ease; box-sizing:border-box;}
  @supports (height: 100dvh){
    .sheet{min-height:82dvh; max-height:92dvh;}
  }
  @keyframes up{from{transform:translateY(30px); opacity:.4;} to{transform:none; opacity:1;}}
  .grab{width:40px; height:4px; background:var(--line); border-radius:3px; margin:8px auto 12px;}
  .sheet h2{font-family:'Rubik'; font-weight:800; font-size:20px; margin:2px 0 16px;}

  .types{display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-bottom:18px;}
  .type{border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:13px 12px; text-align:start;}
  .type.on{border-color:var(--work); background:linear-gradient(180deg,#241a19,var(--panel));}
  .type .tn{font-family:'Rubik'; font-weight:700; font-size:15px;}
  .type .td{color:var(--muted); font-size:12px; margin-top:2px;}

  .field{margin-bottom:15px;}
  .field label{display:block; font-size:13px; color:var(--muted); font-weight:600; margin-bottom:7px;}
  .field input{width:100%; background:var(--panel); border:1px solid var(--line); color:var(--txt);
    border-radius:12px; padding:12px; font-family:'Assistant'; font-size:15px;}
  .field input.mono{font-family:'JetBrains Mono';}
  .field input:focus{outline:none; border-color:var(--work);}

  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{width:40px; height:40px; border-radius:11px; background:var(--panel);
    border:1px solid var(--line); font-size:22px; font-weight:700; color:var(--txt);}
  .stepper .v{flex:1; text-align:center; font-family:'JetBrains Mono'; font-weight:700; font-size:17px;}
  .stepper button:active{background:var(--panel2);}

  .blk{background:var(--panel); border:1px solid var(--line); border-radius:15px; padding:13px; margin-bottom:11px;}
  .blk .bh{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;}
  .blk .bt{font-family:'Rubik'; font-weight:700; font-size:14px;}
  .blk .rm{color:#ff7a68; font-size:13px; font-weight:700;}
  .seg2{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:9px; min-width:0;}
  .seg2 input{width:100%; min-width:0; box-sizing:border-box;}
  .toggle{display:flex; background:var(--panel2); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .toggle button{flex:1; padding:8px 0; font-size:12px; font-weight:700; color:var(--muted);}
  .toggle button.on{background:var(--work); color:#1a0d09;}
  .minilbl{font-size:11px; color:var(--muted2); margin-bottom:5px; font-weight:600;}

  .addblk{width:100%; padding:11px; border-radius:12px; border:1px dashed var(--line);
    color:var(--muted); font-weight:700; font-size:13px; margin-bottom:16px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .gendays{display:flex; gap:6px; margin-bottom:18px;}
  .gendays button{flex:1; padding:10px 0; border-radius:10px; background:var(--panel);
    border:1px solid var(--line); font-weight:700; font-size:12px; color:var(--muted);}
  .gendays button.on{border-color:var(--work); background:linear-gradient(180deg,#241a19,var(--panel)); color:var(--txt);}
  .primary{width:100%; padding:15px; border-radius:14px; font-family:'Rubik'; font-weight:800; font-size:16px;
    background:linear-gradient(135deg,var(--work),#ff7b45); color:#1a0d09; margin-top:6px;
    display:flex; align-items:center; justify-content:center; gap:8px;}
  .primary:disabled{opacity:.7;}
  .spinner{width:15px; height:15px; border:2px solid rgba(26,13,9,.35); border-top-color:#1a0d09;
    border-radius:50%; animation:spin .7s linear infinite; flex:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .ghost{width:100%; padding:14px; border-radius:14px; font-weight:700; font-size:15px;
    background:var(--panel); border:1px solid var(--line); color:var(--muted); margin-top:9px;}

  .note{font-size:12.5px; color:var(--muted); line-height:1.55; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin-top:4px;}
  .payload{font-family:'JetBrains Mono'; font-size:11px; direction:ltr; text-align:left; white-space:pre-wrap;
    background:#0a0c10; border:1px solid var(--line); border-radius:12px; padding:12px; max-height:240px; overflow:auto; color:#9fb0c4;}
  .res{border-radius:12px; padding:11px 12px; margin-bottom:8px; font-size:14px; display:flex; justify-content:space-between; gap:10px;}
  .res.ok{background:#12251f; border:1px solid #1e3a30; color:#8fe6cf;}
  .res.err{background:#2a1512; border:1px solid #3a201c; color:#ff9d8c;}

  /* ---- toast notifications ---- */
  .toastwrap{position:fixed; top:0; left:0; right:0; display:flex; flex-direction:column; align-items:center;
    gap:8px; padding:calc(14px + env(safe-area-inset-top)) 14px 0; z-index:200; pointer-events:none;}
  .toast{max-width:480px; width:100%; background:var(--panel); border:1px solid var(--line);
    border-inline-start:4px solid var(--easy); border-radius:14px; padding:13px 16px; box-shadow:var(--shadow);
    font-size:14px; line-height:1.5; color:var(--txt); pointer-events:auto; animation:toastin .25s ease;}
  .toast.err{border-inline-start-color:var(--work);}
  .toast.ok{border-inline-start-color:var(--rec);}
  @keyframes toastin{from{transform:translateY(-14px); opacity:0;} to{transform:none; opacity:1;}}
  @keyframes toastout{to{transform:translateY(-14px); opacity:0;}}

  /* ---- auth gate ---- */
  .gate{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center; gap:22px;}
  .gate .brand h1{font-family:'Rubik'; font-weight:800; font-size:34px; margin:0;}
  .gate .sub{color:var(--muted); font-size:14px; max-width:280px; line-height:1.6;}
  .googlebtn{display:flex; align-items:center; justify-content:center; gap:10px;
    background:#fff; color:#1f1f1f; border-radius:14px; padding:14px 22px;
    font-family:'Rubik'; font-weight:700; font-size:15px; box-shadow:var(--shadow);}
  .googlebtn:active{transform:translateY(1px);}
  .googlebtn svg{width:19px; height:19px;}
  .signout{color:var(--muted); font-size:13px; font-weight:600; margin-top:4px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ storage (localStorage when deployed, memory in preview) ============ */
const store = (()=>{ let mem={}; let ok=true;
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ ok=false; }
  return {
    get(k,d){ try{ const v=ok?localStorage.getItem(k):mem[k]; return v?JSON.parse(v):d; }catch(e){ return d; } },
    set(k,v){ const s=JSON.stringify(v); if(ok){try{localStorage.setItem(k,s);}catch(e){mem[k]=s;}} else mem[k]=s; }
  };
})();

/* ============ config ============ */
const BACKEND_BASE='https://maslul-backend.vercel.app';
const BACKEND_URL=BACKEND_BASE+'/schedule-week';
const SUPABASE_URL='https://qvbdnaeewytfoolmubch.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_DauS9FSkZqkPK6lCld-Umw_zCom2X8w';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

/* ============ auth ============ */
let AUTH={ready:false, session:null};
async function loadCloudData(userId){
  const {data}=await sb.from('user_data').select('plan, profile').eq('user_id',userId).maybeSingle();
  if(data){
    S.plan=data.plan||{};
    S.profile=Object.assign({name:'',maxHR:'',restHR:'',thrPace:'',races:[],photo:''}, data.profile||{});
    store.set('plan',S.plan); store.set('profile',S.profile);
  } else {
    const meta=AUTH.session?.user?.user_metadata||{};
    if(!S.profile.name) S.profile.name=meta.full_name||meta.name||'';
    if(!S.profile.photo) S.profile.photo=meta.avatar_url||meta.picture||'';
    await sb.from('user_data').upsert({user_id:userId, plan:S.plan, profile:S.profile});
  }
}
async function signInGoogle(){
  await sb.auth.signInWithOAuth({provider:'google', options:{redirectTo:window.location.origin+window.location.pathname}});
}
async function signOut(){ await sb.auth.signOut(); }
sb.auth.onAuthStateChange(async (event,session)=>{
  AUTH.session=session; AUTH.ready=true;
  if(session && (event==='SIGNED_IN' || event==='INITIAL_SESSION')){
    await loadCloudData(session.user.id);
    autoCheckCompleted(); // fire-and-forget background sync, doesn't block the render
  }
  render();
});

/* ============ i18n ============ */

const MONTHS_I18N={

};
const T={
  gateSub:{he:'תוכנית האימונים שלך, מסונכרנת בין כל המכשירים. התחבר עם חשבון Google כדי להמשיך.', en:'Your training plan, synced across all your devices. Sign in with Google to continue.'},

  editWorkout:{he:'עריכת אימון', en:'Edit workout'},
  workoutName:{he:'שם האימון', en:'Workout name'},
  warmupMin:{he:'חימום (דקות)', en:'Warmup (minutes)'},

  timeMode:{he:'זמן', en:'Time'},
  distMode:{he:'מרחק', en:'Distance'},
  timeHint:{he:'לדוגמה: 3:00 או 180', en:'e.g. 3:00 or 180'},
  distHint:{he:'לדוגמה: 400 או 5km', en:'e.g. 400 or 5km'},
  sendTitle:{he:'שליחה לגרמין', en:'Send to Garmin'},
  sendNote:{he:'האימונים ייווצרו ב-Garmin Connect ויתוזמנו לתאריכים. סנכרן את השעון כדי להוריד אותם. ההתחברות לגרמין נעשית בשרת דרך טוקן קבוע, ללא סיסמה בבקשה.',

function startOfWeek(offset){ // Sunday-start week

const PACE={work:0.27, recovery:0.39, easy:0.36};

const WEEKDAY_EN=['SUN','MON','TUE','WED','THU','FRI','SAT'];
function autoName(type,date){ return WEEKDAY_EN[date.getDay()]+'_'+pad(date.getDate())+'_'+pad(date.getMonth()+1)+'_'+TYPES[type].en; }

function defaultWorkout(type,date){
  const base={id:uid(), type, name:autoName(type,date), warmupSec:600, cooldownSec:600, blocks:[], done:false};
  if(type==='intervals') base.blocks=[{kind:'repeat', reps:6,
    work:{mode:'time', value:180}, recovery:{mode:'time', value:120}}];
  if(type==='hills') base.blocks=[{kind:'repeat', reps:8,
    work:{mode:'time', value:45}, recovery:{mode:'time', value:90}}];
  if(type==='fartlek') base.blocks=[{kind:'repeat', reps:6,
    work:{mode:'time', value:60}, recovery:{mode:'time', value:60}}];
  if(type==='volume'){ base.warmupSec=300; base.cooldownSec=300;
    base.blocks=[{kind:'steady', mode:'time', value:2700}]; }
  if(type==='recovery'){ base.warmupSec=300; base.cooldownSec=300;
    base.blocks=[{kind:'steady', mode:'time', value:1200}]; }
  if(type==='race'){ base.warmupSec=900; base.cooldownSec=0;
    base.blocks=[{kind:'steady', mode:'dist', value:5000}]; }
  return base;
}
/* per-km distance blocks for the race itself, with a mild negative-split pace target
   built from the athlete's threshold pace (profile.thrPace): starts slightly slower
   than goal pace, finishes slightly faster. No thrPace set -> plain unpaced km splits. */
function buildRaceSplits(km){
  const full=Math.floor(km);
  const rem=Math.round((km-full)*1000);
  const segs=[]; for(let i=0;i<full;i++) segs.push(1000);
  if(rem>10) segs.push(rem);
  const n=segs.length;
  const goalPaceSec=S.profile.thrPace? parseTimeInput(S.profile.thrPace) : 0;
  return segs.map((meters,i)=>{
    let pace=null;
    if(goalPaceSec){
      const t=n>1? i/(n-1) : 0.5;
      const factor=0.03+(-0.03-0.03)*t; // +3% (slower) at km1 -> -3% (faster) at the last km
      pace=Math.round(goalPaceSec*(1+factor));
    }
    return {kind:'steady', mode:'dist', value:meters, pace};
  });
}
function raceWorkouts(race){
  const splits=race.km? buildRaceSplits(race.km) : [];
  return [
    { id:'race-'+race.id+'-warm', type:'volume', name:t('warmup')+' · '+race.name, raceId:race.id, done:false,
      warmupSec:0, cooldownSec:0, blocks:[{kind:'steady', mode:'time', value:900}] },
    { id:'race-'+race.id+'-main', type:'race', name:race.name, raceId:race.id, done:false,
      warmupSec:0, cooldownSec:0, blocks:splits },
    { id:'race-'+race.id+'-cool', type:'volume', name:t('cooldown')+' · '+race.name, raceId:race.id, done:false,
      warmupSec:0, cooldownSec:0, blocks:[{kind:'steady', mode:'time', value:900}] },
  ];
}
/* rough total km for a workout, using the same PACE constants as the visual profile bar */
function workoutKm(w){
  let meters=0;
  if(w.warmupSec) meters+=w.warmupSec/PACE.easy;
  w.blocks.forEach(b=>{
    if(b.kind==='repeat'){
      for(let i=0;i<b.reps;i++){
        meters += b.work.mode==='dist'? b.work.value : b.work.value/PACE.work;
        meters += b.recovery.mode==='dist'? b.recovery.value : b.recovery.value/PACE.recovery;
      }
    } else {
      meters += b.mode==='dist'? b.value : b.value/PACE.easy;
    }
  });
  if(w.cooldownSec) meters+=w.cooldownSec/PACE.easy;
  return meters/1000;
}

/* ============ stats ============ */
function weekStats(offset){
  const wk=weekDates(offset);
  const ws=wk.flatMap(d=>dayWorkouts(d));
  const planned=ws.reduce((a,w)=>a+workoutKm(w),0);
  const done=ws.reduce((a,w)=>a+(w.done?workoutKm(w):0),0);
  return {offset, planned, done, weekStart:wk[0]};
}
function monthStats(){
  const now=new Date(); const y=now.getFullYear(), m=now.getMonth();
  let planned=0, done=0, doneCount=0;
  Object.keys(S.plan).forEach(ds=>{
    const d=new Date(ds+'T00:00:00');
    if(d.getFullYear()!==y || d.getMonth()!==m) return;
    S.plan[ds].forEach(w=>{
      const km=workoutKm(w); planned+=km;
      if(w.done){ done+=km; doneCount++; }
    });
  });
  return {planned, done, doneCount};
}
function avgPaceThisMonth(){
  const now=new Date(); const y=now.getFullYear(), m=now.getMonth();
  let totalSec=0, totalKm=0;
  Object.keys(S.plan).forEach(ds=>{
    const d=new Date(ds+'T00:00:00');
    if(d.getFullYear()!==y || d.getMonth()!==m) return;
    S.plan[ds].forEach(w=>{
      if(w.done && w.actual && w.actual.paceSecPerKm && w.actual.distanceKm){
        totalSec+=w.actual.paceSecPerKm*w.actual.distanceKm; totalKm+=w.actual.distanceKm;
      }
    });
  });
  return totalKm? Math.round(totalSec/totalKm) : null;
}
/* estimate seconds for any step (for bar widths + total duration) */
function stepSecs(mode,value,kind){ return mode==='time'? value : Math.round(value*PACE[kind]); }
function flattenSteps(w){
  const out=[]; if(w.warmupSec) out.push({intensity:'warm', secs:w.warmupSec});
  w.blocks.forEach(b=>{
    if(b.kind==='repeat'){ for(let i=0;i<b.reps;i++){
      out.push({intensity:'work', secs:stepSecs(b.work.mode,b.work.value,'work')});
      out.push({intensity:'recovery', secs:stepSecs(b.recovery.mode,b.recovery.value,'recovery')});
    }} else out.push({intensity:'easy', secs:stepSecs(b.mode,b.value,'easy')});
  });
  if(w.cooldownSec) out.push({intensity:'warm', secs:w.cooldownSec});
  return out;
}
const COLOR={warm:'--warm', work:'--work', recovery:'--rec', easy:'--easy'};
function totalSecs(w){ return flattenSteps(w).reduce((a,s)=>a+s.secs,0); }
function fmtStep(s){ // for display: "3:00" for time, "400m" for dist
  return s.mode==='time'? mmss(s.value) : s.value+' '+t('meterShort');
}
function fmtKm(m){ return (m%1000===0?(m/1000):(Math.round(m/10)/100))+' '+t('kmShort'); }
/* editor input parsing: accepts "3:00" or "180" for time; "400" or "5"/"5km" for distance */
function parseTimeInput(v){
  v=(v||'').trim();
  if(v.includes(':')){ const [m,s]=v.split(':'); return Math.max(0,(parseInt(m)||0)*60+(parseInt(s)||0)); }
  return Math.max(0, parseInt(v)||0);
}
function fmtTimeInput(sec){ return mmss(sec); }
function parseDistInput(v){
  v=(v||'').trim().toLowerCase().replace(',','.');
  if(v.endsWith('km')||v.endsWith('k')||v.includes('.')) return Math.max(0, Math.round((parseFloat(v)||0)*1000));
  return Math.max(0, parseInt(v)||0);
}
function fmtDistInput(m){
  if(m>=1000) return (Math.round(m/100)/10)+'km';
  return String(m);
}

  offset:0, sel:new Date().getDay(),
  lang: store.get('lang','he'),
  plan: store.get('plan',{}),
  profile: store.get('profile',{name:'', maxHR:'', restHR:'', thrPace:'', races:[], photo:''}),

    .then(({error})=>{ if(error) console.error('cloud save failed', error); });

function dayWorkouts(date){ return S.plan[ymd(date)]||[]; }

/* ============ auto-generate weekly plan ============ */
/* trainingWeekNumber: how many consecutive populated weeks precede this one (resets after a gap) */
/* how many consecutive weeks of REAL training precede this one - not just planned,
   a week only counts if at least 70% of its planned km actually got done (via the
   Garmin sync). An empty week or a mostly-skipped week breaks the streak, so the
   next proposal doesn't keep escalating load on top of training that didn't happen. */
const PROGRESSION_COMPLETION_THRESHOLD=0.7;
function trainingWeekNumber(offset){
  let n=1, k=offset-1, guard=0;
  while(guard<52){
    const stats=weekStats(k);
    if(stats.planned<=0) break;
    if(stats.done/stats.planned < PROGRESSION_COMPLETION_THRESHOLD) break;
    n++; k--; guard++;
  }
  return n;
}
function nextRace(offset){
  const races=(S.profile.races||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const monday=ymd(weekDates(offset)[0]);
  return races.find(r=>r.date>=monday) || null;
}
function weeksToRaceFor(offset){
  const race=nextRace(offset); if(!race) return null;
  const monday=weekDates(offset)[0].getTime();
  const raceD=new Date(race.date+'T00:00:00').getTime();
  return Math.max(0, Math.round((raceD-monday)/(7*86400000)));
}
function phaseFor(w){
  if(w==null) return 'base';
  if(w<=0) return 'race';
  if(w<=3) return 'peak';
  if(w<=8) return 'build';
  return 'base';
}
/* multiplier on the workout-type defaults: progressive growth in base/build,
   every 4th training week is a lighter cutback week, peak/race taper down regardless of week count */
function planFactor(phase, weekNum){
  if(phase==='race') return 0.3;
  if(phase==='peak') return 0.6;
  const deload = weekNum%4===0;
  const growth = Math.min(0.05*(weekNum-1), 0.4);
  let f = deload? 0.7 : (1+growth);
  if(phase==='build') f += 0.1;
  return f;
}
const QUALITY_TYPES=['intervals','hills','fartlek'];
const EASY_TYPES=['volume','volume','recovery']; // weighted toward volume, recovery for variety
function qualityCount(n, phase){
  if(n<=0) return 0;
  if(phase==='race') return 0; // no hard efforts the week you're racing
  if(phase==='peak') return 1;
  let c = n<=2 ? 1 : (n<=4 ? 1 : 2);
  if(phase==='build' && n>=4) c=Math.min(c+1,3);
  return Math.min(c, n);
}
/* choose which day-positions get a quality session, spread apart where possible,
   randomized so regenerating doesn't always land on the same days */
function pickQualityPositions(n, count){
  const positions=[...Array(n).keys()];
  const shuffled=positions.slice().sort(()=>Math.random()-0.5);
  const chosen=[];
  for(const p of shuffled){
    if(chosen.length>=count) break;
    if(n<=2 || chosen.every(c=>Math.abs(c-p)>=2)) chosen.push(p);
  }
  for(const p of shuffled){ if(chosen.length>=count) break; if(!chosen.includes(p)) chosen.push(p); }
  return chosen.sort((a,b)=>a-b);
}
function dayTypesFor(n, phase){
  const count=qualityCount(n, phase);
  const qPositions=pickQualityPositions(n, count);
  const qualityChoices=[]; let lastQ=null;
  for(let i=0;i<count;i++){
    let q=QUALITY_TYPES[Math.floor(Math.random()*QUALITY_TYPES.length)];
    if(q===lastQ) q=QUALITY_TYPES[(QUALITY_TYPES.indexOf(q)+1)%QUALITY_TYPES.length];
    qualityChoices.push(q); lastQ=q;
  }
  const arr=[]; let qi=0;
  for(let i=0;i<n;i++){
    if(qPositions.includes(i)){ arr.push(qualityChoices[qi]); qi++; }
    else arr.push(EASY_TYPES[Math.floor(Math.random()*EASY_TYPES.length)]);
  }
  return arr;
}
function scaleWorkout(w, factor){
  const jitter=0.9+Math.random()*0.2; // slight variety between regenerations
  const f=factor*jitter;
  w=JSON.parse(JSON.stringify(w));
  w.blocks=w.blocks.map(b=>{
    if(b.kind==='steady') b.value=Math.max(600, Math.round(b.value*f/60)*60);
    else if(b.kind==='repeat') b.reps=Math.max(3, Math.min(12, Math.round(b.reps*f)));
    return b;
  });
  return w;
}
function generateWeekPlan(offset, dayIdx){
  const dates=weekDates(offset);
  const weekNum=trainingWeekNumber(offset);
  const wToRace=weeksToRaceFor(offset);
  const phase=phaseFor(wToRace);
  const factor=planFactor(phase, weekNum);
  const raceDates=new Set((S.profile.races||[]).map(r=>r.date));
  // don't schedule a training session on a day you're racing
  const sortedDays=dayIdx.slice().sort((a,b)=>a-b).filter(di=>!raceDates.has(ymd(dates[di])));
  const skippedForRace=dayIdx.length-sortedDays.length;
  const types=dayTypesFor(sortedDays.length, phase);
  const plan={};
  sortedDays.forEach((di,idx)=>{
    const date=dates[di]; const type=types[idx]||'volume';
    plan[ymd(date)]=[scaleWorkout(defaultWorkout(type,date), factor)];
  });
  return {plan, phase, factor, weekNum, weeksToRace:wToRace, race:nextRace(offset), skippedForRace};
}
function genContextNote(offset){
  const race=nextRace(offset), w=weeksToRaceFor(offset), phase=phaseFor(w);
  let s=t('phaseLabel')+PHASE_NAME[phase][S.lang];
  s += race? (t('weeksToRaceNote')+w+t('weeksToRaceSuffix')+race.name) : t('noRaceSet');
  return s;
}

const app=document.getElementById('app');
/* toasts live outside #app (appended to body directly) so render()'s innerHTML
   replacement never wipes them mid-display, unlike everything else in the UI. */
function toast(msg,kind){
  let wrap=document.getElementById('toastwrap');
  if(!wrap){ wrap=document.createElement('div'); wrap.id='toastwrap'; wrap.className='toastwrap'; document.body.appendChild(wrap); }
  const el=document.createElement('div');
  el.className='toast'+(kind==='err'?' err':kind==='ok'?' ok':'');
  el.textContent=msg;
  el.onclick=()=>dismissToast(el);
  wrap.appendChild(el);
  el.__timer=setTimeout(()=>dismissToast(el), 3800);
}
function dismissToast(el){
  if(!el || !el.parentNode) return;
  clearTimeout(el.__timer);
  el.style.animation='toastout .2s ease forwards';
  setTimeout(()=>el.remove(), 200);
}

  ${totalKm>0? `<div class="kmbar">

  <div class="weeknav">
    <button class="navbtn" onclick="nav(-1)">${prevArrow}</button>

      <div class="rng disp">${rng}</div>
      ${S.offset===0

    </div>
    <button class="navbtn" onclick="nav(1)">${nextArrow}</button>
  </div>

  <div class="strip" id="strip">

        <div class="dn">${DAYS[S.lang][i]}</div>
        <div class="dd">${d.getDate()}</div>

    }).join('')}

  <div style="padding:0 18px 4px">
    <button class="addbtn" onclick="openGenerate()"><span class="p">✨</span> ${t('autoGenerate')}</button>
  </div>

  <div class="detail">
    <div class="dhead">
      <div class="t disp">${S.lang==='he'?'יום '+DAYS.he[S.sel]+'׳':DAYS.en[S.sel]}</div>

function renderDay(date){
  const ws=dayWorkouts(date);
  if(!ws.length) return `<div class="empty">
    <div class="big">${t('emptyBig')}</div>
    <div>${t('emptySub')}</div></div>`;
  return ws.map((w,idx)=>renderCard(w,idx)).join('');
}

function renderCard(w,idx){
  const steps=flattenSteps(w); const total=steps.reduce((a,s)=>a+s.secs,0);
  const bar=steps.map(s=>`<div class="seg" style="flex:${s.secs}; background:var(${COLOR[s.intensity]})"></div>`).join('');
  const col=TYPES[w.type].color;
  return `<div class="card ${w.done?'done':''}">
    <div class="top">
      <span class="badge" style="background:var(${col}); color:#160b08">${w.name}</span>
      <span class="dur">${mmss(total)} · ~${Math.round(total/60)} ${t('min')}</span>
    </div>
    <div class="profile">${bar}</div>
    ${w.actual? `<div class="note" style="margin-bottom:11px">
      ${t('actualLabel')}: ${w.actual.distanceKm} ${t('kmShort')} · ${mmss(w.actual.paceSecPerKm||0)}/${t('kmShort')}${w.actual.avgHR?' · '+Math.round(w.actual.avgHR)+' HR':''}${scoreWorkout(w)!=null?' · '+t('scoreLabel')+' '+scoreWorkout(w)+'%':''}
    </div>` : ''}
    <div class="steps">
      <div class="step"><span class="pip" style="background:var(--warm)"></span>
        <span class="lbl">${t('warmup')}</span><span class="val">${mmss(w.warmupSec)}</span></div>
      ${w.blocks.map((b,i)=>renderBlockView(b,i,w.blocks.length)).join('')}
      <div class="step"><span class="pip" style="background:var(--warm)"></span>
        <span class="lbl">${t('cooldown')}</span><span class="val">${mmss(w.cooldownSec)}</span></div>
    </div>
    <div class="cardacts">
      <button class="donebtn ${w.done?'on':''}" onclick="toggleDone(${idx})">${w.done?'✓ '+t('doneWord'):t('markDone')}</button>
      <button onclick="openEditor(${idx})">${t('edit')}</button>
      <button class="del" onclick="delWorkout(${idx})">${t('del')}</button>
    </div>
  </div>`;
}
function renderBlockView(b, idx, total){
  if(b.kind==='steady'){
    const isSplit=total>1;
    const label=isSplit? (t('kmShort')+' '+(idx+1)) : t('steadyRun');
    const val=isSplit? fmtKm(b.value) : fmtStep(b);
    const paceStr=b.pace? ' · '+mmss(b.pace)+'/'+t('kmShort') : '';
    return `<div class="step"><span class="pip" style="background:var(--easy)"></span>
      <span class="lbl">${label}</span><span class="val">${val}${paceStr}</span></div>`;
  }
  return `<div class="rep">
    <div class="rh"><span class="x mono">${b.reps}×</span> ${t('reps')}</div>
    <div class="step"><span class="pip" style="background:var(--work)"></span>
      <span class="lbl">${t('effort')}</span><span class="val">${fmtStep(b.work)}</span></div>
    <div class="step"><span class="pip" style="background:var(--rec)"></span>
      <span class="lbl">${t('recovery')}</span><span class="val">${fmtStep(b.recovery)}</span></div>
  </div>`;
}

/* ============ sheets ============ */
function renderSheet(){
  if(!S.sheet) return `<div class="scrim"></div>`;
  if(S.sheet.mode==='edit') return editorSheet();
  if(S.sheet.mode==='send') return sendSheet();
  if(S.sheet.mode==='profile') return profileSheet();
  if(S.sheet.mode==='generate') return S.sheet.step==='preview'? generatePreviewSheet() : generateConfigSheet();
  if(S.sheet.mode==='stats') return statsSheet();
  return `<div class="scrim"></div>`;
}
function openStats(){ S.sheet={mode:'stats'}; render(); }
function statsSheet(){
  const weeks=[]; for(let i=-11;i<=0;i++) weeks.push(weekStats(i));
  const maxKm=Math.max(1, ...weeks.map(w=>w.planned));
  const mo=monthStats();
  const pace=avgPaceThisMonth();
  const M=MONTHS_I18N[S.lang];
  return `<div class="scrim on" onclick="if(event.target===this)closeSheet()"><div class="sheet">
    <div class="grab"></div>
    <h2 class="disp">${t('statsTitle')}</h2>

    <div class="statrow">
      <div class="statbox"><div class="statval mono">${mo.done.toFixed(1)}<span class="statunit">/${mo.planned.toFixed(1)}</span></div><div class="statlbl">${t('monthKm')}</div></div>
      <div class="statbox"><div class="statval mono">${mo.doneCount}</div><div class="statlbl">${t('monthWorkouts')}</div></div>
      <div class="statbox"><div class="statval mono">${pace!=null?mmss(pace):'—'}</div><div class="statlbl">${t('monthAvgPace')}</div></div>
    </div>

    <div class="minilbl" style="margin:18px 0 8px">${t('weeklyTrend')}</div>
    <div class="statsbars">
      ${weeks.map(w=>{
        const trackH=Math.max(3, Math.round(w.planned/maxKm*100));
        const fillH=w.planned>0? Math.round(Math.min(1,w.done/w.planned)*100) : 0;
        const d=w.weekStart;
        return `<div class="col" title="${w.done.toFixed(1)}/${w.planned.toFixed(1)} ${t('kmShort')}">
          <div class="track" style="height:${trackH}%"><div class="fill" style="height:${fillH}%"></div></div>
          <div class="wk">${d.getDate()}/${d.getMonth()+1}</div>
        </div>`;
      }).join('')}

    <div class="note" style="margin-top:10px">${t('statsLegend')}</div>

    <button class="ghost" onclick="closeSheet()" style="margin-top:16px">${t('close')}</button>
  </div></div>`;
}

function blockEditor(b,i){

    <div class="bh"><span class="bt">${t('steadyRun')}</span>
      <button class="rm" onclick="rmBlock(${i})">${t('remove')}</button></div>

  return `<div class="blk">

      <button class="rm" onclick="rmBlock(${i})">${t('remove')}</button></div>

function segEditor(seg,i,which){

      oninput="segVal(${i},'${which}',this.value)">`;
}

function readAndResizeImage(file, maxSize){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const s=Math.min(img.width,img.height);
        const canvas=document.createElement('canvas');
        canvas.width=maxSize; canvas.height=maxSize;
        canvas.getContext('2d').drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, maxSize, maxSize);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
async function onPhotoFile(input){
  const file=input.files && input.files[0]; if(!file) return;
  try{
    S.profile.photo=await readAndResizeImage(file, 200);
    save(); render();
  }catch(e){ toast(t('photoFailedAlert'),'err'); }
}
function importGooglePhoto(){
  const url=AUTH.session?.user?.user_metadata?.avatar_url||AUTH.session?.user?.user_metadata?.picture;
  if(!url){ toast(t('noGooglePhoto')); return; }
  S.profile.photo=url; save(); render();
}
function removePhoto(){ S.profile.photo=''; save(); render(); }

function raceDraftField(k,v){ S.sheet.raceDraft[k]=v; }
function syncRaceWorkout(race){
  if(!S.plan[race.date]) S.plan[race.date]=[];
  S.plan[race.date]=S.plan[race.date].filter(w=>w.raceId!==race.id);
  S.plan[race.date].push(...raceWorkouts(race));
}
function addRace(){
  const d=S.sheet.raceDraft;
  if(!d.date || !d.name){ toast(t('raceNeedsFields')); return; }
  S.profile.races=(S.profile.races||[]);
  const race={id:uid(), date:d.date, name:d.name, km:parseFloat(d.km)||0};
  S.profile.races.push(race);
  syncRaceWorkout(race);
  S.sheet.raceDraft={date:'',name:'',km:''};
  save(); render();
}
function delRace(id){
  const race=(S.profile.races||[]).find(r=>r.id===id);
  S.profile.races=(S.profile.races||[]).filter(r=>r.id!==id);
  if(race && S.plan[race.date]){
    S.plan[race.date]=S.plan[race.date].filter(w=>w.raceId!==id);
    if(!S.plan[race.date].length) delete S.plan[race.date];
  }
  save(); render();
}

function openGenerate(){
  const prevWk=weekDates(S.offset-1);
  let days=prevWk.map((d,i)=>dayWorkouts(d).length?i:null).filter(i=>i!=null);
  if(!days.length) days=[1,3,5];
  S.sheet={mode:'generate', step:'config', days};
  render();
}
function toggleGenDay(i){
  const days=S.sheet.days; const idx=days.indexOf(i);
  if(idx>=0) days.splice(idx,1); else days.push(i);
  render();
}
function proposeWeek(){
  if(!S.sheet.days.length){ toast(t('pickAtLeastOneDay')); return; }
  S.sheet.proposal=generateWeekPlan(S.offset, S.sheet.days);
  S.sheet.step='preview'; render();
}
function regenerateWeek(){ proposeWeek(); }
function backToGenConfig(){ S.sheet.step='config'; render(); }
function applyGeneratedWeek(){
  Object.assign(S.plan, S.sheet.proposal.plan);
  save(); closeSheet();
}

function openEditor(idx){
  const date=weekDates(S.offset)[S.sel];
  if(idx==null) S.sheet={mode:'edit', editIndex:null, draft:defaultWorkout('intervals',date)};
  else S.sheet={mode:'edit', editIndex:idx, draft:JSON.parse(JSON.stringify(dayWorkouts(date)[idx]))};
  render();
}
function setType(k){ const cur=S.sheet.draft; const date=weekDates(S.offset)[S.sel];
  const nw=defaultWorkout(k,date); nw.id=cur.id; S.sheet.draft=nw; render(); }
function d_name(v){ S.sheet.draft.name=v; }
function bump(key,dir){ const d=S.sheet.draft;
  if(key==='warm') d.warmupSec=Math.max(0,d.warmupSec+dir*60);
  else if(key==='cool') d.cooldownSec=Math.max(0,d.cooldownSec+dir*60);
  else if(key.startsWith('reps')){ const i=+key.slice(4); d.blocks[i].reps=Math.max(1,d.blocks[i].reps+dir); }
  render(); }
function addBlock(){ S.sheet.draft.blocks.push({kind:'repeat', reps:4,
  work:{mode:'time',value:120}, recovery:{mode:'time',value:90}}); render(); }
function rmBlock(i){ S.sheet.draft.blocks.splice(i,1); render(); }
function segMode(i,which,mode){ const b=S.sheet.draft.blocks[i];
  const seg = which==='steady'? b : b[which]; seg.mode=mode;
  if(mode==='dist' && seg.value<50) seg.value=400; render(); }
function segVal(i,which,v){ const b=S.sheet.draft.blocks[i];
  const seg = which==='steady'? b : b[which];
  seg.value = seg.mode==='time'? parseTimeInput(v) : parseDistInput(v); }
function saveWorkout(){
  const date=ymd(weekDates(S.offset)[S.sel]);
  if(!S.plan[date]) S.plan[date]=[];
  if(S.sheet.editIndex==null) S.plan[date].push(S.sheet.draft);
  else S.plan[date][S.sheet.editIndex]=S.sheet.draft;
  save(); closeSheet();
}
function delWorkout(idx){
  const date=ymd(weekDates(S.offset)[S.sel]);
  const w=S.plan[date][idx];
  if(w && w.raceId) S.profile.races=(S.profile.races||[]).filter(r=>r.id!==w.raceId);
  S.plan[date].splice(idx,1); if(!S.plan[date].length) delete S.plan[date];
  save(); render();
}
function toggleDone(idx){
  const date=ymd(weekDates(S.offset)[S.sel]);
  const w=S.plan[date][idx]; w.done=!w.done;
  save(); render();
}

/* ---- Garmin payload + send ---- */
/* S.sheet.dates drives scope for the whole send flow - a week's worth of dates
   or just the one day selected via openSendDay() - buildPayload/sendWeek/sendSheet
   all read from it instead of assuming "the whole visible week". */
function buildPayload(){
  const dates=S.sheet.dates||weekDates(S.offset); const workouts=[];
  dates.forEach(d=>dayWorkouts(d).forEach(w=>{
    workouts.push({ date:ymd(d), name:w.name, type:w.type, sport:'running',
      warmupSec:w.warmupSec, cooldownSec:w.cooldownSec, garminWorkoutId:w.garminWorkoutId||null,
      blocks:w.blocks.map(b=> b.kind==='steady'
        ? {kind:'steady', mode:b.mode, value:b.value, pace:b.pace||null}
        : {kind:'repeat', reps:b.reps,
           work:{mode:b.work.mode, value:b.work.value},
           recovery:{mode:b.recovery.mode, value:b.recovery.value}} ) });
  }));
  return { athlete:{ name:S.profile.name, maxHR:S.profile.maxHR, restHR:S.profile.restHR }, workouts };
}
function openSendWeek(){ S.sheet={mode:'send', payload:null, result:null, dates:weekDates(S.offset)}; render(); }
function openSendDay(){ S.sheet={mode:'send', payload:null, result:null, dates:[weekDates(S.offset)[S.sel]]}; render(); }
function showPayload(){ S.sheet.payload=JSON.stringify(buildPayload(),null,2); render(); }
async function sendWeek(){
  const url=BACKEND_URL;
  save();
  S.sheet.sending=true; render();
  const headers={'Content-Type':'application/json'};
  try{
    const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(buildPayload())});
    const data=await r.json();
    if(data.error){ toast(t('serverErrorAlert')+data.error,'err'); return; }
    const results=data.results||[];
    // buildPayload() and the backend both iterate in this same day/workout order,
    // so results[i] is the outcome for the i-th workout - use that to link the
    // real Garmin workoutId back onto the plan entry for later activity matching,
    // and so the *next* send replaces this workout on Garmin instead of duplicating it.
    const dates=S.sheet.dates||weekDates(S.offset); let i=0;
    dates.forEach(d=>dayWorkouts(d).forEach(w=>{
      const res=results[i++];
      if(res && res.ok && res.workoutId) w.garminWorkoutId=res.workoutId;
    }));
    S.sheet.result=results; save();
  }catch(e){
    toast(t('sendFailedAlert')+e.message+t('sendFailedHint'),'err');
  }finally{
    S.sheet.sending=false; render();
  }
}
/* distance match (60%) + pace match vs the workout's own implied pace (40%);
   falls back to distance-only if there's no actual pace to compare (rare) */
function scoreWorkout(w){
  if(!w.actual) return null;
  const planned=workoutKm(w);
  if(!planned) return null;
  const distScore=Math.max(0, 100-Math.abs(w.actual.distanceKm-planned)/planned*100);
  const plannedSecs=totalSecs(w);
  const plannedPace=plannedSecs && planned? plannedSecs/planned : null;
  let paceScore=null;
  if(plannedPace && w.actual.paceSecPerKm){
    paceScore=Math.max(0, 100-Math.abs(w.actual.paceSecPerKm-plannedPace)/plannedPace*100);
  }
  return Math.round(paceScore!=null? distScore*0.6+paceScore*0.4 : distScore);
}
/* matches completed Garmin activities to plan entries (by garminWorkoutId) for any
   date in [since,until] present in S.plan - not tied to the currently viewed week,
   so it can run both for the manual "check" button and a silent background sync. */
async function fetchAndApplyActivities(since,until){
  const r=await fetch(`${BACKEND_BASE}/activities?since=${since}&until=${until}`);
  const data=await r.json();
  if(data.error) return {matched:0, error:data.error};
  const acts=data.activities||[];
  let matched=0;
  Object.keys(S.plan).forEach(dateStr=>{
    if(dateStr<since || dateStr>until) return;
    S.plan[dateStr].forEach(w=>{
      if(!w.garminWorkoutId) return;
      const act=acts.find(a=>a.workoutId===w.garminWorkoutId);
      if(act){
        w.done=true;
        w.actual={distanceKm:act.distanceKm, durationSec:act.durationSec, paceSecPerKm:act.paceSecPerKm, avgHR:act.avgHR};
        matched++;
      }
    });
  });
  return {matched};
}
async function checkCompleted(){
  const wk=weekDates(S.offset);
  try{
    const {matched,error}=await fetchAndApplyActivities(ymd(wk[0]), ymd(wk[6]));
    if(error){ toast(t('serverErrorAlert')+error,'err'); return; }
    save(); render();
    toast(matched+' '+t('syncedSuffix'), matched>0?'ok':undefined);
  }catch(e){
    toast(t('sendFailedAlert')+e.message,'err');
  }
}
/* silent background sync on load - covers this week + last week so anything
   completed near a week boundary still gets picked up without user action */
async function autoCheckCompleted(){
  try{
    const until=ymd(new Date());
    const sinceD=new Date(); sinceD.setDate(sinceD.getDate()-13);
    const {matched}=await fetchAndApplyActivities(ymd(sinceD), until);
    if(matched){ save(); render(); }
  }catch(e){ /* best-effort - the manual button still works if this fails */ }
}

/* ---- swipe between weeks ---- */
function attachSwipe(){
  const el=document.getElementById('strip'); if(!el) return;
  let x0=null,y0=null;
  el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX; y0=e.touches[0].clientY;},{passive:true});
  el.addEventListener('touchend',e=>{
    if(x0==null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){ nav(dx<0?1:-1); } // RTL: swipe left -> next week
    x0=y0=null;
  },{passive:true});
}

render();
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
