<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Maslul — מתכנן אימונים</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Maslul" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Rubik:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="version.js"></script>
<style>
  :root{
    --ink:#0E1116; --panel:#171B22; --panel2:#1E242E; --line:#2A313D;
    --txt:#E8EBF0; --muted:#8A94A6; --muted2:#5D6675;
    --warm:#F5B845;   /* warmup / cooldown */
    --work:#FF5A3C;   /* hard effort */
    --rec:#35C6B4;    /* recovery / easy */
    --easy:#5FB0FF;   /* steady volume */
    --strength:#A78BFA; /* strength training */
    --yoga:#E893BE;   /* yoga / mobility */
    --crossfit:#C4D600; /* crossfit */
    --elliptical:#22D3C5; /* elliptical - was sharing --easy with rowing, now distinct */
    --tempo:#E85D75;   /* tempo - was sharing --work with intervals/hills/fartlek */
    --hills:#C97B4A;   /* hills */
    --trail:#629A62;   /* trail running */
    --fartlek:#B565D8; /* fartlek */
    --shadow:0 8px 30px rgba(0,0,0,.45);
    --del-border:#3a2422;
    --res-ok-bg:#12251f; --res-ok-border:#1e3a30; --res-ok-text:#8fe6cf;
    --res-err-bg:#2a1512; --res-err-border:#3a201c; --res-err-text:#ff9d8c;
    --type-on-bg:linear-gradient(180deg,#241a19,var(--panel));
  }
  :root[data-theme="light"]{
    --ink:#F6F7F9; --panel:#FFFFFF; --panel2:#EEF1F5; --line:#DEE3EA;
    --txt:#1A1F27; --muted:#6B7684; --muted2:#8D96A3;
    --shadow:0 8px 24px rgba(20,25,35,.12);
    --del-border:#ffd3c8;
    --res-ok-bg:#e3f8f1; --res-ok-border:#bdeee0; --res-ok-text:#1a8f6f;
    --res-err-bg:#fdeceb; --res-err-border:#f8cec8; --res-err-text:#c23d2b;
    --type-on-bg:linear-gradient(180deg,#fff1e8,var(--panel));
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--ink); color:var(--txt);
    font-family:'Assistant',system-ui,sans-serif; overscroll-behavior-y:none;}
  body{max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:96px;}
  .mono{font-family:'JetBrains Mono',monospace; direction:ltr; unicode-bidi:isolate;}
  .disp{font-family:'Rubik',sans-serif;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}

  /* ---- header ---- */
  header{padding:18px 18px 10px; display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:baseline; gap:9px;}
  .brand h1{font-family:'Rubik'; font-weight:800; font-size:26px; margin:0; letter-spacing:-.5px;}
  .brand .tick{width:11px; height:11px; border-radius:3px;
    background:linear-gradient(135deg,var(--work),var(--warm)); transform:translateY(-2px);}
  .profbtn{position:relative; width:40px; height:40px; border-radius:50%; background:var(--panel2);
    border:1px solid var(--line); display:grid; place-items:center; font-weight:700; font-size:15px; overflow:hidden; flex:none;}
  .profbtn img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .avatarbig{position:relative; width:64px; height:64px; border-radius:50%; overflow:visible; background:var(--panel2);
    border:1px solid var(--line); display:grid; place-items:center; font-weight:700; font-size:22px; flex:none; padding:0;}
  .avatarbig img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:50%;}
  .avatarbadge{position:absolute; bottom:-2px; inset-inline-end:-2px; width:22px; height:22px; border-radius:50%;
    background:var(--work); color:#1a0d09; display:grid; place-items:center; font-size:11px;
    border:2px solid var(--ink); z-index:1;}
  .hdrbtns{display:flex; align-items:center; gap:8px; flex:none;}
  .langbtn{height:40px; padding:0 13px; border-radius:20px; background:var(--panel2);
    border:1px solid var(--line); font-weight:700; font-size:13px; flex:none;
    display:inline-flex; align-items:center; justify-content:center;}

  /* ---- week nav ---- */
  .weeknav{display:flex; align-items:center; justify-content:space-between; padding:6px 18px 4px;}
  .weeknav .rng{font-family:'Rubik'; font-weight:700; font-size:15px;}
  .rngbtn{background:none; border:none; padding:2px 4px; margin:0; color:inherit;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; cursor:pointer;}
  .navbtn{width:34px; height:34px; border-radius:10px; background:var(--panel);
    border:1px solid var(--line); display:grid; place-items:center; color:var(--muted); font-size:18px;
    direction:ltr; unicode-bidi:isolate;}
  .navbtn:active{background:var(--panel2);}

  .strip{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; padding:8px 14px 4px;
    touch-action:pan-y;}
  .day{position:relative; border:1px solid var(--line); background:var(--panel);
    border-radius:13px; padding:9px 0 8px; text-align:center; transition:transform .08s, border-color .15s;}
  .day:active{transform:scale(.96);}
  .day .dn{font-size:12px; color:var(--muted); font-weight:600;}
  .day .dd{font-family:'JetBrains Mono'; font-weight:700; font-size:17px; margin-top:2px;}
  .day.sel{border-color:var(--work); background:var(--type-on-bg);}
  .day.today .dd{color:var(--warm);}
  .day .dots{display:flex; gap:3px; justify-content:center; margin-top:6px; height:6px;}
  .day .dot{width:6px; height:6px; border-radius:50%;}

  /* ---- day detail ---- */
  .detail{padding:14px 18px 4px;}

  .empty{border:1.5px dashed var(--line); border-radius:16px; padding:26px 18px;
    text-align:center; color:var(--muted);}
  .empty .emoji{font-size:44px; line-height:1; margin-bottom:10px;}
  .empty .big{font-family:'Rubik'; font-weight:700; color:var(--txt); font-size:16px; margin-bottom:4px;}

  .card{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:15px 15px 13px; margin-bottom:12px; box-shadow:var(--shadow);}
  .card.done{border-color:var(--rec);}
  .card.done::after{content:'✓'; position:absolute; top:-8px; inset-inline-end:14px; width:22px; height:22px;
    border-radius:50%; background:var(--rec); color:#062019; font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.35);}
  .card .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;}
  .badge{font-family:'Rubik'; font-weight:700; font-size:13px; padding:5px 11px; border-radius:9px;}
  .card .dur{font-family:'JetBrains Mono'; font-weight:700; font-size:14px; color:var(--muted);}

  /* effort profile bar */
  .profile{display:flex; height:34px; border-radius:9px; overflow:hidden; gap:2px; margin-bottom:11px;}
  .seg{min-width:3px;}
  .steps{display:flex; flex-direction:column; gap:7px;}
  .step{display:flex; align-items:center; gap:10px; font-size:14px;}
  .step .pip{width:9px; height:9px; border-radius:3px; flex:none;}
  .step .lbl{flex:1; color:var(--txt);}
  .step .val{font-family:'JetBrains Mono'; font-weight:700; color:var(--muted); font-size:13px;}
  .rep{background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:8px 10px;}
  .rep .rh{display:flex; align-items:center; gap:8px; margin-bottom:6px;
    font-family:'Rubik'; font-weight:700; font-size:13px;}
  .rep .rh .x{font-family:'JetBrains Mono'; color:var(--work);}
  .cardacts{display:flex; gap:8px; margin-top:13px;}
  .cardacts button{flex:1; padding:9px; border-radius:11px; font-weight:700; font-size:14px;
    border:1px solid var(--line); background:var(--panel2);}
  .cardacts .del{color:#ff7a68; border-color:var(--del-border);}
  .cardacts .donebtn.on{background:var(--rec); color:#062019; border-color:var(--rec);}

  /* ---- weekly km bar ---- */
  .kmbar{padding:2px 18px 10px;}
  .kmbar .track{height:10px; border-radius:6px; background:var(--panel); border:1px solid var(--line); overflow:hidden;}
  .kmbar .fill{height:100%; background:linear-gradient(90deg,var(--work),var(--warm)); border-radius:6px; transition:width .3s ease;}
  .kmbar .lbl{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:6px;}
  .syncicon{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
    border-radius:50%; background:var(--panel2); border:1px solid var(--line); font-size:11px; flex:none;}
  .syncicon:active{background:var(--panel);}

  /* ---- stats sheet ---- */
  .statrow{display:flex; gap:8px;}
  .statbox{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 8px; text-align:center;}
  .statval{font-weight:700; font-size:17px;}
  .statunit{font-size:12px; color:var(--muted); font-weight:600;}
  .statlbl{font-size:11px; color:var(--muted); margin-top:4px;}
  .statsbars{display:flex; align-items:flex-end; gap:5px; height:120px;}
  .statsbars .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end;
    align-items:center; height:100%;}
  .statsbars .track{width:100%; height:100%; display:flex; align-items:flex-end;
    background:var(--panel); border-radius:4px; overflow:hidden; align-self:flex-end;}
  .statsbars .fill{width:100%; background:linear-gradient(180deg,var(--warm),var(--work));}
  .statsbars .wk{font-size:8px; color:var(--muted2); margin-top:5px; writing-mode:horizontal-tb;}

  /* ---- jump-to-date calendar ---- */
  .calnav{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .caltitle{font-weight:700; font-size:16px; padding:6px 12px; border-radius:10px;}
  .caltitle:active{background:var(--panel2);}
  .monthgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .monthcell{padding:16px 4px; border-radius:12px; background:var(--panel); border:1px solid var(--line);
    font-family:'Rubik'; font-weight:700; font-size:14px; color:var(--txt); text-align:center;}
  .monthcell:active{background:var(--panel2);}
  .monthcell.today{border-color:var(--warm); color:var(--warm);}
  .monthcell.sel{border-color:var(--work); background:var(--type-on-bg); color:var(--work);}
  .calgrid{display:grid; grid-template-columns:repeat(7,1fr); row-gap:2px;}
  .calcell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; position:relative;}
  .calcell.dow{font-family:'Assistant'; font-weight:700; font-size:10.5px; letter-spacing:.03em; text-transform:uppercase;
    color:var(--muted); aspect-ratio:auto; padding-bottom:10px;}
  .calcell.day{background:none; border:none; padding:0; margin:0;}
  .calcell.day .num{width:36px; height:36px; max-width:82%; max-height:82%; display:flex; align-items:center; justify-content:center;
    border-radius:50%; font-family:'JetBrains Mono'; font-weight:600; font-size:13.5px; color:var(--txt); transition:background .1s;}
  .calcell.day:active .num{background:var(--panel2);}
  .calcell.day.muted .num{color:var(--muted2);}
  .calcell.day.today .num{border:1.5px solid var(--warm); color:var(--warm); font-weight:800;}
  .calcell.day.sel .num{background:var(--work); color:#1a0d09; font-weight:800;}
  .calcell.day.today.sel .num{box-shadow:0 0 0 2px var(--warm);}
  .calcell.day .dot{position:absolute; bottom:2px; width:4px; height:4px; border-radius:50%; background:var(--easy);}
  .calcell.day.sel .dot{background:#1a0d09;}

  /* ---- race split plan: half-split summary + per-km elapsed/zone rows ---- */
  .racesummary{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:11px;}
  .racesumrow{display:flex; justify-content:space-around; text-align:center;}
  .racesumval{font-family:'JetBrains Mono'; font-weight:700; font-size:15px;}
  .racesumval.faster{color:var(--rec);}
  .racesumval.slower{color:var(--work);}
  .racesumlbl{font-size:10px; color:var(--muted); margin-top:3px; text-transform:uppercase; letter-spacing:.03em;}
  .racesplits{display:flex; flex-direction:column;}
  .racesplitrow{display:grid; grid-template-columns:26px 1fr 1fr 1fr 1fr auto; gap:5px; align-items:center;
    font-size:11.5px; padding:6px 2px; border-bottom:1px solid var(--line);}
  .racesplitrow:last-child{border-bottom:none;}
  .racesplitrow .i{color:var(--muted); font-size:11px; white-space:nowrap;}
  .racesplitrow .v{font-family:'JetBrains Mono'; font-weight:600; color:var(--txt); font-size:11.5px;}
  .racesplitrow.head{padding-bottom:8px; border-bottom:1px solid var(--line);}
  .racesplitrow.head .i, .racesplitrow.head .v{font-family:'Assistant'; font-weight:700; font-size:9.5px;
    color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
  .racesplitrow.finish{background:var(--type-on-bg); border-radius:8px; margin-top:2px; border-bottom:none;}
  .racesplitrow.finish .i{color:var(--txt); font-weight:700;}
  .zonepill{font-size:9px; font-weight:800; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em; flex:none;}
  .zonepill.easy{background:rgba(95,176,255,.15); color:var(--easy);}
  .zonepill.target{background:rgba(245,184,69,.15); color:var(--warm);}
  .zonepill.push{background:rgba(53,198,180,.15); color:var(--rec);}

  .addbtn{width:100%; padding:14px; border-radius:15px; background:var(--panel);
    border:1px solid var(--line); font-family:'Rubik'; font-weight:700; font-size:15px;
    color:var(--txt); display:flex; align-items:center; justify-content:center; gap:8px;}
  .addbtn .p{color:var(--work); font-size:20px; line-height:0;}
  .addbtn:active{background:var(--panel2);}

  /* ---- send bar ---- */
  .sendbar{position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto;
    padding:12px 18px calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(180deg,rgba(14,17,22,0),var(--ink) 34%);}
  .send{width:100%; padding:15px; border-radius:15px; font-family:'Rubik'; font-weight:800; font-size:16px;
    background:linear-gradient(135deg,var(--work),#ff7b45); color:#1a0d09;
    display:flex; align-items:center; justify-content:center; gap:9px; box-shadow:0 6px 22px rgba(255,90,60,.32);}
  .send:disabled{background:var(--panel); color:var(--muted2); box-shadow:none;}
  .send:active{transform:translateY(1px);}

  /* ---- sheet / modal ---- */
  .scrim{position:fixed; inset:0; background:rgba(6,8,11,.66); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
    display:none; align-items:flex-start; justify-content:center; z-index:40;}
  .scrim.on{display:flex;}
  /* top-anchored, not bottom-anchored: a fixed margin-top so the sheet's top
     edge never moves, and only its height (via content, up to max-height)
     changes between forms. Previously bottom-anchored with min/max-height
     (82vh-92vh) both varying - switching to a shorter form (e.g. intervals's
     tall repeat-block editor -> tempo's single segment) shrank the sheet
     from the bottom-anchored side, so the visible top edge shifted down each
     time - jarring on every sport/kind switch, not just a scroll issue. */
  .sheet{width:100%; max-width:520px; margin-top:8vh; max-height:92vh; overflow-y:auto; background:var(--ink);
    border-radius:22px 22px 0 0; border-top:1px solid var(--line); padding:8px 18px calc(24px + env(safe-area-inset-bottom));
    box-sizing:border-box;}
  /* animation only on first paint (.entering, set by sheetEntering()) - render()
     recreates this element from scratch on every click inside it (full
     innerHTML replacement), so an unconditional animation here would replay
     the slide-up on every single interaction, not just when the sheet opens. */
  .sheet.entering{animation:up .22s ease;}
  @supports (height: 100dvh){
    .sheet{margin-top:8dvh; max-height:92dvh;}
  }
  .scrim.center{align-items:center;}
  .sheet.dialog{width:calc(100% - 32px); max-width:380px; border-radius:22px;
    border:1px solid var(--line); border-top:1px solid var(--line);}
  .sheet.dialog.entering{animation:dialogIn .18s ease;}
  @keyframes dialogIn{from{transform:scale(.96); opacity:0;} to{transform:scale(1); opacity:1;}}
  @keyframes up{from{transform:translateY(30px); opacity:.4;} to{transform:none; opacity:1;}}
  .grab{width:40px; height:4px; background:var(--line); border-radius:3px; margin:8px auto 12px;}
  .sheet h2{font-family:'Rubik'; font-weight:800; font-size:20px; margin:2px 0 16px;}

  /* ---- settings drawer (side panel, direction-aware) ---- */
  .hdrstart{display:flex; align-items:center; gap:10px;}
  .hamburger{width:40px; height:40px; border-radius:12px; background:var(--panel2);
    border:1px solid var(--line); font-size:18px; color:var(--txt); display:grid; place-items:center; flex:none;}
  .drawerscrim{position:fixed; inset:0; background:rgba(6,8,11,.66); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
    z-index:41;}
  .drawerscrim.entering{animation:scrimIn .22s ease;}
  .drawerscrim.closing{animation:scrimOut .22s ease forwards;}
  @keyframes scrimIn{from{opacity:0;} to{opacity:1;}}
  @keyframes scrimOut{from{opacity:1;} to{opacity:0;}}
  .drawer{position:fixed; top:0; bottom:0; width:min(86vw,380px); background:var(--ink);
    padding:18px 18px calc(20px + env(safe-area-inset-bottom)); overflow-y:auto; box-sizing:border-box;
    box-shadow:0 0 40px rgba(0,0,0,.45);}
  .drawer h2{font-weight:800; font-size:20px; margin:2px 0 16px;}
  .drawer.side-right{right:0; border-left:1px solid var(--line);}
  .drawer.side-right.entering{animation:drawerInR .26s cubic-bezier(.2,.8,.2,1);}
  .drawer.side-right.closing{animation:drawerOutR .22s ease forwards;}
  .drawer.side-left{left:0; border-right:1px solid var(--line);}
  .drawer.side-left.entering{animation:drawerInL .26s cubic-bezier(.2,.8,.2,1);}
  .drawer.side-left.closing{animation:drawerOutL .22s ease forwards;}
  @keyframes drawerInR{from{transform:translateX(100%);} to{transform:translateX(0);}}
  @keyframes drawerOutR{from{transform:translateX(0);} to{transform:translateX(100%);}}
  @keyframes drawerInL{from{transform:translateX(-100%);} to{transform:translateX(0);}}
  @keyframes drawerOutL{from{transform:translateX(0);} to{transform:translateX(-100%);}}

  .types{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px;}
  .type{position:relative; border:1px solid var(--line); background:var(--panel); border-radius:12px;
    padding:13px 6px 10px; text-align:center; overflow:hidden;}
  .type::before{content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--c);}
  .type.on{border-color:var(--work); background:var(--type-on-bg);}
  .type .tn{font-family:'Rubik'; font-weight:700; font-size:12.5px;}
  /* race sits inline with the other kinds now (6 fit in one row since
     recovery merged into volume), so it needs a visual cue beyond just its
     own accent stripe (every kind button already gets one of those) to still
     read as the odd one out - a race is an event, not an effort-kind like
     the other five. An always-on tint does that even before it's selected. */
  .type.race{background:rgba(245,184,69,.14); border-color:rgba(245,184,69,.45);}
  /* sport row: icon-only buttons, all 6 sports fit on one line */
  .types.sportrow{grid-template-columns:repeat(6,1fr); gap:5px;}
  .types.sportrow .type{padding:10px 2px 8px;}
  .type .icon{font-size:19px; line-height:1;}
  /* Running has two extra choices (trail and race), so keep the choices
     comfortably tappable instead of cramming seven labels into one row. */
  .types.kindrow{grid-template-columns:repeat(4,1fr); gap:4px;}
  .types.kindrow .type{padding:8px 1px 6px;}
  .types.kindrow .type .tn{font-size:10.5px; line-height:1.15;}

  .field{margin-bottom:15px;}
  .field label{display:block; font-size:13px; color:var(--muted); font-weight:600; margin-bottom:7px;}
  .field input{width:100%; background:var(--panel); border:1px solid var(--line); color:var(--txt);
    border-radius:12px; padding:12px; font-family:'Assistant'; font-size:15px;}
  .field input.mono{font-family:'JetBrains Mono';}
  .field input:focus{outline:none; border-color:var(--work);}
  .field input[type=date]{color-scheme:dark;}
  .field input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer; opacity:.75;}
  :root[data-theme="light"] .field input[type=date]{color-scheme:light;}

  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{width:40px; height:40px; border-radius:11px; background:var(--panel);
    border:1px solid var(--line); font-size:22px; font-weight:700; color:var(--txt); flex:none;}
  .stepper .v{flex:1; text-align:center; font-family:'JetBrains Mono'; font-weight:700; font-size:17px;
    border:none; background:none; color:var(--txt); padding:4px 2px; min-width:0;}
  .stepper input.v:focus{outline:none; color:var(--work);}
  .stepper button:active{background:var(--panel2);}

<script>
/* ============ storage (localStorage when deployed, memory in preview) ============ */
const store = (()=>{ let mem={}; let ok=true;
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ ok=false; }
  return {
    get(k,d){ try{ const v=ok?localStorage.getItem(k):mem[k]; return v?JSON.parse(v):d; }catch(e){ return d; } },
    set(k,v){ const s=JSON.stringify(v); if(ok){try{localStorage.setItem(k,s);}catch(e){mem[k]=s;}} else mem[k]=s; }
  };
})();

/* ============ config ============ */
const BACKEND_BASE='https://maslul-backend.vercel.app';
const BACKEND_URL=BACKEND_BASE+'/schedule-week';
const SUPABASE_URL='https://qvbdnaeewytfoolmubch.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_DauS9FSkZqkPK6lCld-Umw_zCom2X8w';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

/* ============ auth ============ */
let AUTH={ready:false, session:null};
/* backend routes are per-user now - every Garmin call needs this Supabase
   session token so the server knows whose garmin_connections row to use. */
function authHeaders(){
  return AUTH.session? {'Authorization':'Bearer '+AUTH.session.access_token} : {};
}
let pendingSave=null; // in-flight save() upsert, if any - see loadCloudData()
async function loadCloudData(userId){
  if(pendingSave) await pendingSave; // flush any in-flight write first, or we'd read stale data and clobber it
  const {data}=await sb.from('user_data').select('plan, profile').eq('user_id',userId).maybeSingle();
  if(data){
    S.plan=data.plan||{};
    S.profile=Object.assign({nameHe:'',nameEn:'',maxHR:'',restHR:'',thrPace:'',races:[],photo:''}, data.profile||{});
    migrateProfileName(S.profile);
    store.set('plan',S.plan); store.set('profile',S.profile);
  } else {
    const meta=AUTH.session?.user?.user_metadata||{};
    if(!S.profile.nameHe && !S.profile.nameEn){
      const gname=meta.full_name||meta.name||'';
      S.profile.nameHe=gname; S.profile.nameEn=gname;
    }
    if(!S.profile.photo) S.profile.photo=meta.avatar_url||meta.picture||'';
    await sb.from('user_data').upsert({user_id:userId, plan:S.plan, profile:S.profile});
  }
}
async function signInGoogle(){
  await sb.auth.signInWithOAuth({provider:'google', options:{redirectTo:window.location.origin+window.location.pathname}});
}
async function signOut(){ await sb.auth.signOut(); }

/* email+password sign-in, added alongside Google - same Supabase Auth user id
   either way, so nothing downstream (RLS, garmin_connections, verify_user)
   needs to know or care which method a given user used. */
let AUTHFORM={open:false, mode:'signin', email:'', password:'', password2:'', busy:false, forgotSent:false, recovery:false, newPassword:''};
function toggleEmailAuth(){ AUTHFORM.open=!AUTHFORM.open; render(); }
function setAuthMode(m){ AUTHFORM.mode=m; AUTHFORM.forgotSent=false; render(); }
async function submitAuthForm(){
  const f=AUTHFORM;
  if(f.busy) return;
  if(!f.email || !f.password){ toast(t('authFillRequired'),'err'); return; }
  if(f.mode==='signup' && f.password!==f.password2){ toast(t('passwordMismatch'),'err'); return; }
  f.busy=true; render();
  try{
    if(f.mode==='signup'){
      const {error}=await sb.auth.signUp({email:f.email, password:f.password});
      if(error){ toast(t('authError')+error.message,'err'); return; }
      toast(t('authSignupCheckEmail'),'ok');
      f.mode='signin'; f.password=''; f.password2='';
    } else {
      const {error}=await sb.auth.signInWithPassword({email:f.email, password:f.password});
      if(error){ toast(t('authError')+error.message,'err'); return; }
      // success re-renders via onAuthStateChange below
    }
  }catch(e){
    toast(t('authError')+e.message,'err');
  }finally{
    f.busy=false; render();
  }
}
async function submitForgotPassword(){
  const f=AUTHFORM;
  if(!f.email){ toast(t('authFillRequired'),'err'); return; }
  f.busy=true; render();
  try{
    await sb.auth.resetPasswordForEmail(f.email, {redirectTo:window.location.origin+window.location.pathname});
  }catch(e){ /* fall through to the same generic message either way - don't reveal whether the email exists */ }
  f.forgotSent=true; f.busy=false; render();
}
async function submitNewPassword(){
  const f=AUTHFORM;
  if(!f.newPassword || f.newPassword.length<6){ toast(t('passwordHint'),'err'); return; }
  f.busy=true; render();
  try{
    const {error}=await sb.auth.updateUser({password:f.newPassword});
    if(error){ toast(t('authError')+error.message,'err'); return; }
    f.recovery=false; f.newPassword='';
    toast(t('resetPasswordDone'),'ok');
    if(AUTH.session){ await loadCloudData(AUTH.session.user.id); autoCheckCompleted(); }
  }catch(e){
    toast(t('authError')+e.message,'err');
  }finally{
    f.busy=false; render();
  }
}

sb.auth.onAuthStateChange(async (event,session)=>{
  AUTH.session=session; AUTH.ready=true;
  if(event==='PASSWORD_RECOVERY'){ AUTHFORM.recovery=true; render(); return; }
  if(session && (event==='SIGNED_IN' || event==='INITIAL_SESSION') && !AUTHFORM.recovery){
    await loadCloudData(session.user.id);
    autoCheckCompleted(); // fire-and-forget background sync, doesn't block the render
  }
  render();
});

/* ============ helpers ============ */
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9);
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function daysUntil(dateStr){
  const now=new Date(); now.setHours(0,0,0,0);
  return Math.round((new Date(dateStr+'T00:00:00')-now)/86400000);
}
function fmtRaceDate(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
}

function restDayFlavor(dateStr){
  let h=0; for(let i=0;i<dateStr.length;i++) h=(h*31+dateStr.charCodeAt(i))>>>0;
  return REST_DAYS[h%REST_DAYS.length];
}
function mmss(sec){ sec=Math.round(sec);
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return h>0? h+':'+pad(m)+':'+pad(s) : m+':'+pad(s); }
function startOfWeek(offset){ // Sunday-start week
  const t=new Date(); t.setHours(0,0,0,0);
  t.setDate(t.getDate()-t.getDay()+offset*7); return t;
}
function weekDates(offset){ const s=startOfWeek(offset); return [...Array(7)].map((_,i)=>{const d=new Date(s); d.setDate(s.getDate()+i); return d;}); }

function dayWorkouts(date){ return S.plan[ymd(date)]||[]; }

/* ============ auto-generate weekly plan ============ */
/* trainingWeekNumber: how many consecutive populated weeks precede this one (resets after a gap) */
/* how many consecutive weeks of REAL training precede this one - not just planned,
   a week only counts if at least 70% of its planned km actually got done (via the
   Garmin sync). An empty week or a mostly-skipped week breaks the streak, so the
   next proposal doesn't keep escalating load on top of training that didn't happen. */
const PROGRESSION_COMPLETION_THRESHOLD=0.7;
function trainingWeekNumber(offset){
  let n=1, k=offset-1, guard=0;
  while(guard<52){
    const stats=weekStats(k);
    if(stats.planned<=0) break;
    if(stats.done/stats.planned < PROGRESSION_COMPLETION_THRESHOLD) break;
    n++; k--; guard++;
  }
  return n;
}
function nextRace(offset){
  const races=(S.profile.races||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const monday=ymd(weekDates(offset)[0]);
  return races.find(r=>r.date>=monday) || null;
}
function weeksToRaceFor(offset){
  const race=nextRace(offset); if(!race) return null;
  const monday=weekDates(offset)[0].getTime();
  const raceD=new Date(race.date+'T00:00:00').getTime();
  return Math.max(0, Math.round((raceD-monday)/(7*86400000)));
}
function phaseFor(w){
  if(w==null) return 'base';
  if(w<=0) return 'race';
  if(w<=3) return 'peak';
  if(w<=8) return 'build';
  return 'base';
}
/* multiplier on the workout-type defaults: progressive growth in base/build,
   every 4th training week is a lighter cutback week, peak/race taper down regardless of week count */
function planFactor(phase, weekNum){
  if(phase==='race') return 0.3;
  if(phase==='peak') return 0.6;
  const deload = weekNum%4===0;
  const growth = Math.min(0.05*(weekNum-1), 0.4);
  let f = deload? 0.7 : (1+growth);
  if(phase==='build') f += 0.1;
  return f;
}
const QUALITY_TYPES=['intervals','tempo','hills','fartlek'];
const EASY_TYPES=['volume']; // recovery merged into volume, see TYPES.recovery comment
function qualityCount(n, phase){
  if(n<=0) return 0;
  if(phase==='race') return 0; // no hard efforts the week you're racing
  if(phase==='peak') return 1;
  let c = n<=2 ? 1 : (n<=4 ? 1 : 2);
  if(phase==='build' && n>=4) c=Math.min(c+1,3);
  return Math.min(c, n);
}
/* choose which day-positions get a quality session, spread apart where possible,
   randomized so regenerating doesn't always land on the same days */
function pickQualityPositions(n, count){
  const positions=[...Array(n).keys()];
  const shuffled=positions.slice().sort(()=>Math.random()-0.5);
  const chosen=[];
  for(const p of shuffled){
    if(chosen.length>=count) break;
    if(n<=2 || chosen.every(c=>Math.abs(c-p)>=2)) chosen.push(p);
  }
  for(const p of shuffled){ if(chosen.length>=count) break; if(!chosen.includes(p)) chosen.push(p); }
  return chosen.sort((a,b)=>a-b);
}
function dayTypesFor(n, phase, trailRace=false){
  if(trailRace){
    // Make the distinction visible in every generated week: the base is
    // time-on-feet on terrain, with climbing work replacing road speedwork.
    const arr=Array(n).fill('trail');
    const count=qualityCount(n, phase);
    pickQualityPositions(n, count).forEach(i=>arr[i]='hills');
    return arr;
  }
  const count=qualityCount(n, phase);
  const qPositions=pickQualityPositions(n, count);
  const qualityChoices=[]; let lastQ=null;
  for(let i=0;i<count;i++){
    // Hills and time-on-feet trail runs prepare climbing, descending and
    // variable footing, unlike a road-race block focused on flat speed.
    const pool=trailRace? ['hills','trail'] : QUALITY_TYPES;
    let q=pool[Math.floor(Math.random()*pool.length)];
    if(q===lastQ) q=pool[(pool.indexOf(q)+1)%pool.length];
    qualityChoices.push(q); lastQ=q;
  }
  const arr=[]; let qi=0;
  for(let i=0;i<n;i++){
    if(qPositions.includes(i)){ arr.push(qualityChoices[qi]); qi++; }
    else arr.push(trailRace ? 'trail' : EASY_TYPES[Math.floor(Math.random()*EASY_TYPES.length)]);
  }
  return arr;
}
function scaleWorkout(w, factor){
  const jitter=0.9+Math.random()*0.2; // slight variety between regenerations
  const f=factor*jitter;
  w=JSON.parse(JSON.stringify(w));
  w.blocks=w.blocks.map(b=>{
    if(b.kind==='steady') b.value=Math.max(600, Math.round(b.value*f/60)*60);
    else if(b.kind==='repeat') b.reps=Math.max(3, Math.min(12, Math.round(b.reps*f)));
    return b;
  });
  return w;
}
function generateWeekPlan(offset, dayIdx){
  const dates=weekDates(offset);
  const weekNum=trainingWeekNumber(offset);
  const wToRace=weeksToRaceFor(offset);
  const phase=phaseFor(wToRace);
  const factor=planFactor(phase, weekNum);
  const raceDates=new Set((S.profile.races||[]).map(r=>r.date));
  // don't schedule a training session on a day you're racing
  const sortedDays=dayIdx.slice().sort((a,b)=>a-b).filter(di=>!raceDates.has(ymd(dates[di])));
  const skippedForRace=dayIdx.length-sortedDays.length;
  const race=nextRace(offset);
  const types=dayTypesFor(sortedDays.length, phase, race?.terrain==='trail');
  const plan={};
  sortedDays.forEach((di,idx)=>{
    const date=dates[di]; const type=types[idx]||'volume';
    plan[ymd(date)]=[scaleWorkout(defaultWorkout('running',type,date), factor)];
  });
  return {plan, phase, factor, weekNum, weeksToRace:wToRace, race, skippedForRace};
}
function genContextNote(offset){
  const race=nextRace(offset), w=weeksToRaceFor(offset), phase=phaseFor(w);
  let s=t('phaseLabel')+PHASE_NAME[phase][S.lang];
  s += race? (t('weeksToRaceNote')+w+t('weeksToRaceSuffix')+race.name) : t('noRaceSet');

function toast(msg,kind){
  let wrap=document.getElementById('toastwrap');
  if(!wrap){ wrap=document.createElement('div'); wrap.id='toastwrap'; wrap.className='toastwrap'; document.body.appendChild(wrap); }
  const el=document.createElement('div');
  el.className='toast'+(kind==='err'?' err':kind==='ok'?' ok':'');
  el.textContent=msg;
  el.onclick=()=>dismissToast(el);
  wrap.appendChild(el);
  el.__timer=setTimeout(()=>dismissToast(el), 3800);
}
function dismissToast(el){
  if(!el || !el.parentNode) return;
  clearTimeout(el.__timer);

function renderBlockView(b, idx, total, sport){
  if(b.kind==='steady'){
    const isSplit=total>1;
    const label=isSplit? (t('kmShort')+' '+(idx+1)) : steadyLabel(sport);
    const val=isSplit? fmtKm(b.value) : fmtStep(b);
    const paceStr=b.pace? ' · '+mmss(b.pace)+'/'+t('kmShort') : '';
    return `<div class="step"><span class="pip" style="background:var(--easy)"></span>
      <span class="lbl">${label}</span><span class="val">${val}${paceStr}</span></div>`;
  }
  return `<div class="rep">
    <div class="rh"><span class="x mono">${b.reps}×</span> ${t('reps')}</div>
    <div class="step"><span class="pip" style="background:var(--work)"></span>
      <span class="lbl">${t('effort')}</span><span class="val">${fmtStep(b.work)}</span></div>
    <div class="step"><span class="pip" style="background:var(--rec)"></span>
      <span class="lbl">${t('recovery')}</span><span class="val">${fmtStep(b.recovery)}</span></div>
  </div>`;
}
function renderExerciseSteps(w){
  const col=w.sport==='crossfit'? '--crossfit' : '--strength';
  const isTabata=w.wodFormat==='tabata';
  const isRound=w.wodFormat && w.wodFormat!=='forTime' && !isTabata;
  const header=w.wodFormat==='amrap'? `<div class="minilbl" style="margin-bottom:4px">AMRAP ${w.wodCapMin||20} ${t('min')}</div>`
    : w.wodFormat==='emom'? `<div class="minilbl" style="margin-bottom:4px">EMOM ${w.wodMinutes||12} ${t('min')}</div>`
    : isTabata? `<div class="minilbl" style="margin-bottom:4px">${t('wodTabata')} · ${t('wodTabataProtocol')}</div>` : '';
  const rows=(w.exercises||[]).map(ex=>{
    const weightStr=ex.weightKg? ' · '+ex.weightKg+' '+t('kgShort') : '';
    return `<div class="step"><span class="pip" style="background:var(${col})"></span>
      <span class="lbl">${exerciseCategoryLabel(ex.category)}</span>
      <span class="val">${isTabata? t('wodTabataProtocol') : isRound? ex.reps : ex.sets+'×'+ex.reps}${weightStr}</span></div>`;
  }).join('');
  return header+rows;
}

/* ============ sheets ============ */
function renderSheet(){
  if(!S.sheet) return `<div class="scrim"></div>`;
  if(S.sheet.mode==='edit') return editorSheet();
  if(S.sheet.mode==='send') return sendSheet();
  if(S.sheet.mode==='profile') return profileSheet();
  if(S.sheet.mode==='zones') return zonesSheet();
  if(S.sheet.mode==='races') return racesSheet();
  if(S.sheet.mode==='generate') return S.sheet.step==='preview'? generatePreviewSheet() : generateConfigSheet();
  if(S.sheet.mode==='stats') return statsSheet();
  if(S.sheet.mode==='datejump') return dateJumpSheet();
  if(S.sheet.mode==='run') return runSheet();
  return `<div class="scrim"></div>`;
}
function openStats(){ if(S.sheet && S.sheet.mode==='stats') return; S.sheet={mode:'stats'}; render(); }
function openRunDetail(idx){
  S.sheet={mode:'run', idx, splits:null, splitsLoading:false, splitsError:null};
  render();
  loadRunSplits();
}
async function loadRunSplits(){
  const date=ymd(weekDates(S.offset)[S.sel]);
  const w=(S.plan[date]||[])[S.sheet.idx];
  if(!w || !w.actual || !w.actual.activityId) return;
  S.sheet.splitsLoading=true; render();
  try{
    const r=await fetch(`${BACKEND_BASE}/activity-splits?activityId=${w.actual.activityId}`,{headers:authHeaders()});
    const data=await r.json();
    if(!S.sheet || S.sheet.mode!=='run') return; // sheet closed while the request was in flight
    S.sheet.splits=data.splits||[];
    S.sheet.splitsError=data.error||null;
  }catch(e){
    if(S.sheet && S.sheet.mode==='run') S.sheet.splitsError=e.message;
  }finally{
    if(S.sheet && S.sheet.mode==='run') S.sheet.splitsLoading=false;
    render();
  }
}

      <div class="statbox"><div class="statval mono">${mo.doneCount}</div><div class="statlbl">${t('monthWorkouts')}</div></div>

/* custom calendar for "jump to date" - a native <input type=date> picker can't
   be restyled to match the app's theme, so this is a small in-app month grid instead */
function dateJumpSheet(){
  return S.sheet.calView==='months'? monthPickSheet() : dayPickSheet();
}
/* tapping the month/year title drops into this year-at-a-time month grid -
   reaching a distant date by only clicking the day-view's month arrows would
   take dozens of taps, this gets there in two: pick the year, pick the month */
function monthPickSheet(){
  const {viewYear}=S.sheet;
  const M=MONTHS_I18N[S.lang];
  const todayY=new Date().getFullYear(), todayM=new Date().getMonth();
  const selDate=weekDates(S.offset)[S.sel];
  const prevArrow=S.lang==='he'?'›':'‹', nextArrow=S.lang==='he'?'‹':'›';
  return `<div class="scrim on center" onclick="if(event.target===this)closeSheet()"><div class="sheet compact dialog${sheetEntering()}">
    <h2 class="disp">${t('jumpToDate')}</h2>
    <div class="calnav">
      <button class="navbtn" onclick="dateJumpYearNav(-1)">${prevArrow}</button>
      <div class="caltitle disp">${viewYear}</div>
      <button class="navbtn" onclick="dateJumpYearNav(1)">${nextArrow}</button>
    </div>
    <div class="monthgrid">
      ${M.map((mn,i)=>{
        const cls=['monthcell'];
        if(viewYear===todayY && i===todayM) cls.push('today');
        if(viewYear===selDate.getFullYear() && i===selDate.getMonth()) cls.push('sel');
        return `<button class="${cls.join(' ')}" onclick="dateJumpPickMonth(${i})">${mn}</button>`;
      }).join('')}
    </div>
    <div style="display:flex; gap:8px; margin-top:16px">
      <button class="ghost" style="margin:0; flex:1" onclick="dateJumpPick('${ymd(new Date())}')">${t('todayWord')}</button>
      <button class="ghost" style="margin:0; flex:1" onclick="closeSheet()">${t('close')}</button>
    </div>
  </div></div>`;
}
function dayPickSheet(){
  const {viewYear, viewMonth}=S.sheet;
  const startDow=new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth=new Date(viewYear, viewMonth+1, 0).getDate();
  const prevMonthDays=new Date(viewYear, viewMonth, 0).getDate();
  const todayStr=ymd(new Date());
  const selDateStr=ymd(weekDates(S.offset)[S.sel]);
  const M=MONTHS_I18N[S.lang];
  const prevArrow=S.lang==='he'?'›':'‹', nextArrow=S.lang==='he'?'‹':'›';

  // build a full 7-wide grid including muted lead-in/trail-off days from the
  // adjacent months, so the grid always looks balanced instead of leaving
  // blank gaps before the 1st or a ragged last row
  const cells=[];
  for(let i=startDow-1;i>=0;i--){
    let y=viewYear, m=viewMonth-1; if(m<0){ m=11; y--; }
    cells.push({d:prevMonthDays-i, y, m, muted:true});
  }
  for(let d=1; d<=daysInMonth; d++) cells.push({d, y:viewYear, m:viewMonth, muted:false});
  let nextDay=1;
  while(cells.length%7!==0){
    let y=viewYear, m=viewMonth+1; if(m>11){ m=0; y++; }
    cells.push({d:nextDay++, y, m, muted:true});
  }

  return `<div class="scrim on center" onclick="if(event.target===this)closeSheet()"><div class="sheet compact dialog${sheetEntering()}">
    <h2 class="disp">${t('jumpToDate')}</h2>
    <div class="calnav">
      <button class="navbtn" onclick="dateJumpNav(-1)">${prevArrow}</button>
      <button class="caltitle disp" onclick="dateJumpToggleView()">${M[viewMonth]} ${viewYear}</button>
      <button class="navbtn" onclick="dateJumpNav(1)">${nextArrow}</button>
    </div>
    <div class="calgrid">
      ${DAYS[S.lang].map(dn=>`<div class="calcell dow">${dn}</div>`).join('')}
      ${cells.map(c=>{
        const dateStr=c.y+'-'+pad(c.m+1)+'-'+pad(c.d);
        const hasWorkout=(S.plan[dateStr]||[]).length>0;
        const cls=['calcell','day'];
        if(c.muted) cls.push('muted');
        if(dateStr===todayStr) cls.push('today');
        if(dateStr===selDateStr) cls.push('sel');
        return `<button class="${cls.join(' ')}" onclick="dateJumpPick('${dateStr}')">
          <span class="num">${c.d}</span>${hasWorkout?'<span class="dot"></span>':''}
        </button>`;
      }).join('')}
    </div>
    <div style="display:flex; gap:8px; margin-top:16px">
      <button class="ghost" style="margin:0; flex:1" onclick="dateJumpPick('${todayStr}')">${t('todayWord')}</button>
      <button class="ghost" style="margin:0; flex:1" onclick="closeSheet()">${t('close')}</button>
    </div>
  </div></div>`;
}

/* run detail sheet: everything Garmin gave us for one completed run, plus
   lazily-fetched km splits (kept out of /activities since that's one extra
   Garmin request per run - only worth it once the user actually opens this) */
function runSheet(){
  const date=ymd(weekDates(S.offset)[S.sel]);
  const w=(S.plan[date]||[])[S.sheet.idx];
  if(!w || !w.actual){
    return `<div class="scrim on" onclick="if(event.target===this)closeSheet()"><div class="sheet${sheetEntering()}">
      <div class="grab"></div>
      <button class="ghost" onclick="closeSheet()">${t('close')}</button>
    </div></div>`;
  }
  const a=w.actual;
  const stats=[
    [a.distanceKm!=null? a.distanceKm+' '+t('kmShort') : '—', t('distanceLabel')],
    [a.durationSec!=null? mmss(a.durationSec) : '—', t('durationLabel')],
    [a.paceSecPerKm? mmss(a.paceSecPerKm)+'/'+t('kmShort') : '—', t('paceLabel')],
    [a.avgHR!=null? Math.round(a.avgHR) : '—', t('avgHRLabel')],
    [a.maxHR!=null? Math.round(a.maxHR) : '—', t('maxHR')],
    [a.calories!=null? Math.round(a.calories) : '—', t('caloriesLabel')],
    [a.elevationGainM!=null? Math.round(a.elevationGainM)+t('meterShort') : '—', t('elevGainLabel')],
    [a.elevationLossM!=null? Math.round(a.elevationLossM)+t('meterShort') : '—', t('elevLossLabel')],
    [a.avgCadence!=null? Math.round(a.avgCadence) : '—', t('cadenceLabel')],
    [a.aerobicTrainingEffect!=null? a.aerobicTrainingEffect.toFixed(1) : '—', t('aerobicLabel')],
    [a.anaerobicTrainingEffect!=null? a.anaerobicTrainingEffect.toFixed(1) : '—', t('anaerobicLabel')],
  ];
  const sc=scoreWorkout(w);
  if(sc!=null) stats.push([sc+'%', t('scoreLabel')]);

  const splits=S.sheet.splits;
  const splitsBody = S.sheet.splitsLoading
    ? `<div class="note">${t('loadingWord')}</div>`
    : (splits && splits.length
        ? `<div class="splits">
            <div class="splitrow head"><span>#</span><span>${t('kmShort')}</span><span>${t('paceLabel')}</span><span>HR</span><span>⛰</span></div>
            ${splits.map(s=>`<div class="splitrow">
              <span class="i">${s.index}</span>
              <span class="v">${s.distanceKm!=null? s.distanceKm.toFixed(2) : '—'}</span>
              <span class="v">${s.paceSecPerKm? mmss(s.paceSecPerKm) : '—'}</span>
              <span class="v">${s.avgHR!=null? Math.round(s.avgHR) : '—'}</span>
              <span class="v">${s.elevationGainM!=null? Math.round(s.elevationGainM) : '—'}</span>
            </div>`).join('')}
          </div>`
        : `<div class="note">${S.sheet.splitsError || t('splitsEmpty')}</div>`);

  return `<div class="scrim on" onclick="if(event.target===this)closeSheet()"><div class="sheet${sheetEntering()}">
    <div class="grab"></div>
    <h2 class="disp">${w.name}</h2>
    ${a.matchedByDate? `<div class="note" style="margin-bottom:12px">${t('matchedByDateNote')}</div>` : ''}
    <div class="statrow" style="flex-wrap:wrap; gap:8px">
      ${stats.map(([v,l])=>`<div class="statbox" style="flex:1 1 28%; min-width:88px">
        <div class="statval mono">${v}</div><div class="statlbl">${l}</div>
      </div>`).join('')}
    </div>
    <div class="minilbl" style="margin:18px 0 8px">${t('splitsTitle')}</div>
    ${splitsBody}
    <button class="ghost" onclick="closeSheet()" style="margin-top:16px">${t('close')}</button>
  </div></div>`;
}

/* +/- step size (in minutes) for time fields - one shared value (bump() and
   segTimeStep() both read S.sheet.timeStepMin), but the picker itself is
   rendered right next to each individual time stepper (warmup, cooldown,
   race warmup/cooldown, a segment's time value) rather than once globally -
   it controls that specific control, not the workout as a whole, so it
   belongs beside it and only appears where a time field is actually shown. */
function timeStepChips(){
  const cur=S.sheet.timeStepMin||1;
  return `<div class="distchips">

function setTimeStepMin(m){ S.sheet.timeStepMin=m; render(); }
/* the middle of a stepper is itself a live-typable input (not a read-only
   display), so tapping +/- and typing a number both work on the same field
   instead of duplicating the value into a separate exact-input below. Like
   the other free-typed fields (segVal, exerciseWeight), no render() on
   input - only bump()'s +/- and blur/state changes re-render, so typing
   doesn't fight the DOM for focus mid-keystroke. */
function stepperHTML(key,val){
  return `<div class="stepper">
    <button onclick="bump('${key}',-1)">−</button>
    <input class="v mono" dir="ltr" inputmode="numeric" value="${val}" onclick="this.select()" oninput="setStepperVal('${key}',this.value)" onkeydown="commitOnEnter(event)">
    <button onclick="bump('${key}',1)">+</button></div>`;
}
function blockEditor(b,i,sport){

}
const RUN_DIST_CHIPS_KM=[5,10,21.1,42.2];

const RACE_DIST_CHIPS_KM=[5,10,15,21.1,42.2];
function raceChipLabel(km){

function raceDistSection(d){

function regenRaceBlocks(d){
  const km=d.raceDistM/1000;
  d.blocks = d.raceTerrain==='trail' && d.raceTargetSec ? [{kind:'steady', mode:'time', value:d.raceTargetSec}]
    : d.raceTargetSec? buildTargetSplits(km, d.raceTargetSec, d.raceSplit||'negative')

/* strength workouts are sets-of-reps, not time/distance - kept in d.exercises
   instead of d.blocks (which stays [] for this type) so every other function
   that walks blocks (workoutKm, flattenSteps, the backend Block model) keeps
   its existing time/dist contract instead of growing a third shape. */
function strengthSection(d){
  if(!d.exercises || !d.exercises.length) d.exercises=[{category:'SQUAT', sets:3, reps:10, weightKg:null, restSec:90}];
  const rows=d.exercises.map((ex,i)=>`

/* crossfit reuses strength's exercises shape (sets/reps/weight/rest) but from a
   broader, conditioning-flavored category pool, always keeps warmup+cooldown
   (no on/off toggle - unlike strength's optional warmup), and is meant to be
   used via "generate" (generateCrossfitExercises()), not built by hand - so it
   defaults to a read-only summary of the generated WOD rather than the same
   exposed chips/steppers editor strength uses. The full editor is still one
   tap away (crossfitEditMode) for anyone who does want to tweak a movement. */
function crossfitSection(d){
  if(!d.wodFormat) d.wodFormat='forTime';
  if(!d.exercises || !d.exercises.length) Object.assign(d, generateCrossfitWod());
  const editing=!!S.sheet.crossfitEditMode;
  const fmt=d.wodFormat;
  // AMRAP/EMOM: a "round" or "minute" of movements, done repeatedly until the
  // cap/duration - sets and rest between sets don't apply (the round/minute
  // itself is the repeating unit), so only reps are shown/edited for those.
  // Tabata is even more fixed - 8 rounds of 20s work/10s rest per movement is
  // the protocol, not something to configure, so it doesn't even show reps.
  const isTabata=fmt==='tabata';
  const isRound=fmt!=='forTime' && !isTabata;

  const formatRow=`<div class="toggle" style="margin-bottom:11px">
      <button class="${fmt==='forTime'?'on':''}" onclick="setCrossfitFormat('forTime')">${t('wodForTime')}</button>
      <button class="${fmt==='amrap'?'on':''}" onclick="setCrossfitFormat('amrap')">AMRAP</button>
      <button class="${fmt==='emom'?'on':''}" onclick="setCrossfitFormat('emom')">EMOM</button>
      <button class="${isTabata?'on':''}" onclick="setCrossfitFormat('tabata')">${t('wodTabata')}</button>
    </div>`;
  const capRow=fmt==='amrap'? `<div class="minilbl" style="margin-bottom:4px">${t('wodCapLabel')}</div>${stepperHTML('wodCap', d.wodCapMin||20)}`
    : fmt==='emom'? `<div class="minilbl" style="margin-bottom:4px">${t('wodMinLabel')}</div>${stepperHTML('wodMin', d.wodMinutes||12)}` : '';
  const summaryHeader=fmt==='amrap'? `<div class="minilbl" style="margin:14px 0 4px">AMRAP ${d.wodCapMin||20} ${t('min')} · ${t('wodRoundLabel')}</div>`
    : fmt==='emom'? `<div class="minilbl" style="margin:14px 0 4px">EMOM ${d.wodMinutes||12} ${t('min')} · ${t('wodPerMinuteLabel')}</div>`
    : isTabata? `<div class="minilbl" style="margin:14px 0 4px">${t('wodTabata')} · ${t('wodTabataProtocol')}</div>`
    : `<div class="minilbl" style="margin:14px 0 8px">${t('exercisesLabel')}</div>`;

  const summary=`<div class="steps">${d.exercises.map(ex=>`
    <div class="step"><span class="pip" style="background:var(--crossfit)"></span>
      <span class="lbl">${exerciseCategoryLabel(ex.category)}</span>
      <span class="val">${isTabata? t('wodTabataProtocol') : isRound? ex.reps : ex.sets+'×'+ex.reps}${ex.weightKg? ' · '+ex.weightKg+' '+t('kgShort') : ''}</span></div>`).join('')}</div>`;
  const rows=d.exercises.map((ex,i)=>`
    <div class="blk">
      <div class="bh"><span class="bt">${exerciseCategoryLabel(ex.category)}</span>
        <button class="rm" onclick="rmExercise(${i})">${t('remove')}</button></div>
      <div class="exchips">
        ${CROSSFIT_CATEGORIES.map(c=>`<button class="${ex.category===c.key?'on':''}" onclick="exerciseCategory(${i},'${c.key}')">${exerciseCategoryLabel(c.key)}</button>`).join('')}
      </div>
      ${isTabata? '' : isRound? `
      <div class="field" style="margin-top:11px; margin-bottom:0">
        <div class="minilbl">${t('repsLabel')}</div>${stepperHTML('exReps'+i, ex.reps)}
      </div>` : `
      <div class="seg2" style="margin-top:11px">
        <div><div class="minilbl">${t('setsLabel')}</div>${stepperHTML('exSets'+i, ex.sets)}</div>
        <div><div class="minilbl">${t('repsLabel')}</div>${stepperHTML('exReps'+i, ex.reps)}</div>
      </div>
      <div class="field" style="margin-top:11px; margin-bottom:0">
        <label>${t('restLabel')}</label>
        ${stepperHTML('exRest'+i, ex.restSec)}
      </div>`}
      <div class="field" style="margin-top:11px; margin-bottom:0">
        <label>${t('weightLabel')}</label>
        <input class="mono" dir="ltr" inputmode="decimal" value="${ex.weightKg??''}" placeholder="${t('weightHint')}" oninput="exerciseWeight(${i},this.value)">
      </div>
    </div>`).join('');
  return `<button class="addblk" onclick="regenerateCrossfit()">${t('generateWorkout')}</button>
    ${formatRow}
    ${capRow}
    ${summaryHeader}
    ${editing? rows : summary}
    ${editing? `<button class="addblk" onclick="addExercise()">${t('addExercise')}</button>` : ''}
    <button class="ghost" style="margin-top:11px" onclick="toggleCrossfitEdit()">${editing? t('doneEditing') : t('editManually')}</button>
    <div class="minilbl" style="margin-top:15px">${t('warmupMin')}</div>
    ${stepperHTML('warm', Math.round(d.warmupSec/60))}
    <div class="minilbl" style="margin-top:11px">${t('cooldownMin')}</div>
    ${stepperHTML('cool', Math.round(d.cooldownSec/60))}
    ${timeStepChips()}`;
}
function regenerateCrossfit(){ Object.assign(S.sheet.draft, generateCrossfitWod()); render(); scrollSheetToTop(); }
function setCrossfitFormat(fmt){ const d=S.sheet.draft; d.wodFormat=fmt;
  if(fmt==='forTime' && (!d.exercises.length || d.exercises[0].sets===1)) d.exercises=generateCrossfitExercises();
  if(fmt==='amrap'){ if(!d.wodCapMin) d.wodCapMin=20; if(!d.exercises.length || d.exercises[0].sets!==1) d.exercises=generateCrossfitRound(4); }
  if(fmt==='emom'){ if(!d.wodMinutes) d.wodMinutes=12; if(!d.exercises.length || d.exercises[0].sets!==1) d.exercises=generateCrossfitRound(2); }
  if(fmt==='tabata'){ if(!d.exercises.length || d.exercises[0].sets!==1) d.exercises=generateCrossfitRound(3); }
  render(); scrollSheetToTop(); }
function toggleCrossfitEdit(){ S.sheet.crossfitEditMode=!S.sheet.crossfitEditMode; render(); }
function addExercise(){ S.sheet.draft.exercises.push({category:'SQUAT', sets:3, reps:10, weightKg:null, restSec:90}); render(); }
function rmExercise(i){ S.sheet.draft.exercises.splice(i,1); render(); }
function exerciseCategory(i,key){ S.sheet.draft.exercises[i].category=key; render(); }
// weight typed as free text - no render() here, matches the fixed focus-loss
// pattern: fields that need a live re-render on every keystroke lose focus
// after the first character (see render()'s focus-restore comment above).
function exerciseWeight(i,v){ const n=parseFloat(v); S.sheet.draft.exercises[i].weightKg=isNaN(n)?null:n; }
function raceDistPick(km){ const d=S.sheet.draft; d.raceDistM=Math.round(km*1000); regenRaceBlocks(d); render(); }
function raceDistStep(dir){ const d=S.sheet.draft; const step=d.raceDistM>=1000?500:50;
  d.raceDistM=Math.max(step, d.raceDistM+dir*step); regenRaceBlocks(d); render(); }
function raceDistInput(v){ const d=S.sheet.draft; d.raceDistM=parseDistInput(v); regenRaceBlocks(d); render(); }
function raceTargetInput(v){ const d=S.sheet.draft; d.raceTargetSec=parseTargetTime(v)||null; regenRaceBlocks(d); render(); }
function setRaceSplit(k){ const d=S.sheet.draft; d.raceSplit=k; regenRaceBlocks(d); render(); }
function setRaceTerrain(terrain){ const d=S.sheet.draft; d.raceTerrain=terrain; regenRaceBlocks(d); render(); }
function segEditor(seg,i,which,sport){
  // yoga has no meaningful distance - skip the toggle entirely instead of just
  // defaulting to time, so there's nothing suggesting otherwise
  const allowDist=sport!=='yoga';
  const isTime=seg.mode==='time' || !allowDist;
  const unit=seg.unit||(seg.value>=1000?'km':'m');
  // Time/Distance is the real choice (mode); km/m only matters once Distance
  // is picked, so it rides on the same row as a narrower secondary toggle
  // instead of a separate row - not merged into one flat 3-way control,
  // since "which unit" isn't a peer of "time vs distance".
  const modeRow=allowDist? `<div style="display:flex; gap:8px; margin-bottom:7px">
      <div class="toggle" style="flex:1">
        <button class="${isTime?'on':''}" onclick="segMode(${i},'${which}','time')">${t('timeMode')}</button>
        <button class="${!isTime?'on':''}" onclick="segMode(${i},'${which}','dist')">${t('distMode')}</button>
      </div>
      ${!isTime? `<div class="toggle unittoggle">
        <button class="${unit==='km'?'on':''}" onclick="segUnit(${i},'${which}','km')">${t('kmShort')}</button>
        <button class="${unit==='m'?'on':''}" onclick="segUnit(${i},'${which}','m')">${t('meterShort')}</button>
      </div>` : ''}
    </div>` : '';
  if(isTime){
    return modeRow+`
      <div class="stepper">
        <button onclick="segTimeStep(${i},'${which}',-1)">−</button>
        <input class="v mono" dir="ltr" value="${fmtTimeInput(seg.value)}" placeholder="${t('timeHint')}" onclick="this.select()"
          oninput="segVal(${i},'${which}',this.value)" onkeydown="commitOnEnter(event)">
        <button onclick="segTimeStep(${i},'${which}',1)">+</button>
      </div>`+timeStepChips();
  }
  const distChipsKm=sport==='running'? RUN_DIST_CHIPS_KM : CARDIO_DIST_CHIPS_KM;
  const chips=which==='steady'? `<div class="distchips">
      ${distChipsKm.map(km=>`<button class="${unit==='km'&&seg.value===Math.round(km*1000)?'on':''}" onclick="segDistPick(${i},'${which}',${km})">${raceChipLabel(km)}</button>`).join('')}
    </div>` : '';
  return modeRow+`
    ${chips}
    <div class="stepper">
      <button onclick="segDistStep(${i},'${which}',-1)">−</button>
      <input class="v mono" dir="ltr" value="${fmtDistInputUnit(seg.value,unit)}" placeholder="${t('distHint')}" onclick="this.select()"
        oninput="segVal(${i},'${which}',this.value)" onkeydown="commitOnEnter(event)">
      <button onclick="segDistStep(${i},'${which}',1)">+</button>
    </div>`;
}

/* send sheet */

    ${res? `<div style="margin-bottom:10px">${res.map(r=>`<div class="res ${r.ok?'ok':'err'}">

    <button class="primary disp" ${S.sheet.sending?'disabled':''} onclick="sendWeek()">${S.sheet.sending?`<span class="spinner"></span>${t('sendingWord')}`:(res?t('sendAgain'):t('sendToGarmin'))}</button>
    <button class="ghost" onclick="showPayload()">${t('showPayload')}</button>

/* the drawer's slide-in animation is baked into .drawer.side-*'s CSS via an
   .entering modifier (not on the base rule) - render() rebuilds the whole DOM
   on every call, including from unrelated background renders (auth events,
   cloud sync) while a drawer sheet is already open, which would otherwise
   replay the slide-in animation each time and look like a double-open blink.
   Flip this once per sheet instance so only the very first paint animates. */
function sheetEntering(){ const e=!S.sheet.entered; S.sheet.entered=true; return e?' entering':''; }

/* ---- per-user Garmin connection (Settings > Garmin) ---- */
async function loadGarminStatus(){
  try{
    const r=await fetch(`${BACKEND_BASE}/garmin/status`,{headers:authHeaders()});
    const data=await r.json();
    if(!S.sheet || S.sheet.mode!=='profile') return; // sheet closed before this resolved
    S.sheet.garminStatus=data; render();
  }catch(e){ /* leave status as "checking" - not critical, user can retry by reopening */ }
}
function openGarminConnect(){ S.sheet.garminForm={mode:'password', email:'', password:'', token:'', busy:false}; render(); }
function garminUseToken(){ S.sheet.garminForm={mode:'token', token:'', busy:false}; render(); }
function closeGarminForm(){ S.sheet.garminForm=null; render(); }
async function connectGarmin(){
  const f=S.sheet.garminForm;
  if(!f.email || !f.password) return;
  f.busy=true; render();
  try{
    const r=await fetch(`${BACKEND_BASE}/garmin/connect`,{method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body:JSON.stringify({email:f.email, password:f.password})});
    const data=await r.json();
    if(!r.ok){ toast(t('garminConnectError')+(data.detail||r.statusText),'err'); f.busy=false; render(); return; }
    if(data.status==='mfa_required'){ garminUseToken(); toast(t('garminMfaNote')); return; }
    S.sheet.garminForm=null; S.sheet.garminStatus=null; render();
    toast(t('garminConnectedToast'),'ok');
    loadGarminStatus();
  }catch(e){
    toast(t('garminConnectError')+e.message,'err'); f.busy=false; render();
  }
}
async function connectGarminToken(){
  const f=S.sheet.garminForm;
  if(!f.token || !f.token.trim()) return;
  f.busy=true; render();
  try{
    const r=await fetch(`${BACKEND_BASE}/garmin/connect-token`,{method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body:JSON.stringify({token:f.token.trim()})});
    const data=await r.json();
    if(!r.ok){ toast(t('garminConnectError')+(data.detail||r.statusText),'err'); f.busy=false; render(); return; }
    S.sheet.garminForm=null; S.sheet.garminStatus=null; render();
    toast(t('garminConnectedToast'),'ok');
    loadGarminStatus();
  }catch(e){
    toast(t('garminConnectError')+e.message,'err'); f.busy=false; render();
  }
}
async function disconnectGarmin(){
  try{
    await fetch(`${BACKEND_BASE}/garmin/connection`,{method:'DELETE', headers:authHeaders()});
  }catch(e){ /* best-effort - status refresh below will reflect whatever actually happened */ }
  toast(t('garminDisconnectedToast'));
  loadGarminStatus();
}

/* ---- photo crop editor: drag to pan, slider to zoom, over a circular preview
   matching the final avatar shape, so the user picks the framing themselves
   instead of the app blindly center-cropping (which was cutting faces off) ---- */
function openPhotoCropper(img){
  const VIEW=240, OUT=480;
  const overlay=document.createElement('div');
  overlay.className='cropoverlay';
  overlay.innerHTML=`<div class="cropbox">
    <h2 class="disp">${t('cropTitle')}</h2>
    <div class="crophint">${t('cropHint')}</div>
    <div class="cropview" style="width:${VIEW}px; height:${VIEW}px"><img id="cropimg" draggable="false" alt=""></div>
    <input type="range" class="cropzoom" id="cropzoom" min="0" max="1" step="0.001" value="0">
    <div class="croprow">
      <button class="ghost" id="cropcancel">${t('cancel')}</button>
      <button class="primary disp" id="cropsave">${t('save')}</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  const imgEl=overlay.querySelector('#cropimg');
  const zoomEl=overlay.querySelector('#cropzoom');
  const viewEl=overlay.querySelector('.cropview');
  imgEl.src=img.src;

  const minScale=VIEW/Math.min(img.width,img.height);
  const maxScale=minScale*3;
  let scale=minScale, x=0, y=0;

  function apply(){
    imgEl.style.width=(img.width*scale)+'px';
    imgEl.style.height=(img.height*scale)+'px';
    imgEl.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px)`;
  }
  function clamp(){
    const w=img.width*scale, h=img.height*scale;
    const maxX=Math.max(0,(w-VIEW)/2), maxY=Math.max(0,(h-VIEW)/2);
    x=Math.min(maxX,Math.max(-maxX,x));
    y=Math.min(maxY,Math.max(-maxY,y));
  }
  clamp(); apply();

  let dragging=false, sx=0, sy=0, ox=0, oy=0;
  function ptPos(e){ const p=e.touches?e.touches[0]:e; return {cx:p.clientX, cy:p.clientY}; }
  function ptDown(e){ dragging=true; const p=ptPos(e); sx=p.cx; sy=p.cy; ox=x; oy=y; viewEl.style.cursor='grabbing'; }
  function ptMove(e){
    if(!dragging) return;
    const p=ptPos(e);
    x=ox+(p.cx-sx); y=oy+(p.cy-sy);
    clamp(); apply();
    e.preventDefault();
  }
  function ptUp(){ dragging=false; viewEl.style.cursor='grab'; }
  viewEl.addEventListener('mousedown', ptDown);
  window.addEventListener('mousemove', ptMove);
  window.addEventListener('mouseup', ptUp);
  viewEl.addEventListener('touchstart', ptDown, {passive:true});
  viewEl.addEventListener('touchmove', ptMove, {passive:false});
  viewEl.addEventListener('touchend', ptUp);

  zoomEl.addEventListener('input', ()=>{
    scale=minScale+(maxScale-minScale)*parseFloat(zoomEl.value);
    clamp(); apply();
  });

  function cleanup(){
    window.removeEventListener('mousemove', ptMove);
    window.removeEventListener('mouseup', ptUp);
    overlay.remove();
  }
  overlay.querySelector('#cropcancel').onclick=cleanup;
  overlay.querySelector('#cropsave').onclick=()=>{
    const canvas=document.createElement('canvas');
    canvas.width=OUT; canvas.height=OUT;
    const ctx=canvas.getContext('2d');
    const srcSize=VIEW/scale;
    const srcX0=img.width/2 - x/scale - srcSize/2;
    const srcY0=img.height/2 - y/scale - srcSize/2;
    try{
      ctx.drawImage(img, srcX0, srcY0, srcSize, srcSize, 0, 0, OUT, OUT);
      S.profile.photo=canvas.toDataURL('image/jpeg', 0.88);
      save(); render();
    }catch(e){
      // canvas taints on cross-origin images without proper CORS headers (can happen
      // for the Google avatar path) - fall back to using the source image untouched
      S.profile.photo=img.src; save(); render();
    }
    cleanup();
  };
}

function raceDraftDistStep(dir){
  const rd=S.sheet.raceDraft; let km=parseFloat(rd.km)||0;
  const step=km>=1? 0.5 : 0.05;

function bump(key,dir){ const d=S.sheet.draft; const tStep=S.sheet.timeStepMin||1;

/* ---- Garmin payload + send ---- */
/* S.sheet.dates drives scope for the whole send flow - a week's worth of dates
   or just the one day selected via openSendDay() - buildPayload/sendWeek/sendSheet
   all read from it instead of assuming "the whole visible week". */
function buildPayload(){
  const dates=S.sheet.dates||weekDates(S.offset); const workouts=[];
  dates.forEach(d=>dayWorkouts(d).forEach(w=>{
    workouts.push({ date:ymd(d), name:w.name, type:w.type, sport:w.sport||'running',
      warmupSec:w.warmupSec, cooldownSec:w.cooldownSec, garminWorkoutId:w.garminWorkoutId||null,
      blocks:w.blocks.map(b=> b.kind==='steady'
        ? {kind:'steady', mode:b.mode, value:b.value, pace:b.pace||null}
        : {kind:'repeat', reps:b.reps,
           work:{mode:b.work.mode, value:b.work.value},
           recovery:{mode:b.recovery.mode, value:b.recovery.value}} ),
      exercises:(w.exercises||[]).map(ex=>({category:ex.category, sets:ex.sets, reps:ex.reps,
        weightKg:ex.weightKg, restSec:ex.restSec})) });
  }));
  return { athlete:{ name:profileName(S.profile), maxHR:S.profile.maxHR, restHR:S.profile.restHR }, workouts };
}
function openSendWeek(){ S.sheet={mode:'send', payload:null, result:null, dates:weekDates(S.offset)}; render(); }
function openSendDay(){ S.sheet={mode:'send', payload:null, result:null, dates:[weekDates(S.offset)[S.sel]]}; render(); }
function showPayload(){ S.sheet.payload=JSON.stringify(buildPayload(),null,2); render(); }
async function sendWeek(){
  const url=BACKEND_URL;
  save();
  S.sheet.sending=true; render();
  const headers={'Content-Type':'application/json', ...authHeaders()};
  try{
    const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(buildPayload())});
    const data=await r.json();
    if(data.error==='needs_reauth'){ toast(t('garminNeedsReauthToast'),'err'); return; }
    if(data.error){ toast(t('serverErrorAlert')+data.error,'err'); return; }
    const results=data.results||[];
    // buildPayload() and the backend both iterate in this same day/workout order,
    // so results[i] is the outcome for the i-th workout - use that to link the
    // real Garmin workoutId back onto the plan entry for later activity matching,
    // and so the *next* send replaces this workout on Garmin instead of duplicating it.
    const dates=S.sheet.dates||weekDates(S.offset); let i=0;
    dates.forEach(d=>dayWorkouts(d).forEach(w=>{
      const res=results[i++];
      if(res && res.ok && res.workoutId) w.garminWorkoutId=res.workoutId;
    }));
    S.sheet.result=results; save();
  }catch(e){
    toast(t('sendFailedAlert')+e.message+t('sendFailedHint'),'err');
  }finally{
    S.sheet.sending=false; render();
  }
}
/* distance match (60%) + pace match vs the workout's own implied pace (40%);
   falls back to distance-only if there's no actual pace to compare (rare) */
function scoreWorkout(w){
  if(!w.actual) return null;
  const planned=workoutKm(w);
  if(!planned) return null;
  const distScore=Math.max(0, 100-Math.abs(w.actual.distanceKm-planned)/planned*100);
  const plannedSecs=totalSecs(w);
  const plannedPace=plannedSecs && planned? plannedSecs/planned : null;
  let paceScore=null;
  if(plannedPace && w.actual.paceSecPerKm){
    paceScore=Math.max(0, 100-Math.abs(w.actual.paceSecPerKm-plannedPace)/plannedPace*100);
  }
  return Math.round(paceScore!=null? distScore*0.6+paceScore*0.4 : distScore);
}
/* matches completed Garmin activities to plan entries (by garminWorkoutId) for any
   date in [since,until] present in S.plan - not tied to the currently viewed week,
   so it can run both for the manual "check" button and a silent background sync. */
async function fetchAndApplyActivities(since,until){
  const r=await fetch(`${BACKEND_BASE}/activities?since=${since}&until=${until}`,{headers:authHeaders()});
  const data=await r.json();
  if(data.error) return {matched:0, error:data.error};
  const acts=data.activities||[];
  const claimed=new Set();
  let matched=0;
  function applyActual(w,act,matchedByDate){
    w.done=true;
    w.actual={
      activityId:act.activityId, distanceKm:act.distanceKm, durationSec:act.durationSec,
      paceSecPerKm:act.paceSecPerKm, avgHR:act.avgHR, maxHR:act.maxHR, calories:act.calories,
      elevationGainM:act.elevationGainM, elevationLossM:act.elevationLossM,
      avgCadence:act.avgCadence, maxCadence:act.maxCadence,
      aerobicTrainingEffect:act.aerobicTrainingEffect, anaerobicTrainingEffect:act.anaerobicTrainingEffect,
      matchedByDate: !!matchedByDate,
    };
    claimed.add(act.activityId);
    matched++;
  }
  // pass 1: exact match - the watch was actually following the pushed structured
  // workout, so Garmin tagged the activity with its workoutId.
  Object.keys(S.plan).forEach(dateStr=>{
    if(dateStr<since || dateStr>until) return;
    S.plan[dateStr].forEach(w=>{
      if(!w.garminWorkoutId) return;
      const act=acts.find(a=>a.workoutId===w.garminWorkoutId && !claimed.has(a.activityId));
      if(act) applyActual(w,act,false);
    });
  });
  // pass 2: same-day fallback for a run that was actually done but not "started"
  // from the watch workout (e.g. a gym treadmill session, or a free run) - only
  // auto-link when a date has exactly one still-unmatched planned workout and
  // exactly one still-unclaimed Garmin activity, so there's no ambiguity about
  // which run belongs to which plan entry.
  Object.keys(S.plan).forEach(dateStr=>{
    if(dateStr<since || dateStr>until) return;
    const dayActs=acts.filter(a=>a.date===dateStr && !claimed.has(a.activityId));
    const unmatchedWorkouts=S.plan[dateStr].filter(w=>!w.actual);
    if(dayActs.length===1 && unmatchedWorkouts.length===1) applyActual(unmatchedWorkouts[0], dayActs[0], true);
  });
  return {matched};
}
async function checkCompleted(){
  const wk=weekDates(S.offset);
  try{
    const {matched,error}=await fetchAndApplyActivities(ymd(wk[0]), ymd(wk[6]));
    if(error==='needs_reauth'){ toast(t('garminNeedsReauthToast'),'err'); return; }
    if(error){ toast(t('serverErrorAlert')+error,'err'); return; }
    save(); render();
    toast(matched+' '+t('syncedSuffix'), matched>0?'ok':undefined);
  }catch(e){
    toast(t('sendFailedAlert')+e.message,'err');
  }
}
/* silent background sync on load - covers this week + last week so anything
   completed near a week boundary still gets picked up without user action */
async function autoCheckCompleted(){
  try{
    const until=ymd(new Date());
    const sinceD=new Date(); sinceD.setDate(sinceD.getDate()-13);
    const {matched}=await fetchAndApplyActivities(ymd(sinceD), until);
    if(matched){ save(); render(); }
  }catch(e){ /* best-effort - the manual button still works if this fails */ }
}

/* ---- swipe through days anywhere on screen (rolls into the next/previous week at the
   edges) - attached once to document (not re-bound per render like the old #strip-only
   version), so it must skip while a sheet/drawer/crop-editor is covering the screen,
   the same way initPullToRefresh() already does. */
function attachSwipe(){
  let x0=null,y0=null;
  document.addEventListener('touchstart',e=>{
    if(document.querySelector('.drawerscrim, .scrim.on, .cropoverlay')){ x0=null; return; }
    x0=e.touches[0].clientX; y0=e.touches[0].clientY;
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(x0==null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){
      // Advance in the reading direction: right in Hebrew (RTL), left in
      // English (LTR). The reverse gesture goes back a day.
      const forward=S.lang==='he' ? dx>0 : dx<0;
      const dir=forward?1:-1;
      let sel=S.sel+dir;
      if(sel>6){ S.offset++; sel=0; }
      else if(sel<0){ S.offset--; sel=6; }
      S.sel=sel; render();
    }
    x0=y0=null;
  },{passive:true});
}

function initPullToRefresh(){
  const THRESH=64, MAX=100;

  document.body.appendChild(el);
  const ball=document.getElementById('pullball');
  const icon=document.getElementById('pullicon');

  let y0=null, ready=false, active=false;

  document.addEventListener('touchstart', e=>{

    e.preventDefault();
    const dist=Math.min(MAX, dy*0.5);
    el.style.transition='none'; ball.style.transition='none';
    el.style.transform=`translateY(${dist-60}px)`;
    ball.style.opacity=String(Math.min(1, dist/THRESH));
    icon.style.transform=`rotate(${dy*1.2}deg)`;
    ready=dist>=THRESH*0.85;
  }, {passive:false});

  document.addEventListener('touchend', async ()=>{
    if(y0==null) return;
    y0=null;
    el.style.transition=''; ball.style.transition='';
    if(ready){
      active=true;
      el.style.transform='translateY(4px)';
      ball.style.opacity='1';
      ball.classList.add('spin');
      try{ await pullRefreshAction(); }
      finally{
        ball.classList.remove('spin');
        el.style.transform='translateY(-60px)';
        ball.style.opacity='0';
        active=false;
      }
    } else {
      el.style.transform='translateY(-60px)';
      ball.style.opacity='0';
    }
  }, {passive:true});
}
initPullToRefresh();
attachSwipe();

render();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
